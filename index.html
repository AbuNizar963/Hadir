  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const API = (window.__HADIR_API__ || "https://hadir-api.abunizar963.workers.dev").replace(/\/$/, "");
        const FALLBACK_MS = 120000;
        const iconUrl = new URL("./pwa-icon.svg", document.baseURI).href;
        const token = () => localStorage.getItem("hadir.api.token.employee") || localStorage.getItem("hadir.api.token.admin") || localStorage.getItem("hadir.api.token") || "";
        const sessionExists = () => Boolean(localStorage.getItem("hadir.session") || localStorage.getItem("hadir.manager_session"));
        const seenKey = "hadir.browser.notifications.seen";
        const seen = () => { try { return new Set(JSON.parse(localStorage.getItem(seenKey) || "[]")); } catch { return new Set(); } };
        const saveSeen = (set) => { try { localStorage.setItem(seenKey, JSON.stringify(Array.from(set).slice(-200))); } catch {} };
        let primed = false;
        let fallbackTimer = null;
        const show = (n) => {
          if (!("Notification" in window) || Notification.permission !== "granted") return;
          try { new Notification(n.title, { body: n.message, icon: iconUrl, tag: `hadir-${n.id}` }); } catch {}
        };
        const scheduleFallback = () => {
          if (fallbackTimer !== null) window.clearTimeout(fallbackTimer);
          if (document.visibilityState !== "visible") return;
          fallbackTimer = window.setTimeout(() => { fallbackTimer = null; void sync(); }, FALLBACK_MS);
        };
        const sync = async () => {
          if (!sessionExists()) { scheduleFallback(); return; }
          const t = token();
          if (!t) { scheduleFallback(); return; }
          try {
            const r = await fetch(`${API}/api/notifications`, { headers: { authorization: `Bearer ${t}` }, credentials: "include", cache: "no-store" });
            if (!r.ok) return;
            const rows = await r.json();
            if (!Array.isArray(rows)) return;
            const ids = seen();
            if (!primed) {
              rows.forEach(n => ids.add(n.id));
              primed = true;
              saveSeen(ids);
              return;
            }
            for (const n of rows) {
              if (ids.has(n.id)) continue;
              ids.add(n.id);
              show(n);
            }
            saveSeen(ids);
          } catch {} finally { scheduleFallback(); }
        };
        const ask = () => {
          if (!("Notification" in window) || !sessionExists()) return;
          if (Notification.permission === "default") void Notification.requestPermission();
        };
        const onDataChanged = () => { if (document.visibilityState === "visible") void sync(); };
        const onVisibility = () => { if (document.visibilityState === "visible") { ask(); void sync(); } else if (fallbackTimer !== null) { window.clearTimeout(fallbackTimer); fallbackTimer = null; } };
        window.addEventListener("hadir:cloud-data-changed", onDataChanged);
        window.addEventListener("online", onDataChanged);
        document.addEventListener("visibilitychange", onVisibility);
        window.setTimeout(() => { ask(); void sync(); }, 1500);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
    <style id="hadir-print-page-final">
      @page { size: A4 portrait; margin: 6mm; }
    </style>
  </body>
