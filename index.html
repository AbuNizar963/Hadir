  <body>
    <div id="root"></div>
    <script>
      (() => {
        const isStandalone = window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone === true || new URLSearchParams(location.search).get('pwa') === '1';
        if (!isStandalone) return;

        // A previously installed PWA can retain an older start URL such as /login.
        // Always normalize standalone launches to the single auth bootstrap entry.
        const path = location.pathname;
        if ((path === '/login' || path === '/manager/login') && new URLSearchParams(location.search).get('pwa') !== '1') {
          location.replace('/?pwa=1');
          return;
        }

        const isLoginRoute = path === '/login' || path === '/manager/login' || path === '/';
        if (!isLoginRoute) return;
        const splash = document.createElement('div');
        splash.id = 'hadir-auth-bootstrap';
        splash.dir = 'rtl';
        splash.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#0b0f14;color:#fff;font-family:Cairo,system-ui,sans-serif';
        splash.innerHTML = '<div style="text-align:center;padding:24px"><div style="font-size:24px;font-weight:800">حاضِر</div><div style="margin-top:10px;opacity:.72;font-size:14px">جاري التحقق من جلسة الدخول…</div></div>';
        document.body.appendChild(splash);
        const go = (user) => {
          const role = String(user?.role || '').toLowerCase();
          if (!user?.id) return false;
          if (['employee','staff'].includes(role)) { location.replace('/employee'); return true; }
          if (['owner','manager','supervisor','admin'].includes(role)) { location.replace('/manager'); return true; }
          return false;
        };
        const storedToken = () => {
          try {
            return localStorage.getItem('hadir_pwa_token') || localStorage.getItem('hadir.api.token.employee') || localStorage.getItem('hadir.api.token.admin') || localStorage.getItem('hadir.api.token') || '';
          } catch { return ''; }
        };
        (async () => {
          const token = storedToken();
          const headers = { accept: 'application/json' };
          if (token) headers.authorization = `Bearer ${token}`;
          try {
            const r = await fetch('/api/me', { credentials: 'include', cache: 'no-store', headers });
            if (r.ok) {
              const data = await r.json().catch(() => null);
              if (go(data?.user)) return;
            }
          } catch {}
          splash.remove();
        })();
      })();
    </script>
    <script>
      (() => {
        const API = (window.__HADIR_API__ || "https://hadir-api.abunizar963.workers.dev").replace(/\/$/, "");
        const token = () => localStorage.getItem("hadir.pwa_token") || localStorage.getItem("hadir_pwa_token") || localStorage.getItem("hadir.api.token.employee") || localStorage.getItem("hadir.api.token.admin") || localStorage.getItem("hadir.api.token") || "";
        const sessionExists = () => Boolean(localStorage.getItem("hadir.session") || localStorage.getItem("hadir.manager_session"));
        const seenKey = "hadir.browser.notifications.seen";
        const seen = () => { try { return new Set(JSON.parse(localStorage.getItem(seenKey) || "[]")); } catch { return new Set(); } };
        const saveSeen = (set) => { try { localStorage.setItem(seenKey, JSON.stringify(Array.from(set).slice(-200))); } catch {} };
        let primed = false;
        const show = (n) => {
          if (!("Notification" in window) || Notification.permission !== "granted") return;
          try { new Notification(n.title, { body: n.message, icon: "/favicon.svg", tag: `hadir-${n.id}` }); } catch {}
        };
        const sync = async () => {
          if (!sessionExists()) return;
          const t = token();
          if (!t) return;
          try {
            const r = await fetch(`${API}/api/notifications`, { headers: { authorization: `Bearer ${t}` }, credentials: "include", cache: "no-store" });
            if (!r.ok) return;
            const rows = await r.json();
            if (!Array.isArray(rows)) return;
            const ids = seen();
            if (!primed) { rows.forEach(n => ids.add(n.id)); primed = true; saveSeen(ids); return; }
            for (const n of rows) { if (ids.has(n.id)) continue; ids.add(n.id); show(n); }
            saveSeen(ids);
          } catch {}
        };
        const ask = () => {
          if (!("Notification" in window) || !sessionExists()) return;
          if (Notification.permission === "default") Notification.requestPermission().catch(() => undefined);
        };
        window.setTimeout(() => { ask(); void sync(); }, 1500);
        window.setInterval(() => { ask(); void sync(); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
