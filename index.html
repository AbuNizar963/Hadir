          width: 210mm !important;

        #root {
          width: 100% !important;

        /* Daily service report: let the complete report flow continuously.
           The previous rule only removed one break restriction; it did not
           clear inherited break-before/after rules that could still force the
           next group onto a fresh page. This remains strictly scoped to the
           printable daily report. */
        html body .service-report.service-report,
        html body .service-report.service-report * {
          break-before: auto !important;
          break-after: auto !important;
          page-break-before: auto !important;
          page-break-after: auto !important;
        }

        html body .service-report.service-report {
          width: 100% !important;
          max-width: none !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: visible !important;
        }

        html body .service-report.service-report > div:nth-child(2),
        html body .service-report.service-report > div:nth-child(2) > .grid {
          display: block !important;

        html body .service-report.service-report > div:nth-child(2) > .grid > div {

          padding: 0 !important;
          break-inside: auto !important;
          page-break-inside: auto !important;
        }

          width: 100% !important;
          max-width: 100% !important;
          border-collapse: collapse !important;
          table-layout: fixed !important;
        }

          display: table-header-group !important;
        }

          display: table-row-group !important;
        }

          break-inside: avoid !important;
          page-break-inside: avoid !important;

  <body>
    <div id="root"></div>
    <script>
      (() => {
        const API = (window.__HADIR_API__ || "https://hadir-api.abunizar963.workers.dev").replace(/\/$/, "");
        const iconUrl = new URL("./pwa-icon.svg", document.baseURI).href;
        const token = () => localStorage.getItem("hadir.api.token.employee") || localStorage.getItem("hadir.api.token.admin") || localStorage.getItem("hadir.api.token") || "";
        const sessionExists = () => Boolean(localStorage.getItem("hadir.session") || localStorage.getItem("hadir.manager_session"));
        const seenKey = "hadir.browser.notifications.seen";
        const seen = () => { try { return new Set(JSON.parse(localStorage.getItem(seenKey) || "[]")); } catch { return new Set(); } };
        const saveSeen = (set) => { try { localStorage.setItem(seenKey, JSON.stringify(Array.from(set).slice(-200))); } catch {} };
        let primed = false;
        const show = (n) => {
          if (!("Notification" in window) || Notification.permission !== "granted") return;
          try { new Notification(n.title, { body: n.message, icon: iconUrl, tag: `hadir-${n.id}` }); } catch {}
        };
        const sync = async () => {
          if (!sessionExists()) return;
          const t = token();
          if (!t) return;
          try {
            const r = await fetch(`${API}/api/notifications`, { headers: { authorization: `Bearer ${t}` }, credentials: "include", cache: "no-store" });
            if (!r.ok) return;
            const rows = await r.json();
            if (!Array.isArray(rows)) return;
            const ids = seen();
            if (!primed) {
              rows.forEach(n => ids.add(n.id));
              primed = true;
              saveSeen(ids);
              return;
            }
            for (const n of rows) {
              if (ids.has(n.id)) continue;
              ids.add(n.id);
              show(n);
            }
            saveSeen(ids);
          } catch {}
        };
        const ask = () => {
          if (!("Notification" in window) || !sessionExists()) return;
          if (Notification.permission === "default") void Notification.requestPermission();
        };
        window.setTimeout(() => { ask(); void sync(); }, 1500);
        window.setInterval(() => { ask(); void sync(); }, 15000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
