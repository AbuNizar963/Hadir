name: Migrate session security into source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-session-security-source.yml"

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor == 'AbuNizar963'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --package-lock=false

      - name: Apply existing security patch to source
        working-directory: backend
        run: node scripts/patch-session-security.mjs

      - name: Format migrated TypeScript sources
        run: npx --yes prettier@3.6.2 --write backend/src/index.ts backend/src/entry.ts backend/src/ai-entry.ts backend/src/employee-save-production-gateway.ts backend/src/workforce.ts

      - name: Remove deploy-time patch dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-api.yml')
          text = path.read_text(encoding='utf-8')
          block = '''      - name: Apply session security patch\n        working-directory: backend\n        run: node scripts/patch-session-security.mjs\n'''
          if block not in text:
              raise SystemExit('deploy workflow patch step not found')
          path.write_text(text.replace(block, ''), encoding='utf-8')
          PY
          rm backend/scripts/patch-session-security.mjs

      - name: Validate migrated source
        working-directory: backend
        run: npx wrangler deploy --dry-run

      - name: Verify removed dependency
        run: |
          if grep -R "patch-session-security" .github/workflows backend --exclude-dir=node_modules; then
            echo "patch-session-security dependency still exists"
            exit 1
          fi

      - name: Commit migrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.ts backend/src/entry.ts backend/src/ai-entry.ts backend/src/employee-save-production-gateway.ts backend/src/workforce.ts .github/workflows/deploy-api.yml backend/scripts/patch-session-security.mjs .github/workflows/migrate-session-security-source.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor(auth): make session security canonical in source"
          git push origin HEAD:main
