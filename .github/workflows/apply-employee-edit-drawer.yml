name: Apply employee edit drawer patch

on:
  push:
    branches:
      - fix/employee-edit-drawer
    paths:
      - .github/workflows/apply-employee-edit-drawer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch employee editor UX
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/ManagerEmployees.tsx")
          text = path.read_text(encoding="utf-8")

          old_scroll = '''    window.scrollTo({
            top: 0,
            behavior: "smooth",
          });
          '''
          if old_scroll not in text:
              raise SystemExit("Expected employee edit scroll block was not found")
          text = text.replace(old_scroll, "", 1)

          old_form = '''          <section className="hud-card p-5 sm:p-6">'''
          new_form = '''          <section
            className={
              editingId
                ? "fixed inset-y-0 right-0 z-[70] w-full max-w-2xl overflow-y-auto rounded-none border-l border-border/80 bg-card p-5 shadow-2xl sm:p-6"
                : "hud-card p-5 sm:p-6"
            }
          >'''
          if old_form not in text:
              raise SystemExit("Expected employee form section was not found")
          text = text.replace(old_form, new_form, 1)

          old_header = '''            <div className="mb-5 flex items-start justify-between gap-3">'''
          new_header = '''            <div className="sticky top-0 z-10 -mx-5 -mt-5 mb-5 flex items-start justify-between gap-3 border-b border-border/70 bg-card/95 px-5 py-4 backdrop-blur sm:-mx-6 sm:-mt-6 sm:px-6">'''
          if old_header not in text:
              raise SystemExit("Expected employee form header was not found")
          text = text.replace(old_header, new_header, 1)

          old_footer = '''            <div className="mt-5 flex justify-end border-t border-border/60 pt-4">'''
          new_footer = '''            <div className="sticky bottom-0 z-10 mt-5 -mx-5 flex justify-end border-t border-border/70 bg-card/95 px-5 py-4 backdrop-blur sm:-mx-6 sm:px-6">'''
          if old_footer not in text:
              raise SystemExit("Expected employee form footer was not found")
          text = text.replace(old_footer, new_footer, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx
          git diff --cached --check
          git commit -m "fix(employees): use side drawer for employee editing"
          git push origin HEAD:fix/employee-edit-drawer
