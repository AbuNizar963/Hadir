name: Apply employee edit drawer patch

on:
  push:
    branches:
      - fix/employee-edit-drawer
    paths:
      - .github/workflows/apply-employee-edit-drawer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch employee editor UX
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/ManagerEmployees.tsx")
          text = path.read_text(encoding="utf-8")

          # Remove the old page-jump behaviour if it still exists.
          old_scroll = '''    window.scrollTo({
      top: 0,
      behavior: "smooth",
    });
'''
          text = text.replace(old_scroll, "", 1)

          # Turn the edit form into a responsive side drawer while keeping
          # the add form in its normal document position.
          old_form = '''        {showForm && (
          <section className="hud-card p-5 sm:p-6">'''
          new_form = '''        {showForm && (
          <section
            className={
              editingId
                ? "fixed inset-y-0 right-0 z-[70] w-full max-w-2xl overflow-y-auto border-l border-border/80 bg-card p-5 shadow-2xl sm:p-6"
                : "hud-card p-5 sm:p-6"
            }
          >'''
          if old_form in text:
              text = text.replace(old_form, new_form, 1)

          old_header = '''            <div className="mb-5 flex items-start justify-between gap-3">'''
          new_header = '''            <div className="sticky top-0 z-10 -mx-5 -mt-5 mb-5 flex items-start justify-between gap-3 border-b border-border/70 bg-card/95 px-5 py-4 backdrop-blur sm:-mx-6 sm:-mt-6 sm:px-6">'''
          if old_header in text:
              text = text.replace(old_header, new_header, 1)

          old_footer = '''            <div className="mt-5 flex justify-end border-t border-border/60 pt-4">'''
          new_footer = '''            <div className="sticky bottom-0 z-10 mt-5 -mx-5 flex justify-end border-t border-border/70 bg-card/95 px-5 py-4 backdrop-blur sm:-mx-6 sm:px-6">'''
          if old_footer in text:
              text = text.replace(old_footer, new_footer, 1)

          # Add a drawer backdrop so editing is clearly modal and the list
          # behind it cannot steal attention.
          marker = '''        {showForm && (
          <section'''
          backdrop = '''        {editingId && showForm && (
          <button
            type="button"
            aria-label="إغلاق محرر الموظف"
            className="fixed inset-0 z-[60] bg-black/40 backdrop-blur-[1px]"
            onClick={() => {
              setEditingId(null);
              setForm(emptyForm);
              setShowForm(false);
            }}
          />
        )}

        {showForm && (
          <section'''
          if marker in text and "aria-label=\"إغلاق محرر الموظف\"" not in text:
              text = text.replace(marker, backdrop, 1)

          path.write_text(text, encoding="utf-8")

      - name: Verify patch changed the source
        shell: bash
        run: |
          grep -q 'fixed inset-y-0 right-0' src/pages/ManagerEmployees.tsx
          grep -q 'aria-label="إغلاق محرر الموظف"' src/pages/ManagerEmployees.tsx
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx
          if git diff --cached --quiet; then
            echo "Employee drawer patch is already applied."
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(employees): use side drawer for employee editing"
          git push origin HEAD:fix/employee-edit-drawer
