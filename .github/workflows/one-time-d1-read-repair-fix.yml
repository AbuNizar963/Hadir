# One-time canonical repair; removed after Actions verification.
name: One-time D1 read repair fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-d1-read-repair-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and fix request query bindings
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'backend/src/attendance-engine.ts';
          let source = fs.readFileSync(path, 'utf8');

          const oldSql = "AND employee_id=COALESCE(NULLIF(?, ''), employee_id) UNION ALL SELECT employee_id AS employeeId,type,status,start_date AS startDate,end_date AS endDate,created_at AS createdAt FROM requests WHERE status IN ('approved','confirmed') AND type IN ('leave','permission') AND start_date IS NULL AND substr(created_at,1,10)=? AND (? = '' OR employee_id=?)";
          const newSql = "AND employee_id=COALESCE(NULLIF(?, ''), employee_id) UNION ALL SELECT employee_id AS employeeId,type,status,start_date AS startDate,end_date AS endDate,created_at AS createdAt FROM requests WHERE status IN ('approved','confirmed') AND type IN ('leave','permission') AND start_date IS NULL AND substr(created_at,1,10)=? AND employee_id=COALESCE(NULLIF(?, ''), employee_id)";
          if (!source.includes(oldSql)) throw new Error('request UNION filter anchor not found');
          source = source.replace(oldSql, newSql);

          const oldBind = '.bind(day, day, requestedEmployeeId, day, requestedEmployeeId)';
          const newBind = '.bind(day, day, requestedEmployeeId, day, requestedEmployeeId)';
          if (!source.includes(newBind)) throw new Error('request bindings anchor not found');

          fs.writeFileSync(path, source);
          NODE
          npx --yes prettier@3.6.2 --write backend/src/attendance-engine.ts
          git diff --check
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "fix: correct scoped request query bindings"
          git push
