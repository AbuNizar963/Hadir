name: Repair employee VIP toggle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'repair employee VIP toggle')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch VIP handler only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text()
          pattern = re.compile(r'  const updateWorkforce = async \(e: Employee, patch: \{ isVip\?: boolean; autoCheckIn\?: boolean; autoCheckOut\?: boolean \}\) => \{.*?\n  \};', re.S)
          replacement = '''  const updateWorkforce = async (e: Employee, patch: { isVip?: boolean; autoCheckIn?: boolean; autoCheckOut?: boolean }) => {
    if (!isOwner) return;
    try {
      const result = await updateBackendEmployee(e.id, patch);
      const saved = result.employee;
      if (!saved) throw new Error("تعذر قراءة الموظف بعد الحفظ.");
      setEmployees((prev) => prev.map((item) => item.id === e.id ? { ...item, ...saved } : item));
      setError(null);
    } catch (err) {
      setError(err instanceof Error ? err.message : "تعذر حفظ إعدادات Workforce.");
      await load(false);
    }
  };'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('VIP handler not found')
          p.write_text(s2)
          PY
      - name: Verify
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair employee VIP toggle"
          git push
      - name: Remove repair workflow
        if: always()
        run: |
          git rm -f .github/workflows/repair-vip-final.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove VIP repair workflow" || true
          git push || true
