name: Fix Rotation Daily Damascus Day
on:
  push:
    branches: [fix/rotation-daily-attendance]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix rotation daily utc day') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply exact correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/attendance-engine-commands.ts')
          text=p.read_text()
          old='const dailyRows=dailyMode?(rows.results||[]).filter((r:any)=>String(r.timestamp||"").slice(0,10)===localDay):periodRows;'
          new='const dailyRows=dailyMode?(rows.results||[]).filter((r:any)=>{const ts=Date.parse(String(r.timestamp||""));return Number.isFinite(ts)&&dateKey(new Date(ts),TZ)===localDay;}):periodRows;'
          if text.count(old)!=1: raise SystemExit(f'expected exact dailyRows expression once, found {text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
      - name: Validate backend
        working-directory: backend
        run: |
          npm install --package-lock=false
          npm run check
      - name: Validate frontend bundle
        run: |
          npm install --no-audit --no-fund
          npx vite build
          test -f dist/index.html
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine-commands.ts
          git diff --cached --check
          git commit -m "fix rotation daily utc day"
          git push
