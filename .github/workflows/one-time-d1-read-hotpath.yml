# One-time canonical repair; removed after the source migration is verified.
name: One-time D1 read hot-path repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-d1-read-hotpath.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow daily-status attendance window
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'backend/src/attendance-engine.ts';
          let source = fs.readFileSync(path, 'utf8');

          const oldWindow = 'from = localDateTimeUtc(addDays(day, -8), "00:00").toISOString(),\n    to = localDateTimeUtc(addDays(day, 9), "00:00").toISOString();';
          const newWindow = 'to = localDateTimeUtc(addDays(day, 2), "00:00").toISOString();';
          if (!source.includes(oldWindow)) throw new Error('daily-status broad window anchor not found');
          source = source.replace(oldWindow, newWindow);

          const oldRotationWindow = 'addDays(day, -Math.max(7, maxRotationOn - 1)),';
          const newRotationWindow = 'addDays(day, -Math.max(1, maxRotationOn - 1)),';
          if (!source.includes(oldRotationWindow)) throw new Error('daily-status rotation history anchor not found');
          source = source.replace(oldRotationWindow, newRotationWindow);

          fs.writeFileSync(path, source);
          NODE
          npx --yes prettier@3.6.2 --write backend/src/attendance-engine.ts
          git diff --check
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "perf: narrow daily status attendance window"
          git push
