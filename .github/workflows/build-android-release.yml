name: Build Hadir Android Flutter Release

on:
  # Publish only after a pull request is merged into the Flutter app branch.
  pull_request:
    branches:
      - flutter-mobile-app
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hadir-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-flutter:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Verify Flutter mobile app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate Android wrapper when incomplete
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            HADIR_LIB_BACKUP="$RUNNER_TEMP/hadir-lib"
            HADIR_TEST_BACKUP="$RUNNER_TEMP/hadir-test"
            rm -rf "$HADIR_LIB_BACKUP" "$HADIR_TEST_BACKUP"
            cp -a lib "$HADIR_LIB_BACKUP"
            if [ -d test ]; then cp -a test "$HADIR_TEST_BACKUP"; fi
            flutter create --platforms=android --project-name hadir .
            rm -rf lib
            mv "$HADIR_LIB_BACKUP" lib
            if [ -d "$HADIR_TEST_BACKUP" ]; then
              rm -rf test
              mv "$HADIR_TEST_BACKUP" test
            fi
          fi
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          test -x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Configure verified Gradle distribution for CI
        run: bash scripts/configure-gradle-wrapper-ci.sh
      - name: Verify Flutter project structure
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/build.gradle
          test -f ios/Runner.xcodeproj/project.pbxproj
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android-release:
    needs: verify-flutter
    name: Build signed Android APK
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout Flutter release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Determine unique Android release version
        id: version
        shell: bash
        run: |
          git fetch --force --tags origin
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'android-v1.0.*' | sort -V | tail -n 1)"
          if [ -n "$existing_tag" ]; then
            version_code="${existing_tag##*.}"
          else
            latest_version="$(git tag --list 'android-v1.0.*' | sed -nE 's/^android-v1\.0\.([0-9]+)$/\1/p' | sort -n | tail -n 1)"
            version_code=$(("${latest_version:-0}" + 1))
          fi
          if ! [[ "$version_code" =~ ^[0-9]+$ ]] || [ "$version_code" -lt 1 ]; then
            echo "Could not determine a valid Android release version."
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Selected Android release version: 1.0.$version_code"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate Android wrapper when incomplete
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            HADIR_LIB_BACKUP="$RUNNER_TEMP/hadir-lib"
            HADIR_TEST_BACKUP="$RUNNER_TEMP/hadir-test"
            rm -rf "$HADIR_LIB_BACKUP" "$HADIR_TEST_BACKUP"
            cp -a lib "$HADIR_LIB_BACKUP"
            if [ -d test ]; then cp -a test "$HADIR_TEST_BACKUP"; fi
            flutter create --platforms=android --project-name hadir .
            rm -rf lib
            mv "$HADIR_LIB_BACKUP" lib
            if [ -d "$HADIR_TEST_BACKUP" ]; then
              rm -rf test
              mv "$HADIR_TEST_BACKUP" test
            fi
          fi
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          test -x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Configure verified Gradle distribution for CI
        run: bash scripts/configure-gradle-wrapper-ci.sh
      - run: flutter pub get
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate production signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Restore production signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hadir-release.keystore"
          test -s "$RUNNER_TEMP/hadir-release.keystore"
      - name: Build signed Flutter release APKs
        env:
          HADIR_RELEASE_KEYSTORE: ${{ runner.temp }}/hadir-release.keystore
          HADIR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HADIR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HADIR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          bash ../scripts/run-gradle-with-network-retry.sh ./gradlew assembleRelease \
            "-PhadirVersionCode=${{ steps.version.outputs.version_code }}" \
            "-PhadirVersionName=1.0.${{ steps.version.outputs.version_code }}" \
            --stacktrace
          for abi in armeabi-v7a arm64-v8a x86_64 universal; do
            test -f "app/build/outputs/apk/release/app-${abi}-release.apk"
          done
          mkdir -p ../build/app/outputs/flutter-apk
          cp app/build/outputs/apk/release/app-universal-release.apk ../build/app/outputs/flutter-apk/app-release.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "../build/app/outputs/flutter-apk/app-${abi}-release.apk"
          done
      - name: Verify target SDK, package name and version
        shell: bash
        env:
          HADIR_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if ! command -v apkanalyzer >/dev/null 2>&1 && [ ! -x "$APKANALYZER" ]; then echo "apkanalyzer was not found"; exit 1; fi
          APKANALYZER="$(command -v apkanalyzer || echo "$APKANALYZER")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          PACKAGE_NAME="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          echo "Hadir Flutter APK targetSdkVersion=$TARGET_SDK"
          echo "Hadir Flutter APK applicationId=$PACKAGE_NAME"
          echo "Hadir Flutter APK versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          test "$TARGET_SDK" = "36"
          test "$PACKAGE_NAME" = "com.hadir.attendance"
          test "$VERSION_CODE" = "$HADIR_VERSION_CODE"
          test "$VERSION_NAME" = "1.0.$HADIR_VERSION_CODE"
      - name: Verify production APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Print production certificate fingerprint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/hadir-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA256:|Alias name:"
      - name: Upload signed APK files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-production-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  verify-ios:
    needs: verify-flutter
    name: Verify iOS build
    runs-on: macos-latest
    steps:
      - name: Checkout Flutter source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate iOS project files when incomplete
        shell: bash
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            flutter create --platforms=ios --project-name hadir .
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter build ios --no-codesign

  publish-android-release:
    needs:
      - build-android-release
      - verify-ios
    name: Publish Android APK Release
    runs-on: ubuntu-latest
    steps:
      - name: Download signed APK files
        uses: actions/download-artifact@v4
        with:
          name: hadir-android-production-apks
          path: release-apks
      - name: Publish production APK release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          HADIR_VERSION_CODE: ${{ needs.build-android-release.outputs.version_code }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          APK_FILES=(release-apks/*.apk)
          test "${#APK_FILES[@]}" -eq 4
          TAG="android-v1.0.${HADIR_VERSION_CODE}"
          TITLE="HADIR Android 1.0.${HADIR_VERSION_CODE}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${APK_FILES[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${APK_FILES[@]}" --repo "${{ github.repository }}" --title "$TITLE" --target "${{ github.sha }}" --notes "تحديث تلقائي لتطبيق حاضر Android Flutter. versionCode=${HADIR_VERSION_CODE}. يتوفر APK مناسب لكل معمارية مع نسخة شاملة احتياطية."
          fi
