name: Build Hadir Android Flutter Release

on:
  push:
    branches:
      - Apps
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref containing the Flutter project to build'
        required: true
        default: 'Apps'
        type: string

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build signed Flutter Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate Android wrapper when incomplete
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            # flutter create may rewrite the root Flutter scaffold. Keep the
            # real application sources intact while generating only the
            # missing Android wrapper files.
            HADIR_LIB_BACKUP="$RUNNER_TEMP/hadir-lib"
            HADIR_TEST_BACKUP="$RUNNER_TEMP/hadir-test"
            rm -rf "$HADIR_LIB_BACKUP" "$HADIR_TEST_BACKUP"
            cp -a lib "$HADIR_LIB_BACKUP"
            if [ -d test ]; then cp -a test "$HADIR_TEST_BACKUP"; fi
            flutter create --platforms=android --project-name hadir .
            rm -rf lib
            mv "$HADIR_LIB_BACKUP" lib
            if [ -d "$HADIR_TEST_BACKUP" ]; then
              rm -rf test
              mv "$HADIR_TEST_BACKUP" test
            fi
          fi
          rm -f android/build.gradle.kts android/settings.gradle.kts android/app/build.gradle.kts
          test -x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
      - name: Verify Flutter Android project
        shell: bash
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/core/api.dart
          test -f lib/core/session.dart
          test -f android/app/build.gradle
          grep -q "applicationId 'com.hadir.attendance'" android/app/build.gradle
          echo "Flutter Android source is present at commit $(git rev-parse HEAD)"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 SDK and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate production signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }
      - name: Restore production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hadir-release.keystore"
          test -s "$RUNNER_TEMP/hadir-release.keystore"
      - name: Build signed Flutter release APK
        env:
          HADIR_RELEASE_KEYSTORE: ${{ runner.temp }}/hadir-release.keystore
          HADIR_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HADIR_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HADIR_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PhadirVersionCode=${{ github.run_number }} \
            -PhadirVersionName=1.0.${{ github.run_number }} \
            --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          mkdir -p ../build/app/outputs/flutter-apk
          cp app/build/outputs/apk/release/app-release.apk ../build/app/outputs/flutter-apk/app-release.apk
      - name: Verify target SDK, package name and version
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if ! command -v apkanalyzer >/dev/null 2>&1 && [ ! -x "$APKANALYZER" ]; then echo "apkanalyzer was not found"; exit 1; fi
          APKANALYZER="$(command -v apkanalyzer || echo "$APKANALYZER")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          PACKAGE_NAME="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          echo "Hadir Flutter APK targetSdkVersion=$TARGET_SDK"
          echo "Hadir Flutter APK applicationId=$PACKAGE_NAME"
          echo "Hadir Flutter APK versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          test "$TARGET_SDK" = "36"
          test "$PACKAGE_NAME" = "com.hadir.attendance"
          test "$VERSION_CODE" = "${{ github.run_number }}"
          test "$VERSION_NAME" = "1.0.${{ github.run_number }}"
      - name: Verify production APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Print production certificate fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/hadir-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA256:|Alias name:"
      - name: Upload production APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-flutter-production-api36-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish production APK release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="android-v1.0.${{ github.run_number }}"
          TITLE="HADIR Android 1.0.${{ github.run_number }}"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$APK" --repo "${{ github.repository }}" --title "$TITLE" --target "${{ github.sha }}" --notes "تحديث تلقائي لتطبيق حاضر Android Flutter. versionCode=${{ github.run_number }}."
          fi
