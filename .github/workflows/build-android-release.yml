name: Build Hadir Android Native Release

on:
  push:
    branches:
      - android-native
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Git ref containing the standalone native Android project to build'
        required: true
        default: 'android-native'
        type: string

permissions:
  contents: read

jobs:
  build-android-release:
    name: Build signed native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}
          fetch-depth: 1

      - name: Verify native Android project files
        shell: bash
        run: |
          test -f mobile/native-android/settings.gradle.kts || { echo "Missing mobile/native-android/settings.gradle.kts"; exit 1; }
          test -f mobile/native-android/build.gradle.kts || { echo "Missing mobile/native-android/build.gradle.kts"; exit 1; }
          test -f mobile/native-android/app/build.gradle.kts || { echo "Missing mobile/native-android/app/build.gradle.kts"; exit 1; }
          echo "Native Android source is present at commit $(git rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Locate Android signing tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root is not set"; exit 1; }
          test -d "$SDK_ROOT" || { echo "Android SDK root does not exist: $SDK_ROOT"; exit 1; }

          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          fi
          test -n "$APKSIGNER" || { echo "apksigner was not found under $SDK_ROOT/build-tools"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner is not executable: $APKSIGNER"; exit 1; }

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" --version

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          GRADLE_VERSION="8.11.1"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"
          curl --fail --silent --show-error --location \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$GRADLE_ZIP"
          rm -rf "$GRADLE_HOME"
          mkdir -p "$GRADLE_HOME"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle"
          echo "GRADLE_HOME=$RUNNER_TEMP/gradle-${GRADLE_VERSION}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Validate production signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hadir-release.keystore"
          test -s "$RUNNER_TEMP/hadir-release.keystore"

      - name: Build native release APK
        working-directory: mobile/native-android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign production APK
        shell: bash
        working-directory: mobile/native-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -x "$APKSIGNER" || { echo "apksigner is unavailable: $APKSIGNER"; exit 1; }
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/hadir-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Verify target SDK and package name
        shell: bash
        working-directory: mobile/native-android
        run: |
          APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if ! command -v apkanalyzer >/dev/null 2>&1 && [ ! -x "$APKANALYZER" ]; then
            echo "apkanalyzer was not found"
            exit 1
          fi
          APKANALYZER="$(command -v apkanalyzer || echo "$APKANALYZER")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk app-release-signed.apk)"
          PACKAGE_NAME="$("$APKANALYZER" manifest application-id app-release-signed.apk)"
          echo "Hadir Native APK targetSdkVersion=$TARGET_SDK"
          echo "Hadir Native APK applicationId=$PACKAGE_NAME"
          test "$TARGET_SDK" = "36"
          test "$PACKAGE_NAME" = "com.hadir.attendance"

      - name: Print production certificate fingerprint
        shell: bash
        working-directory: mobile/native-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/hadir-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA256:|Alias name:"

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-native-production-api36-apk
          path: mobile/native-android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
