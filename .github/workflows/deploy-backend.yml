name: Deploy Hadir API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install Wrangler
        run: bun add --dev wrangler@latest
      - name: Store Worker secrets
        env:
          JWT_SECRET: ${{ secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.HADIR_OWNER_PASSWORD }}
        run: |
          printf '%s' "$JWT_SECRET" | bunx wrangler secret put JWT_SECRET
          printf '%s' "$OWNER_USERNAME" | bunx wrangler secret put OWNER_USERNAME
          printf '%s' "$OWNER_PASSWORD" | bunx wrangler secret put OWNER_PASSWORD
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
