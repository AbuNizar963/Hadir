name: Build Hadir Android TWA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-twa:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build unsigned release APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Create temporary signing key for this build
        shell: bash
        working-directory: mobile/android
        run: |
          keytool -genkeypair \
            -keystore hadir-release.keystore \
            -storepass "${{ github.run_id }}-HadirStore" \
            -keypass "${{ github.run_id }}-HadirKey" \
            -alias hadir \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hadir, OU=Hadir, O=Hadir, L=Unknown, ST=Unknown, C=TR"

      - name: Sign APK
        shell: bash
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ github.run_id }}-HadirStore
          KEY_PASSWORD: ${{ github.run_id }}-HadirKey
        run: |
          apksigner sign \
            --ks hadir-release.keystore \
            --ks-key-alias hadir \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          apksigner verify --verbose app-release-signed.apk

      - name: Verify target SDK is Android 16 / API 36
        shell: bash
        working-directory: mobile/android
        run: |
          TARGET_SDK="$(apkanalyzer manifest target-sdk app-release-signed.apk)"
          echo "Hadir APK targetSdkVersion=$TARGET_SDK"
          test "$TARGET_SDK" = "36"

      - name: Print signing fingerprint
        shell: bash
        working-directory: mobile/android
        run: |
          keytool -list -v \
            -keystore hadir-release.keystore \
            -storepass "${{ github.run_id }}-HadirStore" \
            -alias hadir | grep -E "SHA256:|Alias name:"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-api36-apk
          path: mobile/android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
