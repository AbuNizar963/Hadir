name: Build Hadir Android TWA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/android-webapk-warning

permissions:
  contents: read

jobs:
  build-android-twa:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK and Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Locate Android signing tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root is not set"; exit 1; }
          test -d "$SDK_ROOT" || { echo "Android SDK root does not exist: $SDK_ROOT"; exit 1; }

          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          fi
          test -n "$APKSIGNER" || { echo "apksigner was not found under $SDK_ROOT/build-tools"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner is not executable: $APKSIGNER"; exit 1; }

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" --version

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Validate production signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing secret: ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing secret: ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing secret: ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Restore production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hadir-release.keystore"
          test -s "$RUNNER_TEMP/hadir-release.keystore"

      - name: Verify production certificate matches Digital Asset Links
        shell: bash
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          EXPECTED="$(keytool -list -v -keystore "$RUNNER_TEMP/hadir-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '\r')"
          test -n "$EXPECTED" || { echo "Unable to read production SHA-256 fingerprint"; exit 1; }
          echo "Production certificate SHA-256: $EXPECTED"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://hadir-9rq.pages.dev/.well-known/assetlinks.json \
            -o "$RUNNER_TEMP/assetlinks.json"
          python3 - "$RUNNER_TEMP/assetlinks.json" "$EXPECTED" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2].strip().upper()
          data = json.load(open(path, encoding="utf-8"))
          fingerprints = {
              fp.strip().upper()
              for statement in data
              for fp in statement.get("target", {}).get("sha256_cert_fingerprints", [])
          }
          if expected not in fingerprints:
              raise SystemExit(f"Production certificate {expected} is not present in live assetlinks.json")
          print("Digital Asset Links verification: OK")
          PY

      - name: Build unsigned release APK
        working-directory: mobile/android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign production APK
        shell: bash
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -x "$APKSIGNER" || { echo "apksigner is unavailable: $APKSIGNER"; exit 1; }
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/hadir-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app-release-signed.apk

      - name: Verify target SDK and package name
        shell: bash
        working-directory: mobile/android
        run: |
          TARGET_SDK="$(command -v apkanalyzer >/dev/null 2>&1 && apkanalyzer manifest target-sdk app-release-signed.apk || "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk app-release-signed.apk)"
          PACKAGE_NAME="$(command -v apkanalyzer >/dev/null 2>&1 && apkanalyzer manifest application-id app-release-signed.apk || "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest application-id app-release-signed.apk)"
          echo "Hadir APK targetSdkVersion=$TARGET_SDK"
          echo "Hadir APK applicationId=$PACKAGE_NAME"
          test "$TARGET_SDK" = "36"
          test "$PACKAGE_NAME" = "com.hadir.attendance"

      - name: Verify TWA manifest components
        shell: bash
        working-directory: mobile/android
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print app-release-signed.apk > "$RUNNER_TEMP/manifest.txt"
          grep -q "com.google.androidbrowserhelper.trusted.LauncherActivity" "$RUNNER_TEMP/manifest.txt"
          grep -q "com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity" "$RUNNER_TEMP/manifest.txt"
          grep -q "com.hadir.attendance.fileprovider" "$RUNNER_TEMP/manifest.txt"
          grep -q "hadir-9rq.pages.dev" "$RUNNER_TEMP/manifest.txt"
          echo "TWA manifest verification: OK"

      - name: Print production certificate fingerprint
        shell: bash
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/hadir-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | grep -E "SHA256:|Alias name:"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-production-twa-api36-apk
          path: mobile/android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
