name: Repair admin dashboard parity
on:
  push:
    branches: [Apps]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Apply targeted dashboard visual parity fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/administration/pages/admin_mobile_dashboard_page.dart')
          s = p.read_text(encoding='utf-8')
          old = """                const SizedBox(width: 14),\n                Container(\n                  width: 52,\n                  height: 52,\n                  decoration: BoxDecoration(\n                    color: _primary.withValues(alpha: .12),\n                    borderRadius: BorderRadius.circular(16),\n                  ),\n                  child: Icon(Icons.monitor_heart_outlined, color: _primary, size: 28),\n                ),\n"""
          s = s.replace(old, '')
          s = s.replace("childAspectRatio: 1.48,", "childAspectRatio: 1.62,")
          old_row = """                Row(\n                  mainAxisAlignment: MainAxisAlignment.center,\n                  children: [\n                    Container(\n                      width: 46,\n                      height: 46,\n                      decoration: BoxDecoration(\n                        color: color.withValues(alpha: .10),\n                        borderRadius: BorderRadius.circular(15),\n                      ),\n                      child: Icon(card.icon, color: color, size: 25),\n                    ),\n                    const SizedBox(width: 12),\n                    Text(\n                      '${card.value}',\n                      style: TextStyle(color: color, fontSize: 28, fontWeight: FontWeight.w900),\n                    ),\n                  ],\n                ),\n"""
          new_row = old_row + """                const SizedBox(height: 5),\n                Text(\n                  'عرض القائمة',\n                  style: TextStyle(color: color.withValues(alpha: .78), fontSize: 10.5, fontWeight: FontWeight.w700),\n                ),\n"""
          if old_row in s:
              s = s.replace(old_row, new_row)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/administration/pages/admin_mobile_dashboard_page.dart
          git commit -m 'fix: match admin dashboard cards to reference UI' || true
          git push origin Apps
      - name: Remove temporary repair workflow and trigger Flutter CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .github/workflows/repair-admin-dashboard-parity.yml
          git add .github/workflows/repair-admin-dashboard-parity.yml
          git commit -m 'chore: remove temporary dashboard repair workflow' || true
          git push origin Apps
          gh workflow run flutter-mobile.yml --ref Apps
