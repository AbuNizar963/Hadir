name: Deploy Hadir Frontend Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "scripts/build.mjs"
      - "scripts/patch-manager-employee-save.mjs"
      - "scripts/patch-employee-form-defaults.mjs"
      - ".github/workflows/deploy-frontend-recovery.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
        env:
          VITE_BASE_PATH: /
      - name: Deploy production Pages deployment
        run: |
          npx wrangler@4 pages deploy dist --project-name hadir \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$GITHUB_SHA"
      - name: Verify production build
        env:
          PRODUCTION_URL: https://hadir-9rq.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              "$PRODUCTION_URL/build-version.json?recovery=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/build-version.json; then
              python - <<'PY'
          import json, os, sys
          with open('/tmp/build-version.json', encoding='utf-8') as f:
              data=json.load(f)
          if data.get('commitSha') == os.environ['GITHUB_SHA']:
              print('Production serves the recovery deployment commit.')
              sys.exit(0)
          print('Production is still serving:', data.get('commitSha'))
          sys.exit(1)
          PY
            fi
            sleep 5
          done
          echo 'Production build verification timed out after 6 minutes.'
          exit 1
