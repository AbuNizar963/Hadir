name: Apply workforce controls source-of-truth fix

on:
  push:
    branches:
      - fix/workforce-controls-source-of-truth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch workforce controls refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/pages/ManagerEmployees.tsx")
          text = path.read_text()

          old_load = '''  const load = useCallback(async (showSpinner = true) => {\n    if (showSpinner) setLoading(true);\n\n    try {\n      const rows = backendEnabled\n        ? await getBackendEmployees()\n        : getEmployees();\n\n      const next = Array.isArray(rows) ? rows : [];\n\n      setEmployees((prev) =>\n        JSON.stringify(prev) === JSON.stringify(next) ? prev : next,\n      );'''

          new_load = '''  const load = useCallback(async (showSpinner = true) => {\n    if (showSpinner) setLoading(true);\n\n    try {\n      const rows = backendEnabled\n        ? await getBackendEmployees()\n        : getEmployees();\n\n      let next = Array.isArray(rows) ? rows : [];\n\n      // Workforce controls have a dedicated canonical API. Merge those values\n      // after the normal employee refresh so the 15s polling cycle can never\n      // overwrite a persisted VIP/automatic-attendance flag with stale data.\n      if (backendEnabled) {\n        try {\n          const token = localStorage.getItem("hadir.api.token.admin") || "";\n          const api = String(\n            import.meta.env.VITE_API_URL ||\n              "https://hadir-api.abunizar963.workers.dev",\n          ).replace(/\\/$/, "");\n          const response = await fetch(`${api}/api/manager/workforce-controls`, {\n            headers: {\n              authorization: `Bearer ${token}`,\n              "content-type": "application/json",\n            },\n            credentials: "include",\n            cache: "no-store",\n          });\n          const controls = await response.json().catch(() => []);\n          if (response.ok && Array.isArray(controls)) {\n            const byId = new Map(\n              controls.map((control: any) => [String(control.id), control]),\n            );\n            next = next.map((employee) => {\n              const control = byId.get(String(employee.id));\n              if (!control) return employee;\n              return {\n                ...employee,\n                isVip: Boolean(control.isVip),\n                autoCheckIn: Boolean(control.autoCheckIn),\n                autoCheckOut: Boolean(control.autoCheckOut),\n              };\n            });\n          }\n        } catch {}\n      }\n\n      setEmployees((prev) =>\n        JSON.stringify(prev) === JSON.stringify(next) ? prev : next,\n      );'''

          if old_load not in text:
              raise SystemExit("Expected load block was not found; aborting without changes.")
          text = text.replace(old_load, new_load, 1)

          old_update = '''      if (!res.ok) throw new Error(typeof data.error === "string" ? data.error : "تعذر حفظ إعدادات Workforce.");\n      setEmployees((prev) => prev.map((x) => x.id === e.id ? { ...x, ...patch } : x));'''

          new_update = '''      if (!res.ok) throw new Error(typeof data.error === "string" ? data.error : "تعذر حفظ إعدادات Workforce.");\n      // Re-read the persisted value from the canonical workforce endpoint.\n      // This removes optimistic-only state and verifies that D1 is the source of truth.\n      await load(false);'''

          if old_update not in text:
              raise SystemExit("Expected workforce update block was not found; aborting without changes.")
          text = text.replace(old_update, new_update, 1)

          path.write_text(text)
          PY

      - name: Commit source change and remove patch workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-workforce-controls-root-fix.yml
          git add src/pages/ManagerEmployees.tsx .github/workflows/apply-workforce-controls-root-fix.yml
          git diff --cached --check
          git commit -m "fix(workforce): keep persisted controls through employee refresh"
          git push