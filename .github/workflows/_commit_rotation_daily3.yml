name: Commit Rotation Daily Source
on:
  push:
    branches: [fix/rotation-daily-attendance]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply rotation daily attendance') && !contains(github.event.head_commit.message, 'cleanup temp workflows') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Make audited patch idempotent and apply it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/_apply_rotation_daily.py')
          text=p.read_text()
          old="""def replace(path, old, new, count=1):\n    p=Path(path); text=p.read_text(); n=text.count(old)\n    if n != count: raise SystemExit(f'{path}: expected {count} matches, found {n}')\n    p.write_text(text.replace(old,new,count))"""
          new="""def replace(path, old, new, count=1):\n    p=Path(path); text=p.read_text()\n    if new in text: return\n    n=text.count(old)\n    if n != count: raise SystemExit(f'{path}: expected {count} matches, found {n}')\n    p.write_text(text.replace(old,new,count))"""
          if text.count(old)!=1: raise SystemExit('patch helper not found exactly once')
          p.write_text(text.replace(old,new,1))
          PY
          python3 scripts/_apply_rotation_daily.py
      - name: Check diff
        run: git diff --check
      - name: Validate backend
        working-directory: backend
        run: |
          npm install --package-lock=false
          npm run check
      - name: Validate frontend bundle
        run: |
          npm install --no-audit --no-fund
          npx vite build
          test -f dist/index.html
      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/schema.sql backend/migrations/0020_rotation_daily_attendance.sql backend/src/employee-save-production-gateway.ts backend/src/index.ts backend/src/attendance-engine.ts backend/src/attendance-engine-commands.ts backend/src/professional-attendance-fact-builder.ts src/types/index.ts src/pages/ManagerEmployees.tsx scripts/_apply_rotation_daily.py
          git diff --cached --check
          git commit -m "apply rotation daily attendance"
          git push
