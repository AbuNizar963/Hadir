name: Deploy Hadir Frontend to Cloudflare Pages
run-name: Deploy Hadir Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lockb'
      - 'bun.lock'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig*.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  VITE_API_URL: https://hadir-api.abunizar963.workers.dev
  VITE_BASE_PATH: /
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID.' >&2; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN.' >&2; exit 1; }

      - name: Validate API origin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VITE_API_URL" == "https://hadir-api.abunizar963.workers.dev" ]] || {
            echo 'Unexpected API origin.' >&2
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript strict check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -f dist/manifest.webmanifest || true
          cp dist/index.html dist/404.html
          echo 'Frontend bundle verified.'

      - name: Setup Node.js for Wrangler
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Authenticate with Cloudflare
        run: npx wrangler@latest whoami

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler@latest pages project list --json | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              try {
                const x=JSON.parse(s);
                const a=Array.isArray(x)?x:(x.result||[]);
                process.exit(a.some(p=>p.name==="hadir")?0:1);
              } catch { process.exit(1); }
            })'; then
            echo 'Cloudflare Pages project "hadir" already exists.'
          else
            npx wrangler@latest pages project create hadir --production-branch main
          fi

      - name: Deploy frontend to Cloudflare Pages
        run: npx wrangler@latest pages deploy dist --project-name hadir --branch main --commit-dirty=true
