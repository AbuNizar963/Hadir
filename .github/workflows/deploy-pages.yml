name: Deploy Hadir to GitHub Pages
run-name: Deploy Hadir

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /Hadir/
  VITE_API_URL: https://hadir-api.abunizar963.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate API origin
        run: |
          set -euo pipefail
          case "$VITE_API_URL" in
            https://hadir-api.abunizar963.workers.dev) echo "Using canonical Hadir API: $VITE_API_URL" ;;
            *) echo "Unexpected API origin: $VITE_API_URL" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: bun install

      - name: TypeScript strict check
        run: bun run typecheck

      - name: Build production bundle
        run: bun run build

      - name: Verify Pages artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/index.html
          echo "Production bundle verified."

      - name: Make SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
