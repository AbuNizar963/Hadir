name: Deploy Hadir to GitHub Pages
run-name: Deploy Hadir

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lockb'
      - 'bun.lock'
      - 'vite.config.*'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_API_URL: https://hadir-api.abunizar963.workers.dev
  VITE_BASE_PATH: /Hadir/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: TypeScript strict check
        run: bun run typecheck

      - name: ESLint
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Prepare GitHub Pages SPA routes
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          cp dist/index.html dist/404.html
          mkdir -p dist/employee dist/employee/scan/attendance dist/employee/scan/departure
          mkdir -p dist/login dist/manager dist/manager/login
          cp dist/index.html dist/employee/index.html
          cp dist/index.html dist/employee/scan/attendance/index.html
          cp dist/index.html dist/employee/scan/departure/index.html
          cp dist/index.html dist/login/index.html
          cp dist/index.html dist/manager/index.html
          cp dist/index.html dist/manager/login/index.html
          echo 'SPA route entry points prepared.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
