name: Deploy Hadir to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /Hadir/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Resolve Hadir Worker URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
          HADIR_WORKERS_SUBDOMAIN: ${{ secrets.HADIR_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          if [[ -n "${HADIR_API_URL:-}" ]]; then
            echo "VITE_API_URL=${HADIR_API_URL%/}" >> "$GITHUB_ENV"
            exit 0
          fi
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          SCRIPT="hadir-api"

          account_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" || true)
          if [[ -z "$account_json" ]]; then
            desired="${HADIR_WORKERS_SUBDOMAIN:-abunizar963}"
            account_json=$(curl -fsS --max-time 20 -X PUT "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" -d "{\"subdomain\":\"${desired}\"}")
          fi
          subdomain=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || !x.result?.subdomain) { console.error(JSON.stringify(x.errors||x)); process.exit(1) }; process.stdout.write(x.result.subdomain)' "$account_json")

          worker_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}")
          enabled=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.success) { console.error(JSON.stringify(x.errors||x)); process.exit(1) }; process.stdout.write(String(Boolean(x.result?.enabled)))' "$worker_json")
          if [[ "$enabled" != "true" ]]; then
            curl -fsS --max-time 20 -X POST "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}" -d '{"enabled":true}' >/dev/null
          fi

          echo "VITE_API_URL=https://${SCRIPT}.${subdomain}.workers.dev" >> "$GITHUB_ENV"
          echo "Resolved Hadir API endpoint: https://${SCRIPT}.${subdomain}.workers.dev"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Make SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
