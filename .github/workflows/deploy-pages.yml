name: Deploy Hadir to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /Hadir/
  VITE_API_URL: https://hadir-api.abunizar963.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VITE_API_URL}" 
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "VITE_API_URL must start with https://"; exit 1 ;;
          esac
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 "${VITE_API_URL}/api/health")"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "Cloudflare Worker health check passed."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Make SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
