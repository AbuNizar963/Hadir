name: Deploy Hadir API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$JWT_SECRET" ]] || missing+=(JWT_SECRET_or_HADIR_JWT_SECRET)
          [[ -n "$OWNER_USERNAME" ]] || missing+=(OWNER_USERNAME_or_HADIR_OWNER_USERNAME)
          [[ -n "$OWNER_PASSWORD" ]] || missing+=(OWNER_PASSWORD_or_HADIR_OWNER_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare temporary Worker secrets
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('fs');
          const values = {
            JWT_SECRET: process.env.JWT_SECRET,
            OWNER_USERNAME: process.env.OWNER_USERNAME,
            OWNER_PASSWORD: process.env.OWNER_PASSWORD
          };
          if (Object.values(values).some(v => !v)) throw new Error('Required Worker secret is empty');
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(values) + '\n', {mode: 0o600});
          NODE

      - name: Validate Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --secrets-file .worker-secrets.json

      - name: Deploy Worker with D1 and Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .worker-secrets.json

      - name: Ensure workers.dev endpoint and discover public URL
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          WORKER="hadir-api"

          account_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}")
          subdomain=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || !x.result?.subdomain) process.exit(1); process.stdout.write(x.result.subdomain)' "$account_json")
          echo "Workers.dev subdomain: ${subdomain}.workers.dev"

          worker_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/scripts/${WORKER}/subdomain" "${AUTH[@]}")
          enabled=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(Boolean(x.result?.enabled)))' "$worker_json")
          if [[ "$enabled" != "true" ]]; then
            echo "Enabling ${WORKER} on workers.dev"
            curl -fsS --max-time 20 -X POST "${API}/accounts/${ACCOUNT}/workers/scripts/${WORKER}/subdomain" "${AUTH[@]}" -d '{"enabled":true}' >/tmp/hadir-subdomain.json
          fi

          URL="https://${WORKER}.${subdomain}.workers.dev"
          printf '%s\n' "$URL" > /tmp/hadir-worker-url
          echo "Worker endpoint: $URL"

      - name: Verify deployed API and initialize owner in D1
        shell: bash
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" && -f /tmp/hadir-worker-url ]]; then BASE_URL=$(cat /tmp/hadir-worker-url); fi
          if [[ -z "$BASE_URL" ]]; then echo 'Worker URL was not discovered' >&2; exit 1; fi
          BASE_URL="${BASE_URL%/}"
          echo "Checking $BASE_URL/api/health"
          for i in {1..12}; do
            if curl -fsS --max-time 15 "$BASE_URL/api/health"; then
              echo
              break
            fi
            if [[ "$i" == "12" ]]; then
              echo "Worker health check failed" >&2
              exit 1
            fi
            sleep 5
          done

          echo "Checking owner login without printing credentials"
          HTTP_CODE=$(curl -sS -o /tmp/hadir-login.json -w '%{http_code}' --max-time 15 \
            -H 'content-type: application/json' \
            -d "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.OWNER_USERNAME,password:process.env.OWNER_PASSWORD}))')" \
            "$BASE_URL/api/auth/login")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Owner login verification failed with HTTP $HTTP_CODE" >&2
            cat /tmp/hadir-login.json >&2 || true
            exit 1
          fi
          node -e 'const x=require("/tmp/hadir-login.json"); if(!x.token || !x.user || x.user.role!=="owner") process.exit(1); console.log("Owner account is present and login works")'

      - name: Remove temporary secrets and deployment response
        if: always()
        run: rm -f .worker-secrets.json /tmp/hadir-login.json /tmp/hadir-subdomain.json /tmp/hadir-worker-url
