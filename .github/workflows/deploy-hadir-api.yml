name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$JWT_SECRET" ]] || missing+=(JWT_SECRET_or_HADIR_JWT_SECRET)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare Worker secret
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          node -e 'const fs=require("fs");const v=process.env.JWT_SECRET;if(!v)throw new Error("JWT_SECRET is empty");fs.writeFileSync(".worker-secrets.json",JSON.stringify({JWT_SECRET:v})+"\n",{mode:0o600});'

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@latest

      - name: Validate Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --secrets-file .worker-secrets.json

      - name: Apply D1 migrations to Hadir production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .worker-secrets.json

      - name: Ensure workers.dev endpoint and resolve public URL
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HADIR_WORKERS_SUBDOMAIN: ${{ secrets.HADIR_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          SCRIPT="hadir-api"

          account_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" || true)
          if [[ -z "$account_json" ]]; then
            desired="${HADIR_WORKERS_SUBDOMAIN:-abunizar963}"
            echo "No workers.dev account subdomain was returned; creating/using: $desired"
            account_json=$(curl -fsS --max-time 20 -X PUT "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" -d "{\"subdomain\":\"${desired}\"}")
          fi
          subdomain=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.success || !x.result?.subdomain) { console.error(JSON.stringify(x.errors||x)); process.exit(1) }; process.stdout.write(x.result.subdomain)' "$account_json")

          worker_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}")
          enabled=$(node -e 'const x=JSON.parse(process.argv[1]); if(!x.success) { console.error(JSON.stringify(x.errors||x)); process.exit(1) }; process.stdout.write(String(Boolean(x.result?.enabled)))' "$worker_json")
          if [[ "$enabled" != "true" ]]; then
            curl -fsS --max-time 20 -X POST "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}" -d '{"enabled":true}' >/dev/null
          fi

          URL="https://${SCRIPT}.${subdomain}.workers.dev"
          printf '%s\n' "$URL" > /tmp/hadir-worker-url
          echo "Hadir Worker endpoint: $URL"

      - name: Verify Worker, D1 binding and first-run state
        shell: bash
        env:
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" && -f /tmp/hadir-worker-url ]]; then BASE_URL=$(cat /tmp/hadir-worker-url); fi
          [[ -n "$BASE_URL" ]] || { echo 'Worker URL was not resolved' >&2; exit 1; }
          BASE_URL="${BASE_URL%/}"
          echo "Checking $BASE_URL/api/health"
          HEALTH=$(curl -fsS --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("Worker and D1 are connected. ownerInitialized="+x.ownerInitialized)' "$HEALTH"
          BOOT=$(curl -fsS --max-time 20 "$BASE_URL/api/bootstrap")
          echo "$BOOT"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.bootstrap!==true && x.bootstrap!==false){console.error("Bootstrap endpoint is invalid");process.exit(1)}console.log("First-run bootstrap endpoint OK")' "$BOOT"

      - name: Remove temporary files
        if: always()
        run: rm -f .worker-secrets.json /tmp/hadir-worker-url
