name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f src/entry.ts
          test -f package.json
          grep -Fq '"name": "hadir-api"' wrangler.jsonc
          grep -Fq '"binding": "DB"' wrangler.jsonc
          grep -Fq '"binding": "PROFILE_IMAGES"' wrangler.jsonc
          grep -Fq '"bucket_name": "hadir-profile-images"' wrangler.jsonc
          grep -Fq '"name": "REALTIME"' wrangler.jsonc

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ -n "$CF_ACCOUNT" ]] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Authenticate with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Verify D1 is reachable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 list

      - name: Verify R2 binding configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"binding": "PROFILE_IMAGES"' wrangler.jsonc
          grep -Fq '"bucket_name": "hadir-profile-images"' wrangler.jsonc
          echo 'R2 binding configured for existing bucket hadir-profile-images.'

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote

      - name: Inspect production D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute Hadir --remote --command "SELECT name, type FROM sqlite_master WHERE type IN ('table','index') ORDER BY type,name;"
          npx wrangler d1 execute Hadir --remote --command "SELECT id, username, name, role, active, created_at FROM admin_accounts ORDER BY created_at;"

      - name: Configure JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_JWT_SECRET: ${{ secrets.JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CONFIGURED_JWT_SECRET" ]] || { echo 'Missing JWT_SECRET GitHub secret.' >&2; exit 1; }
          printf '%s' "$CONFIGURED_JWT_SECRET" | npx wrangler secret put JWT_SECRET

      - name: Configure owner recovery secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_OWNER_RECOVERY_CODE: ${{ secrets.OWNER_RECOVERY_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CONFIGURED_OWNER_RECOVERY_CODE" ]] || { echo 'Missing OWNER_RECOVERY_CODE GitHub secret.' >&2; exit 1; }
          printf '%s' "$CONFIGURED_OWNER_RECOVERY_CODE" | npx wrangler secret put OWNER_RECOVERY_CODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify canonical deployed Worker and D1
        env:
          HADIR_API_URL: https://hadir-api.abunizar963.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL%/}"
          HEALTH=$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("Worker/D1 healthy")' "$HEALTH"
          BOOT_STATUS=$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$BASE_URL/api/bootstrap")
          cat /tmp/bootstrap.json
          [[ "$BOOT_STATUS" == "200" || "$BOOT_STATUS" == "401" ]] || { echo "Unexpected bootstrap status: $BOOT_STATUS" >&2; exit 1; }
