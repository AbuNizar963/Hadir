name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$JWT_SECRET" ]] || missing+=(JWT_SECRET_or_HADIR_JWT_SECRET)
          if (( ${#missing[@]} )); then printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2; exit 1; fi

      - name: Prepare Worker secret
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          node -e 'const fs=require("fs");const v=process.env.JWT_SECRET;if(!v)throw new Error("JWT_SECRET is empty");fs.writeFileSync(".worker-secrets.json",JSON.stringify({JWT_SECRET:v})+"\n",{mode:0o600});'

      - name: Validate Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --secrets-file .worker-secrets.json

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote

      - name: Deploy Worker and capture workers.dev URL
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --secrets-file .worker-secrets.json 2>&1 | tee /tmp/hadir-deploy.log
          URL=$(grep -Eo 'https://hadir-api\.[A-Za-z0-9.-]+\.workers\.dev' /tmp/hadir-deploy.log | tail -1 || true)
          if [[ -z "$URL" ]]; then
            URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/hadir-deploy.log | tail -1 || true)
          fi
          if [[ -z "$URL" ]]; then
            echo 'Cloudflare deployed the Worker but Wrangler did not return a workers.dev URL.' >&2
            echo 'Set HADIR_API_URL to the Worker URL only if the account has a custom route/domain.' >&2
            exit 1
          fi
          printf '%s\n' "$URL" > /tmp/hadir-worker-url
          echo "Worker URL: $URL"

      - name: Verify Worker and D1
        shell: bash
        env:
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" && -f /tmp/hadir-worker-url ]]; then BASE_URL=$(cat /tmp/hadir-worker-url); fi
          [[ -n "$BASE_URL" ]] || { echo 'Worker URL was not discovered' >&2; exit 1; }
          BASE_URL="${BASE_URL%/}"
          echo "Checking $BASE_URL/api/health"
          HEALTH=$(curl -fsS --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("D1 binding OK; ownerInitialized="+x.ownerInitialized)' "$HEALTH"

      - name: Remove temporary files
        if: always()
        run: rm -f .worker-secrets.json /tmp/hadir-worker-url /tmp/hadir-deploy.log
