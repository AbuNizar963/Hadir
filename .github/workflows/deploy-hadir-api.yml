name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ -n "$CF_ACCOUNT" ]] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.123.0

      - name: Authenticate with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Verify D1 is reachable
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 list

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote

      - name: Configure JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_JWT_SECRET: ${{ secrets.JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CONFIGURED_JWT_SECRET" ]]; then
            echo 'Missing JWT_SECRET GitHub secret.' >&2
            exit 1
          fi
          printf '%s' "$CONFIGURED_JWT_SECRET" | npx wrangler secret put JWT_SECRET

      - name: Configure owner recovery secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_OWNER_RECOVERY_CODE: ${{ secrets.OWNER_RECOVERY_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CONFIGURED_OWNER_RECOVERY_CODE" ]]; then
            echo 'Missing OWNER_RECOVERY_CODE GitHub secret.' >&2
            exit 1
          fi
          printf '%s' "$CONFIGURED_OWNER_RECOVERY_CODE" | npx wrangler secret put OWNER_RECOVERY_CODE

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed Worker and D1
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${VITE_API_URL:-}"
          [[ -n "$BASE_URL" ]] || { echo 'Missing VITE_API_URL GitHub secret.' >&2; exit 1; }
          BASE_URL="${BASE_URL%/}"
          [[ "$BASE_URL" == https://* ]] || { echo 'VITE_API_URL must use HTTPS.' >&2; exit 1; }

          echo "Checking $BASE_URL/api/health"
          HEALTH=$(curl -fsS --retry 3 --retry-delay 2 --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("Worker and D1 are healthy; ownerInitialized="+x.ownerInitialized)' "$HEALTH"

          echo "Checking $BASE_URL/api/bootstrap availability"
          BOOT_STATUS=$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' --retry 3 --retry-delay 2 --max-time 20 "$BASE_URL/api/bootstrap")
          cat /tmp/bootstrap.json
          if [[ "$BOOT_STATUS" == "200" ]]; then
            node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/bootstrap.json","utf8"));if(typeof x.bootstrap!=="boolean"){console.error("Bootstrap endpoint returned invalid JSON");process.exit(1)}console.log("Bootstrap endpoint OK")'
          elif [[ "$BOOT_STATUS" == "401" ]]; then
            echo 'Bootstrap endpoint is protected by authentication/edge policy; health check passed, so deployment verification continues.'
          else
            echo "Bootstrap endpoint returned unexpected HTTP status: $BOOT_STATUS" >&2
            exit 1
          fi
