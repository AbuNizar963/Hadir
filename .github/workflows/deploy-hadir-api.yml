name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare JWT secret
        shell: bash
        env:
          CONFIGURED_JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -n "$CONFIGURED_JWT_SECRET" ]]; then
            printf '%s' "$CONFIGURED_JWT_SECRET" > /tmp/hadir-jwt-secret
          else
            node -e "const c=require('crypto'); process.stdout.write(c.randomBytes(48).toString('base64url'))" > /tmp/hadir-jwt-secret
            echo 'JWT_SECRET GitHub secret is not configured; generated a strong deployment secret.'
          fi
          chmod 600 /tmp/hadir-jwt-secret

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@latest

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote --yes

      - name: Deploy Worker and JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/hadir-jwt-secret | npx wrangler secret put JWT_SECRET
          npx wrangler deploy

      - name: Ensure workers.dev endpoint
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HADIR_WORKERS_SUBDOMAIN: ${{ secrets.HADIR_WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          SCRIPT="hadir-api"

          account_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" || true)
          if [[ -z "$account_json" ]]; then
            desired="${HADIR_WORKERS_SUBDOMAIN:-abunizar963}"
            account_json=$(curl -fsS --max-time 20 -X PUT "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" -d "{\"subdomain\":\"${desired}\"}")
          fi
          subdomain=$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.success||!x.result?.subdomain){console.error(JSON.stringify(x.errors||x));process.exit(1)}process.stdout.write(x.result.subdomain)' "$account_json")

          worker_json=$(curl -fsS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}")
          enabled=$(node -e 'const x=JSON.parse(process.argv[1]);if(!x.success){console.error(JSON.stringify(x.errors||x));process.exit(1)}process.stdout.write(String(Boolean(x.result?.enabled)))' "$worker_json")
          if [[ "$enabled" != "true" ]]; then
            curl -fsS --max-time 20 -X POST "${API}/accounts/${ACCOUNT}/workers/scripts/${SCRIPT}/subdomain" "${AUTH[@]}" -d '{"enabled":true}' >/dev/null
          fi

          echo "https://${SCRIPT}.${subdomain}.workers.dev" > /tmp/hadir-worker-url
          echo "Hadir Worker endpoint: https://${SCRIPT}.${subdomain}.workers.dev"

      - name: Verify Worker and D1
        shell: bash
        env:
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" && -f /tmp/hadir-worker-url ]]; then BASE_URL=$(cat /tmp/hadir-worker-url); fi
          [[ -n "$BASE_URL" ]] || { echo 'Worker URL was not resolved' >&2; exit 1; }
          BASE_URL="${BASE_URL%/}"

          HEALTH=$(curl -fsS --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("D1 binding OK; ownerInitialized="+x.ownerInitialized)' "$HEALTH"

          BOOT=$(curl -fsS --max-time 20 "$BASE_URL/api/bootstrap")
          echo "$BOOT"
          node -e 'const x=JSON.parse(process.argv[1]);if(typeof x.bootstrap!=="boolean"){console.error("Bootstrap endpoint invalid");process.exit(1)}console.log("First-run bootstrap OK")' "$BOOT"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/hadir-worker-url /tmp/hadir-jwt-secret
