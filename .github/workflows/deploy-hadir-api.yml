name: Deploy Hadir API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$JWT_SECRET" ]] || missing+=(JWT_SECRET_or_HADIR_JWT_SECRET)
          [[ -n "$OWNER_USERNAME" ]] || missing+=(OWNER_USERNAME_or_HADIR_OWNER_USERNAME)
          [[ -n "$OWNER_PASSWORD" ]] || missing+=(OWNER_PASSWORD_or_HADIR_OWNER_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare temporary Worker secrets
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const fs = require('fs');
          const values = {
            JWT_SECRET: process.env.JWT_SECRET,
            OWNER_USERNAME: process.env.OWNER_USERNAME,
            OWNER_PASSWORD: process.env.OWNER_PASSWORD
          };
          if (Object.values(values).some(v => !v)) throw new Error('Required Worker secret is empty');
          fs.writeFileSync('.worker-secrets.json', JSON.stringify(values) + '\n', {mode:0o600});
          NODE

      - name: Validate Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --secrets-file .worker-secrets.json

      - name: Deploy Worker with D1 and Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .worker-secrets.json

      - name: Ensure workers.dev endpoint and discover public URL
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCOUNT="$CLOUDFLARE_ACCOUNT_ID"
          WORKER="hadir-api"

          # The account-level workers.dev subdomain may not exist yet.
          # Cloudflare uses GET to read it and PUT to create it.
          account_json=$(curl -sS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" || true)
          subdomain=$(node -e '
            const x=JSON.parse(process.argv[1]||"{}");
            if (x.success && x.result?.subdomain) process.stdout.write(x.result.subdomain);
          ' "$account_json")

          if [[ -z "$subdomain" ]]; then
            echo "No workers.dev account subdomain found; creating one"
            # Use the Worker name as the account subdomain when available.
            create_json=$(curl -fsS --max-time 20 -X PUT "${API}/accounts/${ACCOUNT}/workers/subdomain" "${AUTH[@]}" -d '{"subdomain":"abunizar963"}')
            subdomain=$(node -e '
              const x=JSON.parse(process.argv[1]);
              if(!x.success || !x.result?.subdomain) { console.error(JSON.stringify(x.errors||x)); process.exit(1); }
              process.stdout.write(x.result.subdomain);
            ' "$create_json")
          fi

          echo "Workers.dev subdomain: ${subdomain}.workers.dev"

          worker_json=$(curl -sS --max-time 20 "${API}/accounts/${ACCOUNT}/workers/scripts/${WORKER}/subdomain" "${AUTH[@]}" || true)
          enabled=$(node -e '
            const x=JSON.parse(process.argv[1]||"{}");
            process.stdout.write(String(Boolean(x.success && x.result?.enabled)));
          ' "$worker_json")

          if [[ "$enabled" != "true" ]]; then
            echo "Enabling ${WORKER} on workers.dev"
            enable_json=$(curl -fsS --max-time 20 -X POST "${API}/accounts/${ACCOUNT}/workers/scripts/${WORKER}/subdomain" "${AUTH[@]}" -d '{"enabled":true}')
            node -e '
              const x=JSON.parse(process.argv[1]);
              if(!x.success || x.result?.enabled!==true) { console.error(JSON.stringify(x.errors||x)); process.exit(1); }
            ' "$enable_json"
          fi

          URL="https://${WORKER}.${subdomain}.workers.dev"
          printf '%s\n' "$URL" > /tmp/hadir-worker-url
          echo "Worker endpoint: $URL"

      - name: Verify D1 and initialize owner from Worker secrets
        shell: bash
        env:
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" && -f /tmp/hadir-worker-url ]]; then BASE_URL=$(cat /tmp/hadir-worker-url); fi
          if [[ -z "$BASE_URL" ]]; then echo 'Worker URL was not discovered' >&2; exit 1; fi
          BASE_URL="${BASE_URL%/}"

          echo "Checking Worker and D1 binding"
          HEALTH=$(curl -fsS --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || x.database!=="D1") { console.error("Worker/D1 health check failed"); process.exit(1) }' "$HEALTH"

          echo "Initializing/verifying owner account in D1 without printing credentials"
          HTTP_CODE=$(curl -sS -o /tmp/hadir-login.json -w '%{http_code}' --max-time 20 \
            -H 'content-type: application/json' \
            -d "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.OWNER_USERNAME,password:process.env.OWNER_PASSWORD}))')" \
            "$BASE_URL/api/auth/login")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Owner login verification failed with HTTP $HTTP_CODE" >&2
            cat /tmp/hadir-login.json >&2 || true
            exit 1
          fi
          node -e 'const x=require("/tmp/hadir-login.json"); if(!x.token || !x.user || x.user.role!=="owner") process.exit(1); console.log("Owner account is present in D1 and login works")'

      - name: Remove temporary secrets and deployment response
        if: always()
        run: rm -f .worker-secrets.json /tmp/hadir-login.json /tmp/hadir-subdomain.json /tmp/hadir-worker-url
