name: Deploy Hadir API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          [[ -n "$CF_ACCOUNT" ]] || { echo 'Missing CLOUDFLARE_ACCOUNT_ID' >&2; exit 1; }

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.123.0

      - name: Validate Worker bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply Hadir --remote --yes

      - name: Configure JWT secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIGURED_JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CONFIGURED_JWT_SECRET" ]]; then
            printf '%s' "$CONFIGURED_JWT_SECRET" | npx wrangler secret put JWT_SECRET
          else
            echo 'JWT_SECRET is not configured; generating a strong deployment secret.'
            node -e "const c=require('crypto'); process.stdout.write(c.randomBytes(48).toString('base64url'))" | npx wrangler secret put JWT_SECRET
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify Worker and D1
        env:
          HADIR_API_URL: ${{ secrets.HADIR_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${HADIR_API_URL:-}"
          if [[ -z "$BASE_URL" ]]; then
            echo 'Missing HADIR_API_URL. Set it to the deployed Worker URL (for example https://hadir-api.<subdomain>.workers.dev).' >&2
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          HEALTH=$(curl -fsS --max-time 20 "$BASE_URL/api/health")
          echo "$HEALTH"
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.database!=="D1"){console.error("Worker/D1 health check failed");process.exit(1)}console.log("Worker and D1 are healthy")' "$HEALTH"
          BOOT=$(curl -fsS --max-time 20 "$BASE_URL/api/bootstrap")
          echo "$BOOT"
          node -e 'const x=JSON.parse(process.argv[1]);if(typeof x.bootstrap!=="boolean"){console.error("Bootstrap endpoint invalid");process.exit(1)}console.log("Bootstrap endpoint OK")' "$BOOT"
