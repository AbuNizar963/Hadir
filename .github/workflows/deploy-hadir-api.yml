name: Deploy Hadir API

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-hadir-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required deployment secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$JWT_SECRET" ]] || missing+=(JWT_SECRET_or_HADIR_JWT_SECRET)
          [[ -n "$OWNER_USERNAME" ]] || missing+=(OWNER_USERNAME_or_HADIR_OWNER_USERNAME)
          [[ -n "$OWNER_PASSWORD" ]] || missing+=(OWNER_PASSWORD_or_HADIR_OWNER_PASSWORD)
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Prepare temporary Worker secrets
        shell: bash
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.HADIR_JWT_SECRET }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME || secrets.HADIR_OWNER_USERNAME }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD || secrets.HADIR_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '{"JWT_SECRET":%s,"OWNER_USERNAME":%s,"OWNER_PASSWORD":%s}\n' \
            "$(node -e 'process.stdout.write(JSON.stringify(process.env.JWT_SECRET))')" \
            "$(node -e 'process.stdout.write(JSON.stringify(process.env.OWNER_USERNAME))')" \
            "$(node -e 'process.stdout.write(JSON.stringify(process.env.OWNER_PASSWORD))')" \
            > .worker-secrets.json

      - name: Validate Worker configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run --secrets-file .worker-secrets.json

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file .worker-secrets.json

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .worker-secrets.json
