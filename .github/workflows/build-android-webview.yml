name: Build Hadir Android WebView

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-webview:
    name: Build Android WebView APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Build debug APK
        working-directory: mobile/android-webview
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK package and target SDK
        working-directory: mobile/android-webview
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK" | grep -qx 'com.hadir.attendance.webview'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk "$APK" | grep -qx '36'
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" | grep -q 'com.hadir.attendance.webview.MainActivity'
          echo 'Android WebView APK verification: OK'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hadir-android-webview-debug-apk
          path: mobile/android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
