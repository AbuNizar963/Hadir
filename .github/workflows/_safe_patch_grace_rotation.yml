name: Safe patch grace and rotation
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('backend/src/attendance-period.ts')
          s = p.read_text()
          old = 'function rotationShiftForDay(employee:any,periodStartDay:string,tz:string):AttendanceShift{const start=localDateTime(periodStartDay,employee.workStartTime||"09:00",tz);const end=localDateTime(addDays(periodStartDay,Math.max(1,Math.floor(Number(employee.rotationDaysOn??4)))),employee.workEndTime||employee.workStartTime||"09:00",tz);return{start,end,isWorkDay:true,kind:"ROTATION"};}'
          new = 'function rotationShiftForDay(employee:any,periodStartDay:string,tz:string):AttendanceShift{const start=localDateTime(periodStartDay,employee.workStartTime||"09:00",tz);const on=Math.max(1,Math.floor(Number(employee.rotationDaysOn??4)));const end=new Date(start.getTime()+on*DAY_MS);return{start,end,isWorkDay:true,kind:"ROTATION"};}'
          if s.count(old) != 1:
              raise SystemExit('rotationShiftForDay target mismatch')
          s = s.replace(old, new)
          old = 'if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(startDay)||!validTime(employee.workStartTime)||!validTime(employee.workEndTime)||on+off<=0)return{start:instant,end:instant,isWorkDay:false,kind:"ROTATION"};'
          new = 'if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(startDay)||!validTime(employee.workStartTime)||on+off<=0)return{start:instant,end:instant,isWorkDay:false,kind:"ROTATION"};'
          if s.count(old) != 1:
              raise SystemExit('getAttendanceShift validation target mismatch')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('backend/src/employee-save-production-gateway.ts')
          s = p.read_text()
          old = 'import { handleReportArchive } from "./report-archive";'
          new = 'import { handleReportArchive } from "./report-archive";\nimport { refreshProfessionalAttendanceFact } from "./professional-attendance-fact-builder";'
          if s.count(old) != 1:
              raise SystemExit('employee import target mismatch')
          s = s.replace(old, new)
          old = '  const result = employeeOut(updated, Number(policy?.minutes || 0));\n  if (body.isVip !== undefined || body.autoCheckIn !== undefined || body.autoCheckOut !== undefined) {'
          new = '  const result = employeeOut(updated, Number(policy?.minutes || 0));\n  const damascusDay = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Damascus", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());\n  await refreshProfessionalAttendanceFact(env, damascusDay, a, id);\n  if (body.isVip !== undefined || body.autoCheckIn !== undefined || body.autoCheckOut !== undefined) {'
          if s.count(old) != 1:
              raise SystemExit('employee refresh target mismatch')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --numstat | wc -l)" -eq 2
          git diff -- backend/src/attendance-period.ts backend/src/employee-save-production-gateway.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-period.ts backend/src/employee-save-production-gateway.ts
          git commit -m "fix: sync employee grace changes and rotation period"
          git push