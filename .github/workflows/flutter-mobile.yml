name: Flutter Mobile

on:
  push:
    branches: [android-native]
    paths:
      - 'mobile/flutter/**'
      - '.github/workflows/flutter-mobile.yml'
  pull_request:
    paths:
      - 'mobile/flutter/**'
      - '.github/workflows/flutter-mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
