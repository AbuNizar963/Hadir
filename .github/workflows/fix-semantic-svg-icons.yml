name: Fix semantic SVG icons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-semantic-svg-icons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace prayer icons with semantic inline SVG components
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/PrayerPage.tsx')
          s=p.read_text(encoding='utf-8')
          old='import { ArrowRight, MapPin, RefreshCw, Share2, Moon, Sunrise, Sun, CloudSun, Sunset, MoonStar } from "lucide-react";'
          new='import { ArrowRight, MapPin, RefreshCw, Share2 } from "lucide-react";'
          s=s.replace(old,new)
          marker='type PrayerKey="fajr"|"sunrise"|"dhuhr"|"asr"|"maghrib"|"isha";'
          start=s.index(marker)
          end=s.index('const norm=', start)
          icons='''type SvgIconProps={className?:string};\nconst Icon=({kind,className}:SvgIconProps&{kind:"fajr"|"sunrise"|"dhuhr"|"asr"|"maghrib"|"isha"|"ai"})=><svg viewBox="0 0 24 24" aria-hidden="true" className={className||"h-5 w-5"} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">{kind==="fajr"&&<><path d="M3 18h18"/><path d="M5 16a7 7 0 0 1 14 0"/><path d="M12 4v2"/><path d="m5.6 7.6 1.4 1.4"/><path d="m18.4 7.6-1.4 1.4"/></>}{kind==="sunrise"&&<><path d="M3 18h18"/><path d="M5 16a7 7 0 0 1 14 0"/><path d="M12 3v3"/><path d="m5.5 7.5 2 2"/><path d="m18.5 7.5-2 2"/></>}{kind==="dhuhr"&&<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></>}{kind==="asr"&&<><circle cx="9" cy="9" r="3"/><path d="M2 18h20"/><path d="M4 16a5 5 0 0 1 10 0"/><path d="M16 6c2 1 3 2.5 3 5"/></>}{kind==="maghrib"&&<><path d="M3 18h18"/><path d="M5 16a7 7 0 0 1 14 0"/><path d="M12 20v-3"/><path d="m5.5 20 2-2"/><path d="m18.5 20-2-2"/></>}{kind==="isha"&&<><path d="M19 14.5A7 7 0 1 1 9.5 5 6 6 0 0 0 19 14.5Z"/><path d="m17 4 .5 1.5L19 6l-1.5.5L17 8l-.5-1.5L15 6l1.5-.5Z"/></>}{kind==="ai"&&<><rect x="5" y="6" width="14" height="12" rx="3"/><path d="M9 10h.01M15 10h.01M9 14c1.5 1 4.5 1 6 0"/><path d="M12 3v3M3 12h2M19 12h2M12 18v3"/></>}</svg>;\n'''
          prayers='type PrayerKey="fajr"|"sunrise"|"dhuhr"|"asr"|"maghrib"|"isha";const PRAYERS:{key:PrayerKey;name:string;icon:React.ComponentType<{className?:string}>}[]=[{key:"fajr",name:"الفجر",icon:p=><Icon kind="fajr" {...p}/>},{key:"sunrise",name:"الشروق",icon:p=><Icon kind="sunrise" {...p}/>},{key:"dhuhr",name:"الظهر",icon:p=><Icon kind="dhuhr" {...p}/>},{key:"asr",name:"العصر",icon:p=><Icon kind="asr" {...p}/>},{key:"maghrib",name:"المغرب",icon:p=><Icon kind="maghrib" {...p}/>},{key:"isha",name:"العشاء",icon:p=><Icon kind="isha" {...p}/>];\n'
          s=s[:start]+prayers+icons+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit semantic SVG icon changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PrayerPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ui): replace prayer icons with semantic inline SVG'
          git push