name: Cleanup Rotation Daily Temp Files
on:
  push:
    branches: [fix/rotation-daily-attendance]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'cleanup rotation daily temp files') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary patch script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/_apply_rotation_daily.py
          git diff --cached --check
          git commit -m "cleanup rotation daily temp files"
          git push
