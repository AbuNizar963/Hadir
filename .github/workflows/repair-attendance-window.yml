name: Verify attendance confirmation repair
run-name: Verify attendance confirmation repair

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/src/**'
      - 'src/**'
      - '.github/workflows/repair-attendance-window.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install frontend dependencies
        run: bun install

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Build frontend
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Worker bundle
        working-directory: backend
        run: npm run build
