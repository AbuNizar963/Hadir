# One-time canonical repair; removed after Actions verification.
name: One-time D1 rotation window repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-d1-rotation-window.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact rotation coverage while keeping the window narrow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'backend/src/attendance-engine.ts';
          let source = fs.readFileSync(path, 'utf8');

          const oldUrl = 'nextDay = addDays(day, 1),\n    to = localDateTimeUtc(addDays(day, 2), "00:00").toISOString();';
          const newUrl = 'nextDay = addDays(day, 1);';
          if (!source.includes(oldUrl)) throw new Error('daily-status narrow URL window anchor not found');
          source = source.replace(oldUrl, newUrl);

          const oldHistorical = '    const historical = await env.DB.prepare(\n      "SELECT employee_id AS employeeId,type,timestamp FROM attendance WHERE timestamp>=? AND timestamp<? ORDER BY timestamp ASC",\n    )\n      .bind(historicalFrom, to)\n      .all<any>();';
          const newHistorical = '    const historicalTo = localDateTimeUtc(\n      addDays(day, Math.max(2, maxRotationOn + 1)),\n      "00:00",\n    ).toISOString();\n    const historical = await env.DB.prepare(\n      "SELECT employee_id AS employeeId,type,timestamp FROM attendance WHERE timestamp>=? AND timestamp<? ORDER BY timestamp ASC",\n    )\n      .bind(historicalFrom, historicalTo)\n      .all<any>();';
          if (!source.includes(oldHistorical)) throw new Error('daily-status historical query anchor not found');
          source = source.replace(oldHistorical, newHistorical);

          fs.writeFileSync(path, source);
          NODE
          npx --yes prettier@3.6.2 --write backend/src/attendance-engine.ts
          git diff --check
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "fix: preserve rotation coverage in daily status"
          git push
