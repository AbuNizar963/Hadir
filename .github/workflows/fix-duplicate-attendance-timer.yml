name: Fix duplicate attendance timer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: keep a single attendance confirmation timer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate timer above confirmation button
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/pages/EmployeeScan.tsx'); s=p.read_text(encoding='utf-8'); lines=s.splitlines(True); s=''.join(line for line in lines if '⏱️ مهلة تأكيد' not in line); p.write_text(s, encoding='utf-8')"
          test "$(grep -c 'timerText' src/pages/EmployeeScan.tsx)" -eq 1
          test "$(grep -c 'timerReadyText' src/pages/EmployeeScan.tsx)" -eq 1
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EmployeeScan.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: keep a single attendance confirmation timer'
          git push
