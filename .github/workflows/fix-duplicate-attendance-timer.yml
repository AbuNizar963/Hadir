name: Fix duplicate attendance timer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-duplicate-attendance-timer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove the duplicate timer above the confirmation button
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/pages/EmployeeScan.tsx"); lines=p.read_text(encoding="utf-8").splitlines(True); p.write_text("".join(line for line in lines if "⏱️ مهلة تأكيد" not in line), encoding="utf-8")'
          test "$(grep -c 'timerText' src/pages/EmployeeScan.tsx)" -eq 2
          test "$(grep -c 'timerReadyText' src/pages/EmployeeScan.tsx)" -eq 2

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/EmployeeScan.tsx
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "fix: keep one attendance confirmation timer"
          git push
