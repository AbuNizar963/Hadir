name: Migrate ManagerReports source

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: manager-reports-source-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Materialize ManagerReports source changes
        run: node scripts/patch-manager-reports-live.mjs

      - name: Format ManagerReports professionally
        run: npx --yes prettier@3.6.2 --write src/pages/ManagerReports.tsx

      - name: Commit migrated source when changed
        run: |
          if git diff --quiet -- src/pages/ManagerReports.tsx; then
            echo "ManagerReports source is already migrated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerReports.tsx
          git commit -m "refactor(frontend): move ManagerReports runtime patch into source"
          git push origin HEAD:main
