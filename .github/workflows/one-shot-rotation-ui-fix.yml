name: One-shot rotation schedule UI fix

on:
  push:
    branches:
      - fix/rotation-hide-work-days

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/pages/ManagerEmployees.tsx")
          text = path.read_text(encoding="utf-8")

          old = '''            <div className="mt-4">
              <div className="mb-2 text-xs font-bold">
                أيام الدوام
              </div>

              <div className="flex flex-wrap gap-2">
                {days.map((d, i) => (
                  <button
                    key={d}
                    type="button"
                    className={
                      form.workDays.includes(i)
                        ? "btn-primary text-xs"
                        : "btn-secondary text-xs"
                    }
                    onClick={() =>
                      toggleDay(i)
                    }
                  >
                    {d}
                  </button>
                ))}
              </div>
            </div>
'''

          new = '''            {form.scheduleType === "ADMIN" && (
              <div className="mt-4">
                <div className="mb-2 text-xs font-bold">
                  أيام الدوام
                </div>

                <div className="flex flex-wrap gap-2">
                  {days.map((d, i) => (
                    <button
                      key={d}
                      type="button"
                      className={
                        form.workDays.includes(i)
                          ? "btn-primary text-xs"
                          : "btn-secondary text-xs"
                      }
                      onClick={() =>
                        toggleDay(i)
                      }
                    >
                      {d}
                    </button>
                  ))}
                </div>
              </div>
            )}
'''

          if old not in text:
              raise SystemExit("Expected employee work-days block was not found")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify source
        run: |
          grep -n -A4 -B2 'form.scheduleType === "ADMIN"' src/pages/ManagerEmployees.tsx

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx
          git rm .github/workflows/one-shot-rotation-ui-fix.yml
          git commit -m "fix(employees): hide work days for rotation schedule"
          git push
