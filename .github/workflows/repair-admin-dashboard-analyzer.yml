name: Repair admin dashboard analyzer
on:
  push:
    branches: [Apps]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Remove unused dashboard declarations
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/administration/pages/admin_mobile_dashboard_page.dart')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("  String _name = 'الإدارة';\n", ''),
              ("  String get _roleLabel => switch (_role) {\n        'owner' => 'المالك',\n        'manager' => 'المدير',\n        'supervisor' => 'المشرف',\n        _ => 'الإدارة',\n      };\n\n", ''),
              ("  int get _openViolations => _violations\n      .where((raw) => raw is Map && '${raw['status'] ?? 'open'}'.toLowerCase() != 'resolved')\n      .length;\n", ''),
              ("  Widget _sectionTitle(String title, String subtitle) => Column(\n        crossAxisAlignment: CrossAxisAlignment.start,\n        children: [\n          Text(\n            title,\n            style: TextStyle(\n              color: _ink,\n              fontSize: 18,\n              fontWeight: FontWeight.w900,\n            ),\n          ),\n          const SizedBox(height: 3),\n          Text(\n            subtitle,\n            style: TextStyle(color: _muted, fontSize: 10.5),\n          ),\n        ],\n      );\n\n", ''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('expected dashboard fragment not found')
              s = s.replace(old, new, 1)
          s = s.replace("        _name = name;\n", "")
          p.write_text(s, encoding='utf-8')
      - name: Commit dashboard analyzer repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/administration/pages/admin_mobile_dashboard_page.dart
          git commit -m 'fix: remove unused dashboard declarations'
          git push origin Apps
