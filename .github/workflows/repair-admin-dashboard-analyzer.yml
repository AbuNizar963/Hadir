# restore dashboard panel used by employee section
name: Repair admin dashboard analyzer
on:
  push:
    branches: [Apps]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Restore required dashboard panel
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/administration/pages/admin_mobile_dashboard_page.dart')
          s = p.read_text(encoding='utf-8')
          old = "  Color get _surface => Theme.of(context).colorScheme.surface;\n"
          new = old + "  Color get _panel => Theme.of(context).colorScheme.surfaceContainerHighest;\n"
          if old not in s:
              raise SystemExit('surface getter not found')
          if '_panel =>' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit dashboard repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/administration/pages/admin_mobile_dashboard_page.dart
          git commit -m 'fix: restore dashboard panel used by employee section'
          git push origin Apps
