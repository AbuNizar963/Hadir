# refined analyzer repair
name: Repair admin dashboard analyzer
on:
  push:
    branches: [Apps]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Remove unused dashboard declarations
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/administration/pages/admin_mobile_dashboard_page.dart')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("  String _role = 'admin';\n", ''),
              ("  List<dynamic> _violations = [];\n", ''),
              ("      final name = user is Map ? '${user['name'] ?? 'الإدارة'}' : 'الإدارة';\n", ''),
              ("        _role = role;\n", ''),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected dashboard fragment not found: {old[:50]}')
              s = s.replace(old, new, 1)
          s = s.replace("        _violations = violations;\n", "")
          s = s.replace("      final violations = await api.violations(limit: 200);\n", "")
          p.write_text(s, encoding='utf-8')
      - name: Commit dashboard analyzer repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/administration/pages/admin_mobile_dashboard_page.dart
          git commit -m 'fix: remove unused dashboard state'
          git push origin Apps
