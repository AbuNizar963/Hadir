name: fix-workforce-controls-route

on:
  push:
    branches: [fix/employee-card-actions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend endpoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text()
          old = '''          const response = await fetch(`${api}/api/manager/workforce-controls`, {
            headers: {
              authorization: `Bearer ${token}`,
              "content-type": "application/json",
            },
            credentials: "include",
            cache: "no-store",
          });
          const controls = await response.json().catch(() => []);
          if (response.ok && Array.isArray(controls)) {
            const byId = new Map(
              controls.map((control: any) => [String(control.id), control]),
            );'''
          new = '''          const response = await fetch(`${api}/api/workforce/live`, {
            headers: {
              authorization: `Bearer ${token}`,
              "content-type": "application/json",
            },
            credentials: "include",
            cache: "no-store",
          });
          const payload = await response.json().catch(() => ({}));
          const controls = payload && Array.isArray(payload.employees) ? payload.employees : [];
          if (response.ok && Array.isArray(controls)) {
            const byId = new Map(
              controls.map((control: any) => [String(control.id), control]),
            );'''
          if old not in s:
              raise SystemExit('expected workforce-controls block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_fix_workforce_controls_route.yml
          git add src/pages/ManagerEmployees.tsx .github/workflows/_fix_workforce_controls_route.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(workforce): use canonical live controls endpoint"
          git push
