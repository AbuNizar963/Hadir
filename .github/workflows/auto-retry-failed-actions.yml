name: Auto Retry Failed Apps Actions

on:
  workflow_run:
    workflows: ["Flutter App", "Build Hadir Android Flutter Release", "Deploy Hadir API", "Backend Check", "Apply Company Specialties"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-retry-failed-apps
  cancel-in-progress: false

jobs:
  retry-failed:
    if: github.ref == 'refs/heads/Apps' || github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed jobs from Apps runs in the last hour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff=$(date -u -d '60 minutes ago' +%s)
          page=1
          retried=0

          while :; do
            runs=$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?branch=Apps&per_page=100&page=${page}" \
              --jq '.workflow_runs[] | [.id,.name,.status,.conclusion,.created_at] | @tsv' || true)

            [ -n "$runs" ] || break

            while IFS=$'\t' read -r run_id name status conclusion created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              if [ "$created_epoch" -lt "$cutoff" ]; then
                continue
              fi
              if [ "$status" != "completed" ] || [ "$conclusion" != "failure" ]; then
                continue
              fi
              if [ "$name" = "Auto Retry Failed Apps Actions" ]; then
                continue
              fi

              echo "Retrying all failed jobs for ${name} run ${run_id}"
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"
              retried=$((retried + 1))
            done <<< "$runs"

            page=$((page + 1))
            [ "$page" -le 5 ] || break
          done

          echo "Retried failed workflow runs: ${retried}"
