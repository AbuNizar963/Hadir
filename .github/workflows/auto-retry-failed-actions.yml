name: Auto Retry Failed Apps Actions

on:
  push:
    branches: [Apps]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-retry-failed-apps
  cancel-in-progress: false

jobs:
  repair-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apps
        uses: actions/checkout@v6
        with:
          ref: Apps
          fetch-depth: 1
      - name: Repair malformed digital-card print source when present
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/employee/pages/profile_page_reference_implementation_v2.dart')
          s = p.read_text()
          start = s.index('  Future<void> _printDigitalCard() async {')
          end = s.index('  Widget _digitalCard() {', start)
          old = s[start:end]
          if 'pdf.addPage(pw.Page(' not in old:
              raise SystemExit(0)
          replacement = r'''  Future<void> _printDigitalCard() async {
    final name = _text('name', 'الموظف');
    final job = _text('jobNumber', _text('username'));
    final id = _text('id', job);
    final verifyUrl = id == '—' ? '' : '$_webOrigin/employee/verify/${Uri.encodeComponent(id)}';
    if (verifyUrl.isEmpty) return;
    try {
      final qrData = await QrPainter(
        data: verifyUrl,
        version: QrVersions.auto,
        gapless: true,
      ).toImageData(480, format: ui.ImageByteFormat.png);
      if (qrData == null) throw Exception('QR');
      final regular = await PdfGoogleFonts.notoSansArabicRegular();
      final bold = await PdfGoogleFonts.notoSansArabicBold();
      final pdf = pw.Document();
      pdf.addPage(
        pw.Page(
          pageFormat: PdfPageFormat.a4,
          margin: const pw.EdgeInsets.all(40),
          build: (_) => pw.Directionality(
            textDirection: pw.TextDirection.rtl,
            child: pw.Center(
              child: pw.Container(
                width: 360,
                padding: const pw.EdgeInsets.all(24),
                decoration: pw.BoxDecoration(
                  border: pw.Border.all(color: PdfColor.fromInt(0xFFDCE6E2)),
                  borderRadius: pw.BorderRadius.circular(18),
                ),
                child: pw.Column(
                  children: [
                    pw.Text('HADIR', style: pw.TextStyle(font: bold, fontSize: 14, color: PdfColor.fromInt(0xFF0B6B5A))),
                    pw.SizedBox(height: 5),
                    pw.Text('الهوية الرقمية', style: pw.TextStyle(font: bold, fontSize: 20)),
                    pw.SizedBox(height: 16),
                    pw.Text(name, style: pw.TextStyle(font: bold, fontSize: 22)),
                    pw.SizedBox(height: 5),
                    pw.Text('موظف · الرقم الوظيفي $job', style: pw.TextStyle(font: regular, fontSize: 10, color: PdfColors.grey700)),
                    pw.SizedBox(height: 18),
                    pw.Image(pw.MemoryImage(qrData.buffer.asUint8List()), width: 190, height: 190),
                    pw.SizedBox(height: 8),
                    pw.Text('امسح الرمز للتحقق من هوية الموظف', style: pw.TextStyle(font: regular, fontSize: 9, color: PdfColors.grey700)),
                    pw.SizedBox(height: 16),
                    pw.Row(
                      mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
                      children: [
                        pw.Text('الحالة: نشط', style: pw.TextStyle(font: bold, fontSize: 9, color: PdfColor.fromInt(0xFF0B6B5A))),
                        pw.Text('التحقق: QR آمن', style: pw.TextStyle(font: bold, fontSize: 9)),
                      ],
                    ),
                  ],
                ),
              ),
            ),
          ),
        ),
      );
      await Printing.layoutPdf(
        name: 'hadir-digital-card-$job.pdf',
        onLayout: (_) async => pdf.save(),
      );
    } catch (_) {
      if (mounted) {
        ScaffoldMessenger.of(context).showSnackBar(
          const SnackBar(content: Text('تعذر تجهيز البطاقة للطباعة. حاول مرة أخرى.')),
        );
      }
    }
  }

'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check
      - name: Commit repaired source if needed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/employee/pages/profile_page_reference_implementation_v2.dart
          if git diff --cached --quiet; then
            echo 'No source repair required.'
            exit 0
          fi
          git commit -m 'fix(employee): repair digital card print syntax'
          git push origin HEAD:Apps

  retry-failed:
    needs: repair-source
    runs-on: ubuntu-latest
    steps:
      - name: Retry all failed jobs from recent Apps runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail
          cutoff=$(date -u -d '60 minutes ago' +%s)
          page=1
          retried=0
          skipped=0
          while [ "$page" -le 5 ]; do
            if ! json=$(gh api -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/runs?branch=Apps&status=failure&per_page=100&page=${page}" --paginate=false); then
              echo "Could not read failed Apps workflow runs on page ${page}; continuing."
              page=$((page + 1)); continue
            fi
            count=$(jq '.workflow_runs | length' <<< "$json")
            [ "$count" -gt 0 ] || break
            while IFS=$'\t' read -r run_id name created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              [ "$created_epoch" -ge "$cutoff" ] || continue
              [ "$name" != "Auto Retry Failed Apps Actions" ] || continue
              case "$name" in
                Repair\ *|.github/workflows/repair-*|Apply\ *|.github/workflows/_*)
                  echo "Skipping temporary repair workflow: ${name} (${run_id})"
                  skipped=$((skipped + 1)); continue ;;
              esac
              echo "Retrying all failed jobs: ${name} (${run_id})"
              if gh api --method POST -H 'Accept: application/vnd.github+json' "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"; then
                retried=$((retried + 1))
              else
                skipped=$((skipped + 1))
              fi
            done < <(jq -r '.workflow_runs[] | [.id,.name,.created_at] | @tsv' <<< "$json")
            page=$((page + 1))
          done
          echo "Retried failed Apps workflow runs: ${retried}; skipped: ${skipped}"
          exit 0
