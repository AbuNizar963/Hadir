name: Auto Retry Failed Apps Actions

on:
  push:
    branches: [Apps]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-retry-failed-apps
  cancel-in-progress: false

jobs:
  retry-failed:
    runs-on: ubuntu-latest
    steps:
      - name: Retry all failed jobs from recent Apps runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          cutoff=$(date -u -d '60 minutes ago' +%s)
          page=1
          retried=0
          skipped=0

          while [ "$page" -le 5 ]; do
            if ! json=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?branch=Apps&status=failure&per_page=100&page=${page}" \
              --paginate=false); then
              echo "Could not read failed Apps workflow runs on page ${page}; continuing."
              page=$((page + 1))
              continue
            fi

            count=$(jq '.workflow_runs | length' <<< "$json")
            [ "$count" -gt 0 ] || break

            while IFS=$'\t' read -r run_id name created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              [ "$created_epoch" -ge "$cutoff" ] || continue
              [ "$name" != "Auto Retry Failed Apps Actions" ] || continue

              # Historical one-off repair workflows are intentionally deleted and
              # must never be resurrected by the automatic retry mechanism.
              case "$name" in
                Repair\ *|.github/workflows/repair-*)
                  echo "Skipping historical temporary repair workflow: ${name} (${run_id})"
                  skipped=$((skipped + 1))
                  continue
                  ;;
              esac

              echo "Retrying all failed jobs: ${name} (${run_id})"
              if gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"; then
                retried=$((retried + 1))
              else
                echo "Run ${run_id} could not be retried now; it may already be running. Continuing."
                skipped=$((skipped + 1))
              fi
            done < <(jq -r '.workflow_runs[] | [.id,.name,.created_at] | @tsv' <<< "$json")

            page=$((page + 1))
          done

          echo "Retried failed Apps workflow runs: ${retried}; skipped for retry conflict/error: ${skipped}"
          exit 0
