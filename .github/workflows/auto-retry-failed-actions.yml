name: Auto Retry Failed Apps Actions

on:
  push:
    branches: [Apps]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: auto-retry-failed-apps
  cancel-in-progress: false

jobs:
  retry-failed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout for one-time source repair
        uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 1
      - name: Repair malformed PDF expression if present
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/employee/pages/profile_page_reference_implementation_v2.dart')
          lines = p.read_text(encoding='utf-8').splitlines(True)
          changed = False
          for i, line in enumerate(lines):
              if 'pdf.addPage(pw.Page(' in line:
                  opens = line.count('(')
                  closes = line.count(')')
                  if opens > closes:
                      lines[i] = line.rstrip('\n') + (')' * (opens - closes)) + '\n'
                      changed = True
                  break
          if changed:
              p.write_text(''.join(lines), encoding='utf-8')
          print('malformed PDF expression repaired' if changed else 'no source repair needed')
          PY
      - name: Commit source repair when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/features/employee/pages/profile_page_reference_implementation_v2.dart; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/employee/pages/profile_page_reference_implementation_v2.dart
          git commit -m "fix(employee): repair malformed digital card PDF expression"
          git push origin Apps
      - name: Retry all failed jobs from recent Apps runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -uo pipefail

          cutoff=$(date -u -d '60 minutes ago' +%s)
          page=1
          retried=0
          skipped=0

          while [ "$page" -le 5 ]; do
            if ! json=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?branch=Apps&status=failure&per_page=100&page=${page}" \
              --paginate=false); then
              echo "Could not read failed Apps workflow runs on page ${page}; continuing."
              page=$((page + 1))
              continue
            fi

            count=$(jq '.workflow_runs | length' <<< "$json")
            [ "$count" -gt 0 ] || break

            while IFS=$'\t' read -r run_id name created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              [ "$created_epoch" -ge "$cutoff" ] || continue
              [ "$name" != "Auto Retry Failed Apps Actions" ] || continue

              case "$name" in
                Repair\ *|.github/workflows/repair-*)
                  echo "Skipping historical temporary repair workflow: ${name} (${run_id})"
                  skipped=$((skipped + 1))
                  continue
                  ;;
              esac

              echo "Retrying all failed jobs: ${name} (${run_id})"
              if gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"; then
                retried=$((retried + 1))
              else
                echo "Run ${run_id} could not be retried now; it may already be running. Continuing."
                skipped=$((skipped + 1))
              fi
            done < <(jq -r '.workflow_runs[] | [.id,.name,.created_at] | @tsv' <<< "$json")

            page=$((page + 1))
          done

          echo "Retried failed Apps workflow runs: ${retried}; skipped for retry conflict/error: ${skipped}"
          exit 0
