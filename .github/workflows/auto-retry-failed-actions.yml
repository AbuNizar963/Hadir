name: Auto Retry Failed Apps Actions

on:
  push:
    branches: [Apps]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-retry-failed-apps
  cancel-in-progress: false

jobs:
  retry-failed:
    runs-on: ubuntu-latest
    steps:
      - name: Retry all failed jobs from recent Apps runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff=$(date -u -d '60 minutes ago' +%s)
          page=1
          retried=0

          while [ "$page" -le 5 ]; do
            json=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs?branch=Apps&status=failure&per_page=100&page=${page}" \
              --paginate=false)

            count=$(jq '.workflow_runs | length' <<< "$json")
            [ "$count" -gt 0 ] || break

            while IFS=$'\t' read -r run_id name created_at; do
              [ -n "${run_id:-}" ] || continue
              created_epoch=$(date -u -d "$created_at" +%s)
              [ "$created_epoch" -ge "$cutoff" ] || continue
              [ "$name" != "Auto Retry Failed Apps Actions" ] || continue

              echo "Retrying all failed jobs: ${name} (${run_id})"
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"
              retried=$((retried + 1))
            done < <(jq -r '.workflow_runs[] | [.id,.name,.created_at] | @tsv' <<< "$json")

            page=$((page + 1))
          done

          echo "Retried failed Apps workflow runs: ${retried}"
