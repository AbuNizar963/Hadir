name: Auto Retry Failed Flutter CI

on:
  push:
    branches: [flutter-mobile-app]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-retry-failed-flutter-ci
  cancel-in-progress: false

jobs:
  retry-failed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry recent failed Flutter CI runs only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cutoff="$(date -u -d '60 minutes ago' +%s)"
          json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPO}/actions/runs?branch=flutter-mobile-app&status=failure&per_page=100")"

          retried=0
          skipped=0

          while IFS= read -r run_id; do
            [ -n "${run_id}" ] || continue

            echo "Retrying failed Flutter CI run: ${run_id}"
            if gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPO}/actions/runs/${run_id}/rerun-failed-jobs"; then
              retried=$((retried + 1))
            else
              echo "Run ${run_id} could not be retried; continuing."
              skipped=$((skipped + 1))
            fi
          done < <(
            jq -r --argjson cutoff "$cutoff" '
              .workflow_runs[]
              | select(.head_branch == "flutter-mobile-app")
              | select(.name == "Flutter App" or .name == "Hadir Backend Check")
              | select((.run_attempt // 1) < 2)
              | select((.created_at | fromdateiso8601) >= $cutoff)
              | .id
            ' <<< "$json"
          )

          echo "Retried failed Flutter CI runs: ${retried}; skipped: ${skipped}"
