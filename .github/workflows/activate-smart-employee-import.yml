name: Activate smart employee import

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/ManagerEmployees.tsx'
      - 'src/components/employees/SmartEmployeeImport.tsx'
      - 'package.json'
      - '.github/workflows/activate-smart-employee-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete manager page and activate smart import
        run: |
          set -euo pipefail
          # The previous automated patch accidentally truncated ManagerEmployees.tsx.
          # Restore the last known-good complete version, then apply only the UI import change.
          git fetch origin eb86276e5995352681c714b2a4f0b05f9867327d --depth=1
          git checkout eb86276e5995352681c714b2a4f0b05f9867327d -- src/pages/ManagerEmployees.tsx
          python3 <<'PY'
          from pathlib import Path
          p=Path('src/pages/ManagerEmployees.tsx')
          s=p.read_text(encoding='utf-8')
          imp='import SmartEmployeeImport from "@/components/employees/SmartEmployeeImport";'
          if imp not in s:
              marker='import { addNotification } from "@/lib/notifications";'
              if marker not in s:
                  raise SystemExit('manager import marker not found')
              s=s.replace(marker, marker+'\n'+imp, 1)
          old='<input ref={importInputRef} type="file" accept=".csv,text/csv" onChange={importEmployees} className="hidden"/><button type="button" onClick={()=>importInputRef.current?.click()} className="btn-secondary text-xs" disabled={importing}>{importing?"جاري الاستيراد…":"استيراد ملف"}</button>'
          new='<SmartEmployeeImport onImported={() => { void refreshEmployeesFromD1(); }} />'
          if old in s:
              s=s.replace(old,new,1)
          elif '<SmartEmployeeImport' not in s:
              raise SystemExit('CSV-only importer control not found')
          s=s.replace('صيغة الاستيراد: CSV. الأعمدة الأساسية: <span className="mono">name, jobNumber</span>، ويمكن إضافة بيانات الدوام والمقر والحالة.','يمكنك استيراد Excel أو CSV حتى لو كانت الأعمدة غير مرتبة؛ سيحاول النظام تحديد الاسم والرقم الوظيفي تلقائياً.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          corepack enable
          npm install --ignore-scripts
          npx tsc --noEmit --pretty false
          npm run build
          grep -q 'SmartEmployeeImport' src/pages/ManagerEmployees.tsx
          ! grep -q 'accept=".csv,text/csv"' src/pages/ManagerEmployees.tsx
      - name: Commit activation
        run: |
          if git diff --quiet -- src/pages/ManagerEmployees.tsx; then echo 'Smart importer already active'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ManagerEmployees.tsx
          git commit -m 'fix: restore manager page and activate smart Excel import'
          git push
