name: Repair employee login PIN length
on:
  push:
    branches: [Apps]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow four digit employee PINs
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/pages/employee_login_page.dart')
          s = p.read_text()
          old = "if (!RegExp(r'^\\d{6}\\$').hasMatch(password)) {\n      setState(() => _error = 'رمز دخول الموظف يجب أن يتكون من 6 أرقام بالضبط.');"
          new = "if (!RegExp(r'^\\d{4,6}$').hasMatch(password)) {\n      setState(() => _error = 'رمز دخول الموظف يجب أن يتكون من 4 إلى 6 أرقام.');"
          if old not in s:
            raise SystemExit('Expected employee login validation was not found')
          s = s.replace(old, new, 1)
          s = s.replace("LengthLimitingTextInputFormatter(6)],", "LengthLimitingTextInputFormatter(6)],", 1)
          s = s.replace("suffixText: '6 أرقام',", "suffixText: '4–6 أرقام',", 1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/pages/employee_login_page.dart
          git commit -m 'allow four digit employee PIN login' || exit 0
          git push
