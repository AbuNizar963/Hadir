name: One-shot Workforce Persistence Patch
on:
  workflow_dispatch:
  push:
    branches: [fix/workforce-controls-persistence]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden demo reset endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/workforce.ts')
          s = p.read_text()
          old = 'const tables=["attendance","audit","requests","employee_requests","notifications","violations","leave_requests","tasks","performance_reviews","payroll_entries","anomaly_events","ai_insights","push_subscriptions","escape_events","device_rebind_requests"];'
          new = 'const tables=["employee_passkeys","webauthn_challenges","attendance","audit","requests","employee_requests","notifications","violations","leave_requests","tasks","performance_reviews","payroll_entries","anomaly_events","ai_insights","push_subscriptions","escape_events","device_rebind_requests"];'
          if old in s:
              s = s.replace(old, new, 1)
          old_list = 'env.PROFILE_IMAGES.list({limit:1000,...(cursor?{cursor}:{})})'
          new_list = 'env.PROFILE_IMAGES.list({prefix:"employees/",limit:1000,...(cursor?{cursor}:{})})'
          if old_list in s:
              s = s.replace(old_list, new_list, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'employee_passkeys' backend/src/workforce.ts
          grep -q 'webauthn_challenges' backend/src/workforce.ts
          grep -q 'prefix:"employees/"' backend/src/workforce.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- backend/src/workforce.ts; then exit 0; fi
          git add backend/src/workforce.ts
          git diff --cached --check
          git commit -m 'fix(workforce): harden demo data reset'
          git push
