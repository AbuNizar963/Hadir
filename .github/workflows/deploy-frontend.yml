name: Deploy Hadir Frontend

# Production deployment trigger: keep frontend deploy verification active for every main release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - ".env.production"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - "scripts/patch-manager-report-header.mjs"
      - "scripts/patch-manager-reports-live.mjs"
      - "scripts/patch-manager-report-share.mjs"
      - "scripts/patch-employee-home-shift-info.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PRODUCTION_URL: https://hadir-9rq.pages.dev
  ANDROID_PACKAGE_NAME: com.hadir.attendance
  ANDROID_SHA256: B6:FD:CF:4A:7D:B7:E6:0D:9C:3A:90:AA:6B:98:5E:96:5C:F1:F5:C0:9A:E6:03:D6:75:AB:6C:1E:3C:C2:AF:A4

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages production bundle
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate frontend deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Resolve existing Cloudflare Pages project
        id: pages-project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -o /tmp/pages-projects.json

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/pages-projects.json").read_text(encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit(f"Cloudflare Pages project lookup failed: {data.get('errors') or []}")

          projects = data.get("result") or []
          names = [p.get("name") for p in projects if p.get("name")]
          preferred = ["hadir-9rq", "hadir"]
          project = next((name for name in preferred if name in names), None)

          if not project:
              print("Existing Pages projects:", ", ".join(names) or "<none>", file=sys.stderr)
              raise SystemExit("No existing Hadir Cloudflare Pages project was found; refusing to create a new project")

          Path("/tmp/pages-project-name").write_text(project, encoding="utf-8")
          PY

          project="$(cat /tmp/pages-project-name)"
          printf 'project_name=%s\n' "$project" >> "$GITHUB_OUTPUT"
          echo "Resolved existing Pages project: $project"

      - name: Deploy to existing Cloudflare Pages production project
        env:
          PROJECT_NAME: ${{ steps.pages-project.outputs.project_name }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --commit-dirty=true

      - name: Verify exact production build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/build-version.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("dist/build-version.json").read_text(encoding="utf-8"))
          if data.get("commitSha") != "${GITHUB_SHA}":
              raise SystemExit(f"Build version mismatch: {data}")
          print("Exact build SHA verified:", data.get("commitSha"))
          PY

      - name: Verify production application
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          url = "${PAGES_PRODUCTION_URL}"
          with urllib.request.urlopen(url, timeout=30) as response:
              status = response.status
              body = response.read(500000).decode("utf-8", "ignore")
          if status != 200:
              raise SystemExit(f"Production verification failed: HTTP {status}")
          if "HADIR" not in body and "حاضر" not in body:
              raise SystemExit("Production verification failed: expected Hadir application markers were not found")
          print(f"Production verification passed: HTTP {status} {url}")
          PY
