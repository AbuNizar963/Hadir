name: Deploy Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_DEPLOY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages production bundle
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate Cloudflare Pages credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Resolve existing Cloudflare Pages project
        id: pages-project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -o /tmp/pages-projects.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/pages-projects.json").read_text(encoding="utf-8"))
          if not data.get("success"):
              errors = data.get("errors") or []
              raise SystemExit(f"Cloudflare Pages project lookup failed: {errors}")

          projects = data.get("result") or []
          names = [p.get("name") for p in projects if p.get("name")]
          preferred = ["hadir-9rq", "hadir"]
          project = next((name for name in preferred if name in names), None)

          if not project:
              print("Existing Pages projects:", ", ".join(names) or "<none>", file=sys.stderr)
              raise SystemExit("No existing Hadir Cloudflare Pages project was found; refusing to create a new project")

          print(f"project_name={project}")
          print(f"project_subdomain={project}.pages.dev")
          print(f"Resolved existing Pages project: {project}")
          PY

      - name: Deploy to existing Cloudflare Pages project
        env:
          PROJECT_NAME: ${{ steps.pages-project.outputs.project_name }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-dirty=true

      - name: Verify exact production commit
        env:
          PROJECT_SUBDOMAIN: ${{ steps.pages-project.outputs.project_subdomain }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://$PROJECT_SUBDOMAIN/build-version.json?hadir_ci=$GITHUB_SHA"
          curl -fsS --retry 12 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "$url" \
            -o /tmp/build-version.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/build-version.json").read_text(encoding="utf-8"))
          expected = os.environ["GITHUB_SHA"]
          actual = data.get("commitSha")
          assert actual == expected, {"expected": expected, "actual": actual, "data": data}
          print(f"Cloudflare Pages is serving the exact GitHub commit: {expected}")
          PY

      - name: Verify deployed PWA metadata and service worker
        env:
          PROJECT_SUBDOMAIN: ${{ steps.pages-project.outputs.project_subdomain }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://$PROJECT_SUBDOMAIN/manifest.webmanifest?hadir_ci=$GITHUB_SHA" \
            -o /tmp/manifest.json
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "https://$PROJECT_SUBDOMAIN/sw.js?hadir_ci=$GITHUB_SHA" \
            -o /tmp/sw.js

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest

          sw = Path("/tmp/sw.js").read_text(encoding="utf-8")
          match = re.search(r'const CACHE="(hadir-shell-v\d+)";', sw)
          assert match, "service-worker shell cache version declaration is missing"
          assert "SKIP_WAITING" in sw, "service-worker update activation handler is missing"
          assert "notificationclick" in sw, "service-worker notification click handler is missing"
          print(f"Production PWA verified: {match.group(1)}")
          PY

      - name: Deployment complete
        run: |
          echo "Hadir frontend deployed successfully to Cloudflare Pages."
          echo "Deployment source: GitHub Actions commit $GITHUB_SHA"
          echo "Cloudflare Pages project: ${{ steps.pages-project.outputs.project_name }}"
