name: Deploy Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - ".env.production"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PRODUCTION_URL: https://hadir-9rq.pages.dev

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages production bundle
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Generate production PWA raster icons from favicon.svg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          test -s public/favicon.svg
          test -d dist
          rsvg-convert -w 192 -h 192 -o dist/pwa-icon-192.png public/favicon.svg
          rsvg-convert -w 512 -h 512 -o dist/pwa-icon-512.png public/favicon.svg
          test -s dist/pwa-icon-192.png
          test -s dist/pwa-icon-512.png

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("dist/manifest.webmanifest")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          version = os.environ["GITHUB_SHA"]
          query = f"?hadir_icon={version}"
          manifest["icons"] = [
              {
                  "src": f"/pwa-icon-192.png{query}",
                  "sizes": "192x192",
                  "type": "image/png",
                  "purpose": "any",
              },
              {
                  "src": f"/pwa-icon-512.png{query}",
                  "sizes": "512x512",
                  "type": "image/png",
                  "purpose": "any",
              },
          ]
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          verified = json.loads(manifest_path.read_text(encoding="utf-8"))
          icons = verified.get("icons") or []
          assert any(icon.get("src") == f"/pwa-icon-192.png{query}" for icon in icons), verified
          assert any(icon.get("src") == f"/pwa-icon-512.png{query}" for icon in icons), verified
          assert all(icon.get("type") == "image/png" for icon in icons), verified
          print("Local production bundle verified with versioned PNG PWA icons.")
          PY

      - name: Validate frontend deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Resolve existing Cloudflare Pages project
        id: pages-project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -o /tmp/pages-projects.json

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path("/tmp/pages-projects.json").read_text(encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit(f"Cloudflare Pages project lookup failed: {data.get('errors') or []}")

          projects = data.get("result") or []
          names = [p.get("name") for p in projects if p.get("name")]
          preferred = ["hadir-9rq", "hadir"]
          project = next((name for name in preferred if name in names), None)

          if not project:
              print("Existing Pages projects:", ", ".join(names) or "<none>", file=sys.stderr)
              raise SystemExit("No existing Hadir Cloudflare Pages project was found; refusing to create a new project")

          Path("/tmp/pages-project-name").write_text(project, encoding="utf-8")
          PY

          project="$(cat /tmp/pages-project-name)"
          printf 'project_name=%s\n' "$project" >> "$GITHUB_OUTPUT"
          echo "Resolved existing Pages project: $project"

      - name: Deploy to existing Cloudflare Pages production project
        env:
          PROJECT_NAME: ${{ steps.pages-project.outputs.project_name }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --commit-dirty=true

      - name: Verify exact production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store' \
              "$PAGES_PRODUCTION_URL/build-version.json?hadir_ci=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/build-version.json; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("/tmp/build-version.json").read_text(encoding="utf-8"))
          expected=os.environ["GITHUB_SHA"]
          actual=data.get("commitSha")
          if actual == expected:
              print(f"Cloudflare Pages production serves commit {expected}.")
              raise SystemExit(0)
          print(f"Pages currently serves {actual!r}; waiting for {expected!r}.")
          raise SystemExit(1)
          PY
              then exit 0; fi
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Cloudflare Pages production did not expose the deployed commit within 3 minutes."
              exit 1
            fi
            echo "Waiting for Cloudflare Pages production propagation (attempt $attempt/36)..."
            sleep 5
          done

      - name: Verify deployed PWA metadata and service worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store' \
            "$PAGES_PRODUCTION_URL/manifest.webmanifest?hadir_ci=$GITHUB_SHA" \
            -o /tmp/manifest.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest=json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          expected=os.environ["GITHUB_SHA"]

          assert manifest.get("id")=="/", manifest
          assert manifest.get("start_url")=="/", manifest
          assert manifest.get("scope")=="/", manifest
          assert manifest.get("display")=="standalone", manifest
          assert manifest.get("prefer_related_applications") is False, manifest
          icons = manifest.get("icons")
          assert isinstance(icons, list) and len(icons) >= 2, manifest
          assert any(icon.get("src") == f"/pwa-icon-192.png?hadir_icon={expected}" for icon in icons), manifest
          assert any(icon.get("src") == f"/pwa-icon-512.png?hadir_icon={expected}" for icon in icons), manifest
          assert all(icon.get("type") == "image/png" for icon in icons), manifest
          print("Production PWA manifest verified with versioned PNG icons.")
          PY

          for icon in pwa-icon-192.png pwa-icon-512.png; do
            curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store' \
              "$PAGES_PRODUCTION_URL/$icon?hadir_ci=$GITHUB_SHA" \
              -o "/tmp/$icon"
            test -s "/tmp/$icon"
          done

          for attempt in $(seq 1 36); do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store' \
              "$PAGES_PRODUCTION_URL/sw.js?hadir_ci=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/sw.js; then
              if python - <<'PY'
          import os
          import re
          from pathlib import Path

          sw=Path("/tmp/sw.js").read_text(encoding="utf-8")
          version_match=re.search(r'const BUILD_VERSION="([0-9a-f]{40})";', sw)
          assert version_match, "production service-worker build version declaration is missing"
          cache_match=re.search(r'const CACHE=`hadir-shell-\$\{BUILD_VERSION\}`;', sw)
          assert cache_match, "production service-worker shell cache declaration is missing"
          assert "SKIP_WAITING" in sw, "service-worker update activation handler is missing"
          assert "notificationclick" in sw, "service-worker notification click handler is missing"
          expected=os.environ["GITHUB_SHA"]
          actual=version_match.group(1)
          if actual == expected:
              print(f"Production PWA verified: {actual}")
              raise SystemExit(0)
          print(f"Production Service Worker currently serves {actual!r}; waiting for {expected!r}.")
          raise SystemExit(1)
          PY
              then exit 0; fi
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Cloudflare Pages production did not expose the matching Service Worker within 3 minutes."
              exit 1
            fi
            echo "Waiting for Cloudflare Pages Service Worker propagation (attempt $attempt/36)..."
            sleep 5
          done

      - name: Deployment complete
        run: |
          echo "Hadir frontend deployed successfully to Cloudflare Pages."
          echo "Production URL: $PAGES_PRODUCTION_URL"
          echo "Source commit: $GITHUB_SHA"
          echo "Cloudflare Pages project: ${{ steps.pages-project.outputs.project_name }}"
