name: Verify Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages bundle exactly as production
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate PWA artifacts before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest
          sw = Path("dist/sw.js").read_text(encoding="utf-8")
          assert "hadir-shell-v6" in sw, "expected current service-worker version is missing"
          PY

      - name: Verification complete
        run: |
          echo "Frontend typecheck, production build, and PWA artifact validation passed."
          echo "Cloudflare Pages Git integration is responsible for the production deployment."
