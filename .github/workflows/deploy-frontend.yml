name: Verify Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

env:
  PAGES_PRODUCTION_URL: https://hadir-9rq.pages.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages bundle exactly as production
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate PWA artifacts before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("dist/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest

          sw = Path("dist/sw.js").read_text(encoding="utf-8")
          match = re.search(r'const CACHE="(hadir-shell-v\d+)";', sw)
          assert match, "service-worker cache version declaration is missing"
          assert match.group(1) == "hadir-shell-v7", (
              f"unexpected service-worker cache version: {match.group(1)}"
          )
          assert "SKIP_WAITING" in sw, "service-worker update activation handler is missing"
          assert "notificationclick" in sw, "service-worker notification click handler is missing"
          PY

      - name: Wait for Cloudflare Pages production deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            headers="$(curl -sS -D - -o /tmp/index.html -H 'Cache-Control: no-cache' "$PAGES_PRODUCTION_URL/?hadir_ci=$GITHUB_SHA" || true)"
            if grep -qi '^HTTP/.* 200' <<< "$headers"; then
              break
            fi
            echo "Pages production is not ready yet (attempt $attempt/24); waiting 5s..."
            sleep 5
          done
          test -s /tmp/index.html

      - name: Verify deployed PWA metadata and service worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsS --retry 2 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$PAGES_PRODUCTION_URL/manifest.webmanifest?hadir_ci=$GITHUB_SHA" \
              -o /tmp/manifest.json && \
              curl -fsS --retry 2 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "$PAGES_PRODUCTION_URL/sw.js?hadir_ci=$GITHUB_SHA" \
              -o /tmp/sw.js; then
              if python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          sw = Path("/tmp/sw.js").read_text(encoding="utf-8")
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest
          assert "hadir-shell-v7" in sw
          PY
              then
                echo "Cloudflare Pages production PWA verified: $PAGES_PRODUCTION_URL"
                exit 0
              fi
            fi
            echo "Production PWA is not updated yet (attempt $attempt/24); waiting 5s..."
            sleep 5
          done
          echo "Cloudflare Pages did not expose the expected PWA metadata after the deployment window."
          exit 1

      - name: Verification complete
        run: |
          echo "Frontend typecheck, production build, and PWA artifact validation passed."
          echo "Cloudflare Pages Git integration is responsible for the production deployment."
