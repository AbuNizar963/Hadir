name: Verify Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: hadir-frontend-verification
  cancel-in-progress: true

env:
  PAGES_PRODUCTION_URL: https://hadir-9rq.pages.dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build exactly as the frontend deployment
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate local PWA artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          test -s dist/build-version.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          manifest=json.loads(Path("dist/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("start_url")=="./", manifest
          assert manifest.get("scope")=="./", manifest
          version=json.loads(Path("dist/build-version.json").read_text(encoding="utf-8"))
          assert version.get("commitSha")==os.environ["GITHUB_SHA"], version
          sw=Path("dist/sw.js").read_text(encoding="utf-8")
          match=re.search(r'const CACHE="(hadir-shell-v\d+)";', sw)
          assert match, "service-worker shell cache version declaration is missing"
          assert "SKIP_WAITING" in sw
          assert "notificationclick" in sw
          print(f"Local build verified: {version['commitSha']}; {match.group(1)}")
          PY

      - name: Verify Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store' \
              "$PAGES_PRODUCTION_URL/build-version.json?hadir_ci=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/build-version.json; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("/tmp/build-version.json").read_text(encoding="utf-8"))
          expected=os.environ["GITHUB_SHA"]
          actual=data.get("commitSha")
          if actual==expected:
              print(f"Cloudflare Pages production serves commit {expected}.")
              raise SystemExit(0)
          print(f"Pages currently serves {actual!r}; waiting for {expected!r}.")
          raise SystemExit(1)
          PY
              then exit 0; fi
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Cloudflare Pages Git deployment did not publish the current commit within 3 minutes."
              exit 1
            fi
            echo "Waiting for Cloudflare Pages Git deployment (attempt $attempt/36)..."
            sleep 5
          done

      - name: Verify deployed PWA metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store' \
            "$PAGES_PRODUCTION_URL/manifest.webmanifest?hadir_ci=$GITHUB_SHA" \
            -o /tmp/manifest.json
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store' \
            "$PAGES_PRODUCTION_URL/sw.js?hadir_ci=$GITHUB_SHA" \
            -o /tmp/sw.js
          python - <<'PY'
          import json, re
          from pathlib import Path
          manifest=json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("start_url")=="./", manifest
          assert manifest.get("scope")=="./", manifest
          sw=Path("/tmp/sw.js").read_text(encoding="utf-8")
          match=re.search(r'const CACHE="(hadir-shell-v\d+)";', sw)
          assert match, "production service-worker shell cache version declaration is missing"
          assert "SKIP_WAITING" in sw
          assert "notificationclick" in sw
          print(f"Production PWA verified: {match.group(1)}")
          PY

      - name: Verification complete
        run: |
          echo "Hadir frontend is verified against Cloudflare Pages Git integration."
          echo "Production URL: $PAGES_PRODUCTION_URL"
          echo "Commit: $GITHUB_SHA"
