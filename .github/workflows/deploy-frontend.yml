name: Deploy Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PAGES_PRODUCTION_URL: https://hadir-9rq.pages.dev
  PAGES_PROJECT_NAME: hadir

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages production bundle
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate frontend deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Deploy to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT_NAME" \
            --branch main \
            --commit-dirty=true

      - name: Verify exact production build
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache, no-store' \
              "$PAGES_PRODUCTION_URL/build-version.json?hadir_ci=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/build-version.json; then
              if python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("/tmp/build-version.json").read_text(encoding="utf-8"))
          expected=os.environ["GITHUB_SHA"]
          actual=data.get("commitSha")
          if actual == expected:
              print(f"Cloudflare Pages production serves commit {expected}.")
              raise SystemExit(0)
          print(f"Pages currently serves {actual!r}; waiting for {expected!r}.")
          raise SystemExit(1)
          PY
              then exit 0; fi
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "Cloudflare Pages production did not expose the deployed commit within 3 minutes."
              exit 1
            fi
            echo "Waiting for Cloudflare Pages production propagation (attempt $attempt/36)..."
            sleep 5
          done

      - name: Verify deployed PWA metadata and service worker
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store' \
            "$PAGES_PRODUCTION_URL/manifest.webmanifest?hadir_ci=$GITHUB_SHA" \
            -o /tmp/manifest.json
          curl -fsS --retry 8 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache, no-store' \
            "$PAGES_PRODUCTION_URL/sw.js?hadir_ci=$GITHUB_SHA" \
            -o /tmp/sw.js

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest=json.loads(Path("/tmp/manifest.json").read_text(encoding="utf-8"))
          assert manifest.get("start_url") in ("/", "./"), manifest
          assert manifest.get("scope") in ("/", "./"), manifest
          assert manifest.get("display") == "standalone", manifest
          icons=manifest.get("icons") or []
          assert any(i.get("sizes") == "192x192" and i.get("type") == "image/png" for i in icons), manifest
          assert any(i.get("sizes") == "512x512" and i.get("type") == "image/png" for i in icons), manifest

          sw=Path("/tmp/sw.js").read_text(encoding="utf-8")
          match=re.search(r'const CACHE="(hadir-shell-v\d+)";', sw)
          assert match, "production service-worker shell cache version declaration is missing"
          assert "SKIP_WAITING" in sw, "service-worker update activation handler is missing"
          assert "notificationclick" in sw, "service-worker notification click handler is missing"
          print(f"Production PWA verified: {match.group(1)}")
          PY

      - name: Deployment complete
        run: |
          echo "Hadir frontend deployed successfully to Cloudflare Pages."
          echo "Production URL: $PAGES_PRODUCTION_URL"
          echo "Source commit: $GITHUB_SHA"
          echo "Cloudflare Pages project: $PAGES_PROJECT_NAME"
