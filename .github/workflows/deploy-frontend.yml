name: Deploy Hadir Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/build.mjs"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: hadir-frontend-production
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build Cloudflare Pages production bundle
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Validate Cloudflare Pages credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Validate PWA artifacts before deployment
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/manifest.webmanifest").read_text(encoding="utf-8"))
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest
          sw = Path("dist/sw.js").read_text(encoding="utf-8")
          assert "hadir-shell-v5" in sw, "expected current service-worker version is missing"
          PY

      - name: Resolve existing Cloudflare Pages project
        id: pages-project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -o /tmp/pages-projects.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/pages-projects.json").read_text(encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare API did not return a successful Pages project list")

          projects = data.get("result") or []
          preferred = {"hadir", "hadir-9rq"}
          project = next((p for p in projects if p.get("name") in preferred), None)
          if not project:
              names = [p.get("name") for p in projects if p.get("name")]
              print("Existing Pages projects:", ", ".join(names) or "<none>")
              raise SystemExit("No existing Hadir Pages project was found; refusing to create a new project")

          name = str(project["name"])
          subdomain = str(project.get("subdomain") or f"{name}.pages.dev")
          print(f"project_name={name}")
          print(f"project_subdomain={subdomain}")
          PY

          echo "Using existing Cloudflare Pages project: $(grep '^project_name=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: Deploy to existing Cloudflare Pages project
        env:
          PROJECT_NAME: ${{ steps.pages-project.outputs.project_name }}
        run: |
          set -euo pipefail
          npx wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --commit-dirty=true

      - name: Verify latest Cloudflare Pages deployment
        id: latest-deployment
        env:
          PROJECT_NAME: ${{ steps.pages-project.outputs.project_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments?per_page=1" \
            -o /tmp/latest-deployment.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/latest-deployment.json").read_text(encoding="utf-8"))
          if not data.get("success"):
              raise SystemExit("Cloudflare API did not return the latest Pages deployment")
          deployments = data.get("result") or []
          if not deployments:
              raise SystemExit("No Pages deployment was returned after deployment")
          deployment = deployments[0]
          url = str(deployment.get("url") or "").rstrip("/")
          if not url.startswith("https://"):
              raise SystemExit(f"Unexpected Pages deployment URL: {url!r}")
          print(f"deployment_url={url}")
          PY

      - name: Verify deployed PWA metadata and service worker
        env:
          DEPLOYMENT_URL: ${{ steps.latest-deployment.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          verify_url="${DEPLOYMENT_URL}?hadir_verify=$(date +%s)"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$verify_url/manifest.webmanifest" -o /tmp/manifest.json
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$verify_url/sw.js" -o /tmp/sw.js
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_text = Path("/tmp/manifest.json").read_text(encoding="utf-8")
          manifest = json.loads(manifest_text)
          assert manifest.get("start_url") == "./", manifest
          assert manifest.get("scope") == "./", manifest

          sw = Path("/tmp/sw.js").read_text(encoding="utf-8")
          assert "hadir-shell-v5" in sw, "current service worker was not published"
          PY
          echo "PWA deployment verified successfully at $DEPLOYMENT_URL"
