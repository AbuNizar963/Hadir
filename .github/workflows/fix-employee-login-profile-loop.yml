name: Repair TypeScript and build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply idempotent TypeScript fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              new = fn(text)
              p.write_text(new, encoding="utf-8")

          def replace_once(text, old, new):
              return text.replace(old, new, 1) if old in text else text

          edit("src/pages/ManagerSettings.tsx", lambda s: s.replace('slice(0,10).replaceAll("-","")', 'slice(0,10).replace(/-/g, "")'))

          def manager_employees(s):
              if "updateBackendRequest" not in s:
                  s = re.sub(r'(resetBackendEmployeeDevice)(\s*[,}])', r'\1, updateBackendRequest, getBackendRequests\2', s, count=1)
              s = s.replace('setRequests(await (async()=>{try{return await import("@/lib/backend").then(m=>m.getBackendRequests())}catch{return getRequests()}})());', 'setRequests(await getBackendRequests());')
              return s
          edit("src/pages/ManagerEmployees.tsx", manager_employees)

          def audit(s):
              required = {
                  '"supervisor-login"': '"دخول مشرف"',
                  '"supervisor-login-failed"': '"دخول مشرف فاشل"',
                  '"owner-login"': '"دخول مالك"',
                  '"owner-login-failed"': '"دخول مالك فاشل"',
                  '"admin-login"': '"دخول إداري"',
                  '"admin-login-failed"': '"دخول إداري فاشل"',
              }
              marker = '  "manager-login-failed": "دخول مدير فاشل",'
              if marker in s:
                  additions = ''.join(f'\n  {k}: {v},' for k, v in required.items() if k not in s)
                  s = s.replace(marker, marker + additions, 1)
              return s
          edit("src/pages/ManagerAudit.tsx", audit)

          edit("src/pages/EmployeeScan.tsx", lambda s: s.replace('disabled={step !== "scan" || !inRange || step === "submitting"}', 'disabled={step !== "scan" || !inRange}'))
          edit("src/pages/EmployeeLogin.tsx", lambda s: s.replace('res.error || "الرقم الوظيفي أو رمز الـ PIN غير صحيح"', 'res.reason || "الرقم الوظيفي أو رمز الـ PIN غير صحيح"'))

          def employee_home(s):
              s = s.replace('r.type === "check-in" || r.type === "in"', 'r.type === "check-in"')
              s = s.replace('r.type === "check-out" || r.type === "out"', 'r.type === "check-out"')
              s = s.replace('const shiftEnded = isShiftOver(emp);', 'const shiftEnded = emp ? isShiftOver(emp) : false;')
              return s
          edit("src/pages/EmployeeHome.tsx", employee_home)

          edit("src/components/layout/ManagerLayout.tsx", lambda s: s.replace('{n.title||n.message}', '{n.title || n.body}'))

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerAudit.tsx src/pages/EmployeeScan.tsx src/pages/EmployeeLogin.tsx src/pages/EmployeeHome.tsx src/components/layout/ManagerLayout.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "fix: resolve TypeScript build errors"
            git push origin main
          fi
