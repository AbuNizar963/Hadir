name: Repair TypeScript and build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair source compatibility errors
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{label}: expected text not found")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace("src/pages/ManagerSettings.tsx", 'slice(0,10).replaceAll("-","")', 'slice(0,10).replace(/-/g, "")', "ManagerSettings replaceAll")
          replace("src/pages/ManagerEmployees.tsx", 'backendEnabled, getBackendEmployees, getBackendLocations, saveBackendLocation, createBackendEmployee, updateBackendEmployee, deleteBackendEmployee, resetBackendEmployeeDevice', 'backendEnabled, getBackendEmployees, getBackendLocations, saveBackendLocation, createBackendEmployee, updateBackendEmployee, deleteBackendEmployee, resetBackendEmployeeDevice, updateBackendRequest, getBackendRequests', "ManagerEmployees backend imports")
          replace("src/pages/ManagerEmployees.tsx", 'setRequests(await (async()=>{try{return await import("@/lib/backend").then(m=>m.getBackendRequests())}catch{return getRequests()}})());', 'setRequests(await getBackendRequests());', "ManagerEmployees request refresh")
          replace("src/pages/ManagerAudit.tsx", '  "manager-login-failed": "دخول مدير فاشل",\n};', '  "manager-login-failed": "دخول مدير فاشل",\n  "supervisor-login": "دخول مشرف",\n  "supervisor-login-failed": "دخول مشرف فاشل",\n  "owner-login": "دخول مالك",\n  "owner-login-failed": "دخول مالك فاشل",\n  "admin-login": "دخول إداري",\n  "admin-login-failed": "دخول إداري فاشل",\n};', "ManagerAudit action map")
          replace("src/pages/EmployeeScan.tsx", 'disabled={step !== "scan" || !inRange || step === "submitting"}', 'disabled={step !== "scan" || !inRange}', "EmployeeScan state comparison")
          replace("src/pages/EmployeeLogin.tsx", 'setErr(res.error || "الرقم الوظيفي أو رمز الـ PIN غير صحيح");', 'setErr(res.reason || "الرقم الوظيفي أو رمز الـ PIN غير صحيح");', "EmployeeLogin result property")
          replace("src/pages/EmployeeHome.tsx", 'const checkIn = todays.find((r) => r.type === "check-in" || r.type === "in");\n  const checkOut = todays.find((r) => r.type === "check-out" || r.type === "out");', 'const checkIn = todays.find((r) => r.type === "check-in");\n  const checkOut = todays.find((r) => r.type === "check-out");', "EmployeeHome attendance types")
          replace("src/components/layout/ManagerLayout.tsx", '{n.title||n.message}', '{n.title || n.body}', "ManagerLayout notification property")

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerAudit.tsx src/pages/EmployeeScan.tsx src/pages/EmployeeLogin.tsx src/pages/EmployeeHome.tsx src/components/layout/ManagerLayout.tsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "fix: repair TypeScript errors and verify production build"
          git push origin main
