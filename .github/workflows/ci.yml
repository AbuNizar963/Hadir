name: Hadir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hadir-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply employee location loading fix
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''if(backendEnabled){try{const nextLocations=await getBackendLocations("admin");setLocations(prev=>JSON.stringify(prev)===JSON.stringify(nextLocations)?prev:nextLocations);const nextEscapes=await getBackendEscapeEvents(undefined,2000);setEscapeEvents(prev=>JSON.stringify(prev)===JSON.stringify(nextEscapes)?prev:nextEscapes);}catch{setLocations([])}}'''
          new = '''if(backendEnabled){try{const nextLocations=await getBackendLocations("admin");setLocations(prev=>JSON.stringify(prev)===JSON.stringify(nextLocations)?prev:nextLocations);}catch{}try{const nextEscapes=await getBackendEscapeEvents(undefined,2000);setEscapeEvents(prev=>JSON.stringify(prev)===JSON.stringify(nextEscapes)?prev:nextEscapes);}catch{}}'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-location-loading.yml').unlink(missing_ok=True)

      - name: Commit location fix
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No location fix changes needed."
            exit 0
          fi
          git add src/pages/ManagerEmployees.tsx .github/workflows/fix-location-loading.yml
          git commit -m "fix: keep employee locations loaded independently"
          git push

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install frontend dependencies
        run: bun install

      - name: Typecheck frontend
        run: bun run typecheck

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: backend
        run: npm exec -- wrangler@4.123.0 deploy --dry-run
