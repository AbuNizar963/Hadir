name: Fix employee location loading

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''if(backendEnabled){try{const nextLocations=await getBackendLocations("admin");setLocations(prev=>JSON.stringify(prev)===JSON.stringify(nextLocations)?prev:nextLocations);const nextEscapes=await getBackendEscapeEvents(undefined,2000);setEscapeEvents(prev=>JSON.stringify(prev)===JSON.stringify(nextEscapes)?prev:nextEscapes);}catch{setLocations([])}}'''
          new = '''if(backendEnabled){try{const nextLocations=await getBackendLocations("admin");setLocations(prev=>JSON.stringify(prev)===JSON.stringify(nextLocations)?prev:nextLocations);}catch{}try{const nextEscapes=await getBackendEscapeEvents(undefined,2000);setEscapeEvents(prev=>JSON.stringify(prev)===JSON.stringify(nextEscapes)?prev:nextEscapes);}catch{}}'''
          if old not in s:
              print('Target already fixed or not found; no changes needed.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add src/pages/ManagerEmployees.tsx
          git commit -m "fix: keep employee locations loaded independently"
          git push
