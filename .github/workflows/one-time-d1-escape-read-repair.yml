# One-time canonical repair; removed after Actions verification.
name: One-time D1 escape read repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-d1-escape-read-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize employee-scoped escape lookup
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'backend/src/attendance-engine.ts';
          let source = fs.readFileSync(path, 'utf8');

          const old = `    const escapeQuery = await env.DB.prepare(\n      "SELECT event.employee_id AS employeeId,event.status,event.timestamp FROM escape_events event INNER JOIN (SELECT employee_id,MAX(timestamp) AS latestTimestamp FROM escape_events WHERE timestamp<? GROUP BY employee_id) latest ON latest.employee_id=event.employee_id AND latest.latestTimestamp=event.timestamp WHERE (? = '' OR event.employee_id=?) ORDER BY event.timestamp DESC",\n    )\n      .bind(\n        escapeCutoff.toISOString(),\n        requestedEmployeeId,\n        requestedEmployeeId,\n      )\n      .all<any>();`;
          const replacement = `    const escapeQuery = requestedEmployeeId\n      ? await env.DB.prepare(\n          "SELECT employee_id AS employeeId,status,timestamp FROM escape_events WHERE employee_id=? AND timestamp<? ORDER BY timestamp DESC LIMIT 1",\n        )\n          .bind(requestedEmployeeId, escapeCutoff.toISOString())\n          .all<any>()\n      : await env.DB.prepare(\n          "SELECT event.employee_id AS employeeId,event.status,event.timestamp FROM escape_events event INNER JOIN (SELECT employee_id,MAX(timestamp) AS latestTimestamp FROM escape_events WHERE timestamp<? GROUP BY employee_id) latest ON latest.employee_id=event.employee_id AND latest.latestTimestamp=event.timestamp ORDER BY event.timestamp DESC",\n        )\n          .bind(escapeCutoff.toISOString())\n          .all<any>();`;
          if (!source.includes(old)) throw new Error('escape query anchor not found');
          source = source.replace(old, replacement);

          source = source.replace(
            'AND (? = \'\' OR employee_id=?)',
            'AND employee_id=COALESCE(NULLIF(?, \'\'), employee_id)',
          );
          source = source.replace(
            '.bind(\n        day,\n        day,\n        requestedEmployeeId,\n        requestedEmployeeId,\n        day,\n        requestedEmployeeId,\n        requestedEmployeeId,\n      )',
            '.bind(\n        day,\n        day,\n        requestedEmployeeId,\n        day,\n        requestedEmployeeId,\n      )',
          );
          source = source.replace(
            'AND (? = \'\' OR employee_id=?) ORDER BY timestamp ASC',
            'AND employee_id=COALESCE(NULLIF(?, \'\'), employee_id) ORDER BY timestamp ASC',
          );
          source = source.replace(
            '.bind(\n        historicalFrom,\n        historicalTo,\n        requestedEmployeeId,\n        requestedEmployeeId,\n      )',
            '.bind(\n        historicalFrom,\n        historicalTo,\n        requestedEmployeeId,\n      )',
          );
          source = source.replace(
            'AND (? = \'\' OR e.id=?) ORDER BY e.name',
            'AND e.id=COALESCE(NULLIF(?, \'\'), e.id) ORDER BY e.name',
          );
          source = source.replace(
            '        String(actor.id),\n        requestedEmployeeId,\n        requestedEmployeeId,\n      )',
            '        String(actor.id),\n        requestedEmployeeId,\n      )',
          );

          fs.writeFileSync(path, source);
          NODE
          npx --yes prettier@3.6.2 --write backend/src/attendance-engine.ts
          git diff --check
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "perf: optimize D1 escape state reads"
          git push
