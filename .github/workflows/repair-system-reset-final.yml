name: One-shot final system reset route repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wire reset dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/entry.ts')
          s=p.read_text()
          old='url.pathname==="/api/notifications"||url.pathname==="/api/notifications/read"||url.pathname==="/api/violations"||url.pathname.startsWith("/api/violations/")||url.pathname==="/api/workforce/live"||url.pathname==="/api/device-rebind-requests"'
          new=old+'||url.pathname==="/api/workforce/reset"||url.pathname==="/api/workforce/reset-test-data"'
          if new not in s:
              if old not in s: raise SystemExit('workforce dispatch marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q '/api/workforce/reset' backend/src/entry.ts
          rm -f .github/workflows/repair-system-reset-final.yml .repair-system-reset-trigger-3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: route system reset through workforce handler [skip ci]'
          git push origin HEAD:main
