name: Fix employee D1 profile sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch employee profile flow
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/src/index.ts')
          text = backend.read_text(encoding='utf-8')
          marker = 'if(path==="/api/admins"&&req.method==="GET")'
          endpoint = '''if(path==="/api/employee/profile"&&req.method==="GET"){
            if(actor.role!=="staff")return json({error:"هذا المسار مخصص للموظفين"},403,origin);
            const row=await env.DB.prepare("SELECT * FROM employees WHERE id=? AND status='active' LIMIT 1").bind(actor.id).first<any>();
            if(!row)return json({error:"حساب الموظف غير موجود أو غير نشط"},404,origin);
            return json(employeeOut(row),200,origin);
          }
          '''
          if 'path==="/api/employee/profile"' not in text:
              if marker not in text:
                  raise SystemExit('backend route insertion marker not found')
              text = text.replace(marker, endpoint + marker, 1)
              backend.write_text(text, encoding='utf-8')

          client = Path('src/lib/backend.ts')
          text = client.read_text(encoding='utf-8')
          marker = 'export async function getBackendEmployees()'
          addition = 'export async function getBackendEmployeeProfile(){return request<Employee>("/api/employee/profile");} '
          if 'getBackendEmployeeProfile' not in text:
              if marker not in text:
                  raise SystemExit('backend.ts insertion marker not found')
              text = text.replace(marker, addition + marker, 1)
              client.write_text(text, encoding='utf-8')

          page = Path('src/pages/EmployeeHome.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace('getBackendEmployees, getBackendLocations, getBackendRequests, createBackendRequest', 'getBackendEmployeeProfile, getBackendLocations, getBackendRequests, createBackendRequest', 1)
          old_block = 'const [remoteEmployees, remoteLocations] = await Promise.all([getBackendEmployees(), getBackendLocations()]);\n        const remote = remoteEmployees.find((employee) => employee.jobNumber === session.jobNumber || employee.id === session.employeeId) || null;'
          new_block = 'const remote = await getBackendEmployeeProfile();\n        let remoteLocations = [];\n        try { remoteLocations = await getBackendLocations(); } catch (locationError) { console.warn("Employee location enrichment failed", locationError); }'
          if old_block in text:
              text = text.replace(old_block, new_block, 1)
          else:
              old_block2 = 'const [remote, remoteLocations] = await Promise.all([getBackendEmployeeProfile(), getBackendLocations()]);'
              if old_block2 in text:
                  text = text.replace(old_block2, new_block, 1)
              elif 'const remote = await getBackendEmployeeProfile();' not in text:
                  raise SystemExit('employee refresh block not found')
          old_error = 'console.error("Employee D1 refresh failed", error); setCloudReady(false);'
          new_error = 'console.error("Employee D1 refresh failed", error); setCloudReady(false); setCloudError(error instanceof Error ? error.message : "تعذر تحميل بيانات الموظف من D1");'
          text = text.replace(old_error, new_error, 1)
          if 'const [cloudError, setCloudError]' not in text:
              text = text.replace('const [cloudReady, setCloudReady] = useState(false);', 'const [cloudReady, setCloudReady] = useState(false);\n  const [cloudError, setCloudError] = useState<string | null>(null);', 1)
          old_view = 'return <div className="min-h-screen grid place-items-center text-sm text-muted-foreground">جاري تحميل بيانات الموظف من D1...</div>;'
          new_view = 'return <div className="min-h-screen grid place-items-center p-6 text-sm text-muted-foreground"><div className="hud-card w-full max-w-md p-6 text-center space-y-3"><div>{cloudError || "جاري تحميل بيانات الموظف من D1..."}</div>{cloudError && <button className="btn-primary px-5 py-2" onClick={() => window.location.reload()}>إعادة المحاولة</button>}</div></div>;'
          if old_view in text:
              text = text.replace(old_view, new_view, 1)
          page.write_text(text, encoding='utf-8')

      - name: Typecheck
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npx tsc --noEmit

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.ts src/lib/backend.ts src/pages/EmployeeHome.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: load employee profile directly from D1"
          git push
