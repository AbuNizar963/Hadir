name: Fix employee D1 profile sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch employee profile flow
        shell: python
        run: |
          from pathlib import Path

          backend = Path('backend/src/index.ts')
          text = backend.read_text(encoding='utf-8')
          marker = 'if(path==="/api/admins"&&req.method==="GET")'
          endpoint = '''if(path==="/api/employee/profile"&&req.method==="GET"){
            if(actor.role!=="staff")return json({error:"هذا المسار مخصص للموظفين"},403,origin);
            const row=await env.DB.prepare("SELECT * FROM employees WHERE id=? AND status='active' LIMIT 1").bind(actor.id).first<any>();
            if(!row)return json({error:"حساب الموظف غير موجود أو غير نشط"},404,origin);
            return json(employeeOut(row),200,origin);
          }
          '''
          if 'path==="/api/employee/profile"' not in text:
              if marker not in text:
                  raise SystemExit('backend route insertion marker not found')
              text = text.replace(marker, endpoint + marker, 1)
              backend.write_text(text, encoding='utf-8')

          client = Path('src/lib/backend.ts')
          text = client.read_text(encoding='utf-8')
          marker = 'export async function getBackendEmployees()'
          addition = 'export async function getBackendEmployeeProfile(){return request<Employee>("/api/employee/profile");} '
          if 'getBackendEmployeeProfile' not in text:
              if marker not in text:
                  raise SystemExit('backend.ts insertion marker not found')
              text = text.replace(marker, addition + marker, 1)
              client.write_text(text, encoding='utf-8')

          page = Path('src/pages/EmployeeHome.tsx')
          text = page.read_text(encoding='utf-8')
          old = 'getBackendEmployees, getBackendLocations, getBackendRequests, createBackendRequest'
          new = 'getBackendEmployeeProfile, getBackendLocations, getBackendRequests, createBackendRequest'
          if old not in text:
              raise SystemExit('EmployeeHome import marker not found')
          text = text.replace(old, new, 1)
          old_block = 'const [remoteEmployees, remoteLocations] = await Promise.all([getBackendEmployees(), getBackendLocations()]);\n        const remote = remoteEmployees.find((employee) => employee.jobNumber === session.jobNumber || employee.id === session.employeeId) || null;'
          new_block = 'const [remote, remoteLocations] = await Promise.all([getBackendEmployeeProfile(), getBackendLocations()]);'
          if old_block not in text:
              raise SystemExit('EmployeeHome D1 refresh block not found')
          text = text.replace(old_block, new_block, 1)
          old_error = 'console.error("Employee D1 refresh failed", error);'
          new_error = 'console.error("Employee D1 refresh failed", error); setCloudReady(false);'
          text = text.replace(old_error, new_error, 1)
          page.write_text(text, encoding='utf-8')

      - name: Typecheck
        run: npm ci && npx tsc --noEmit

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.ts src/lib/backend.ts src/pages/EmployeeHome.tsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: load employee profile directly from D1"
          git push
