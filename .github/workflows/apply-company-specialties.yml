name: Apply company specialties
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-company-specialties.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply specialties feature
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('.')
          p = root/'src/types/index.ts'
          s = p.read_text(encoding='utf-8')
          if 'specialties?: string[]; }' not in s:
              old = 'locations?: Location[]; }'
              if old not in s: raise SystemExit('Settings type marker not found')
              p.write_text(s.replace(old, 'locations?: Location[]; specialties?: string[]; }', 1), encoding='utf-8')

          panel = root/'src/components/settings/CompanySpecialtiesPanel.tsx'
          panel.parent.mkdir(parents=True, exist_ok=True)
          if not panel.exists():
              panel.write_text('''import { useEffect, useState } from "react";\nimport { BriefcaseBusiness, Plus, Trash2 } from "lucide-react";\nimport type { Settings } from "@/types";\nimport { getSettings, saveSettings } from "@/lib/storage";\nimport { getBackendSettings, saveBackendSettings } from "@/lib/backend";\n\nconst clean = (values: string[]) => Array.from(new Set(values.map(v => v.trim()).filter(Boolean)));\n\nexport default function CompanySpecialtiesPanel() {\n  const [items, setItems] = useState<string[]>([]);\n  const [value, setValue] = useState("");\n  const [saving, setSaving] = useState(false);\n  const [message, setMessage] = useState<string | null>(null);\n  useEffect(() => { let alive = true; (async () => { const local = getSettings().specialties || []; try { const remote = await getBackendSettings(); const remoteItems = remote?.specialties || []; if (alive) setItems(clean(remoteItems.length ? remoteItems : local)); } catch { if (alive) setItems(clean(local)); } })(); return () => { alive = false; }; }, []);\n  async function persist(next: string[]) { const normalized = clean(next); setItems(normalized); const current = getSettings(); const nextSettings: Settings = { ...current, specialties: normalized }; saveSettings(nextSettings); setSaving(true); setMessage(null); try { await saveBackendSettings(nextSettings); setMessage("تم حفظ التخصصات"); } catch { setMessage("تم حفظها محليًا، وتعذر مزامنة الخادم"); } finally { setSaving(false); } }\n  return <section className="rounded-2xl border border-border/70 bg-card/60 p-5 shadow-sm">\n    <div className="flex items-start gap-3">\n      <div className="grid h-10 w-10 shrink-0 place-items-center rounded-xl border border-primary/20 bg-primary/10 text-primary"><BriefcaseBusiness className="h-5 w-5" /></div>\n      <div className="min-w-0 flex-1"><h2 className="text-sm font-black">تخصصات العمل</h2><p className="mt-1 text-xs text-muted-foreground">يضيف المالك عددًا غير محدود من أنواع العمل لتظهر عند إضافة الموظفين وتستخدم في التقرير اليومي.</p>\n        <div className="mt-4 flex gap-2"><input value={value} onChange={e => setValue(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); const v=value.trim(); if(v && !items.includes(v)) { void persist([...items, v]); setValue(""); } } }} type="text" inputMode="text" autoCapitalize="none" autoCorrect="off" placeholder="مثال: سائق" className="min-w-0 flex-1 rounded-xl border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary" /><button type="button" disabled={saving || !value.trim() || items.includes(value.trim())} onClick={() => { const v=value.trim(); if(v && !items.includes(v)) { void persist([...items, v]); setValue(""); } }} className="inline-flex items-center gap-1.5 rounded-xl bg-primary px-3 py-2 text-xs font-black text-primary-foreground disabled:opacity-50"><Plus className="h-4 w-4" />إضافة</button></div>\n        <div className="mt-4 flex flex-wrap gap-2">{items.length === 0 ? <span className="text-xs text-muted-foreground">لم تتم إضافة تخصصات بعد.</span> : items.map(item => <span key={item} className="inline-flex items-center gap-1.5 rounded-full border border-border bg-background px-3 py-1.5 text-xs font-bold"><span>{item}</span><button type="button" onClick={() => void persist(items.filter(x => x !== item))} className="rounded-full p-0.5 text-muted-foreground hover:bg-destructive/10 hover:text-destructive" aria-label={`حذف ${item}`}><Trash2 className="h-3.5 w-3.5" /></button></span>)}</div>\n        {message && <p className="mt-3 text-[11px] text-muted-foreground">{message}</p>}\n      </div>\n    </div>\n  </section>;\n}\n''', encoding='utf-8')

          p = root/'src/pages/ManagerSettings.tsx'
          s = p.read_text(encoding='utf-8')
          if 'CompanySpecialtiesPanel' not in s:
              s = s.replace('import ManagerLayout from "@/components/layout/ManagerLayout";', 'import ManagerLayout from "@/components/layout/ManagerLayout";\nimport CompanySpecialtiesPanel from "@/components/settings/CompanySpecialtiesPanel";', 1)
              m = re.search(r'<ManagerLayout[^>]*>', s)
              if not m: raise SystemExit('ManagerLayout opening tag not found')
              s = s[:m.end()] + '\n      <CompanySpecialtiesPanel />' + s[m.end():]
              p.write_text(s, encoding='utf-8')

          p = root/'src/pages/ManagerEmployees.tsx'
          s = p.read_text(encoding='utf-8')
          if 'CompanySpecialtySelect' not in s:
              s = s.replace('import { getEmployees, saveEmployees } from "@/lib/storage";', 'import { getEmployees, saveEmployees, getSettings } from "@/lib/storage";', 1)
              marker = 'function Field({ label, children, hint }: { label: string; children: ReactNode; hint?: string }) {'
              if marker not in s: raise SystemExit('ManagerEmployees Field marker not found')
              select = '''function CompanySpecialtySelect({ value, onChange }: { value: string; onChange: (value: string) => void }) {\n  const options = getSettings().specialties || [];\n  const current = value.trim();\n  const merged = current && !options.includes(current) ? [current, ...options] : options;\n  return <select value={current} onChange={e => onChange(e.target.value)} className="w-full rounded-xl border border-border bg-background px-3 py-2 text-sm outline-none focus:border-primary"><option value="">اختر نوع العمل</option>{merged.map(item => <option key={item} value={item}>{item}</option>)}</select>;\n}\n\n'''
              s = s.replace(marker, select + marker, 1)
              replacement = '<Field label="نوع العمل" hint="تؤخذ من تخصصات الشركة التي يضيفها المالك"><CompanySpecialtySelect value={form.specialties} onChange={v => setForm(prev => ({ ...prev, specialties: v }))} /></Field>'
              patterns = [r'<Field label="التخصصات"[^>]*>.*?</Field>', r'<Field label="الاختصاص"[^>]*>.*?</Field>', r'<Field label="Specialties"[^>]*>.*?</Field>']
              for pat in patterns:
                  s2, count = re.subn(pat, replacement, s, count=1, flags=re.S)
                  if count: s = s2; break
              else: raise SystemExit('Existing specialties field not found; refusing unsafe insertion')
              p.write_text(s, encoding='utf-8')

          # Keep mixed identifiers/passwords on a text-capable mobile keyboard.
          for rel in ['src/pages/ManagerEmployees.tsx','src/pages/ManagerLogin.tsx','src/pages/EmployeeLogin.tsx']:
              p = root/rel
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = re.sub(r'(type=["\'](?:text|password)["\'][^>]*?)inputMode=["\']numeric["\']', r'\1inputMode="text"', s)
                  p.write_text(s, encoding='utf-8')

          print('Applied company specialties feature.')
EOF

git config user.name "HADIR Bot"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
git add src/types/index.ts src/components/settings/CompanySpecialtiesPanel.tsx src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerLogin.tsx src/pages/EmployeeLogin.tsx
if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
git commit -m "feat: add owner-managed work specialties"
git push