name: Apply company specialties

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-company-specialties.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository patches
        run: |
          python3 scripts/apply_company_specialties.py
          python3 scripts/apply_job_number_update.py

      - name: Apply Arabic language corrections
        run: node scripts/patch-arabic-language.mjs

      - name: Centralize notification network access
        run: node scripts/patch-notification-network-centralization.mjs

      - name: Format backend source
        run: |
          set -euo pipefail
          cd backend
          npx --yes prettier@3.6.2 --write \
            src/attendance-engine-commands.ts \
            src/report-archive.ts \
            src/deviceSecurity.ts \
            src/device-rebind-api.ts

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/components/settings/CompanySpecialtiesPanel.tsx src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerReports.tsx public/report-print.css backend/src/recovery.ts backend/src/index.ts backend/src/entry.ts backend/src/ai-entry.ts backend/src/employee-save-production-gateway.ts backend/src/workforce.ts backend/src/device-rebind-api.ts backend/src/requests.ts backend/src/attendance-engine-commands.ts backend/src/report-archive.ts backend/src/deviceSecurity.ts scripts/apply_job_number_update.py scripts/patch-arabic-language.mjs scripts/patch-notification-network-centralization.mjs src/components/layout/ManagerLayout.tsx src/components/layout/EmployeeLayout.tsx src/pages/ManagerRequests.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "chore: apply canonical repository patches"
          git push
