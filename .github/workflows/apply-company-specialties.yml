name: Apply company specialties
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-company-specialties.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repository patch
        run: python3 scripts/apply_company_specialties.py
      - name: Commit patch
        run: |
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/components/settings/CompanySpecialtiesPanel.tsx src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerReports.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "feat: add owner-managed work specialties"
          git push
