name: Apply company specialties

on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/apply-company-specialties.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply repository patches
        run: |
          python3 scripts/apply_company_specialties.py
          python3 scripts/apply_job_number_update.py

      - name: Apply Arabic language corrections
        run: node scripts/patch-arabic-language.mjs

      - name: Repair ManagerLayout theme key
        run: node scripts/patch-manager-theme-key.mjs

      - name: Centralize notification network access
        run: node scripts/patch-notification-network-centralization.mjs

      - name: Apply workforce live attendance read optimization
        run: node scripts/patch-workforce-live-attendance-read.mjs

      - name: Format frontend source
        run: |
          set -euo pipefail
          npx --yes prettier@3.6.2 --write \
            src/App.tsx \
            src/lib/backend.ts \
            src/lib/cloudDataSync.ts \
            src/pages/ManagerAudit.tsx \
            src/pages/ManagerWorkforceControls.tsx

      - name: Format backend source
        run: |
          set -euo pipefail
          cd backend
          npx --yes prettier@3.6.2 --write \
            src/attendance-engine-commands.ts \
            src/report-archive.ts \
            src/deviceSecurity.ts \
            src/device-rebind-api.ts \
            src/notification-api.ts \
            src/workforce.ts

      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "HADIR Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/index.ts src/components/settings/CompanySpecialtiesPanel.tsx src/pages/ManagerSettings.tsx src/pages/ManagerEmployees.tsx src/pages/ManagerReports.tsx src/pages/EmployeeHome.tsx src/pages/EmployeeScan.tsx src/pages/EmployeeNotifications.tsx src/pages/ReportArchive.tsx src/pages/ManagerRequests.tsx src/App.tsx src/lib/backend.ts src/lib/cloudDataSync.ts src/pages/ManagerAudit.tsx src/pages/ManagerWorkforceControls.tsx public/report-print.css backend/src/recovery.ts backend/src/index.ts backend/src/entry.ts backend/src/ai-entry.ts backend/src/employee-save-production-gateway.ts backend/src/workforce.ts backend/src/device-rebind-api.ts backend/src/requests.ts backend/src/attendance-engine-commands.ts backend/src/report-archive.ts backend/src/deviceSecurity.ts backend/src/notification-api.ts scripts/apply_job_number_update.py scripts/patch-arabic-language.mjs scripts/patch-manager-theme-key.mjs scripts/patch-notification-network-centralization.mjs scripts/patch-workforce-live-attendance-read.mjs src/components/layout/ManagerLayout.tsx src/components/layout/EmployeeLayout.tsx
          if git diff --cached --quiet; then echo "No changes needed"; exit 0; fi
          git commit -m "chore: apply canonical repository patches"
          git push
