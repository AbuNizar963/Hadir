name: Publish Android Release

on:
  push:
    tags:
      - "android-v1.0.*"

permissions:
  contents: write

concurrency:
  group: hadir-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-android:
    name: Build, verify, and publish Android APKs
    runs-on: ubuntu-latest
    env:
      HADIR_RELEASE_KEYSTORE_BASE64: ${{ secrets.HADIR_RELEASE_KEYSTORE_BASE64 }}
      HADIR_RELEASE_STORE_PASSWORD: ${{ secrets.HADIR_RELEASE_STORE_PASSWORD }}
      HADIR_RELEASE_KEY_ALIAS: ${{ secrets.HADIR_RELEASE_KEY_ALIAS }}
      HADIR_RELEASE_KEY_PASSWORD: ${{ secrets.HADIR_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out the tagged Flutter source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release tag, source branch, and signing secrets
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v1\.0\.([1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            echo "Expected format: android-v1.0.N (N must be a positive integer)."
            exit 1
          fi

          version_code="${BASH_REMATCH[1]}"
          if (( version_code <= 1 )); then
            echo "The release versionCode must be greater than the current baseline (1)."
            exit 1
          fi

          git fetch --no-tags origin refs/heads/flutter-mobile-app:refs/remotes/origin/flutter-mobile-app
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/flutter-mobile-app; then
            echo "Android releases must be tagged from a commit already present on flutter-mobile-app."
            exit 1
          fi

          for secret_name in \
            HADIR_RELEASE_KEYSTORE_BASE64 \
            HADIR_RELEASE_STORE_PASSWORD \
            HADIR_RELEASE_KEY_ALIAS \
            HADIR_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $secret_name"
              exit 1
            fi
          done

          echo "HADIR_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "HADIR_VERSION_NAME=1.0.$version_code" >> "$GITHUB_ENV"

      - name: Restore the persistent Android signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/hadir-release-key.jks"
          printf '%s' "$HADIR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "HADIR_RELEASE_KEYSTORE=$keystore_path" >> "$GITHUB_ENV"

      - name: Generate Android wrapper if required
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew || ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            flutter create --platforms=android .
          fi
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --reporter expanded

      - name: Build signed Android release APKs
        run: >
          flutter build apk
          --release
          --build-name="$HADIR_VERSION_NAME"
          --build-number="$HADIR_VERSION_CODE"

      - name: Verify package identity, version, and signing certificate
        shell: bash
        run: |
          set -euo pipefail

          apk_dir="build/app/outputs/flutter-apk"
          test -d "$apk_dir"

          if [[ ! -f "$apk_dir/app-universal-release.apk" ]]; then
            if [[ -f "$apk_dir/app-release.apk" ]]; then
              mv "$apk_dir/app-release.apk" "$apk_dir/app-universal-release.apk"
            else
              echo "The universal APK was not produced."
              find "$apk_dir" -maxdepth 1 -type f -print
              exit 1
            fi
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"

          expected_fingerprint=""
          apk_count=0
          shopt -s nullglob
          apks=("$apk_dir"/*-release.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No release APK files were generated."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            metadata="$("$aapt" dump badging "$apk" | sed -n '1p')"
            package_name="$(sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" <<< "$metadata")"
            version_code="$(sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$metadata")"
            version_name="$(sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" <<< "$metadata")"

            test "$package_name" = "com.hadir.attendance"
            test "$version_code" = "$HADIR_VERSION_CODE"
            test "$version_name" = "$HADIR_VERSION_NAME"

            certificate_report="$RUNNER_TEMP/$(basename "$apk").certificate.txt"
            "$apksigner" verify --verbose --print-certs "$apk" > "$certificate_report" 2>&1
            fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$certificate_report" | head -n 1)"
            if [[ -z "$fingerprint" ]]; then
              echo "Could not read the APK signing certificate fingerprint: $(basename "$apk")"
              exit 1
            fi

            if [[ -z "$expected_fingerprint" ]]; then
              expected_fingerprint="$fingerprint"
            elif [[ "$fingerprint" != "$expected_fingerprint" ]]; then
              echo "Release APKs were signed with different certificates."
              exit 1
            fi

            apk_count=$((apk_count + 1))
            echo "Verified $(basename "$apk") — versionCode $version_code"
          done

          (
            cd "$apk_dir"
            sha256sum ./*-release.apk > SHA256SUMS
          )

          echo "Verified $apk_count APK files with one consistent signing certificate."
          echo "Signing certificate SHA-256: $expected_fingerprint"

      - name: Prepare Arabic release notes
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          ## حاضر ${HADIR_VERSION_NAME} — Build ${HADIR_VERSION_CODE}

          - حزمة Android: com.hadir.attendance
          - رقم الإصدار ورقم البناء متوافقان مع فاحص التحديث داخل التطبيق.
          - يتضمن الإصدار APK شاملًا ونسخًا مخصصة لمعمارية الجهاز عند توفرها.
          - تم التحقق من توقيع ملفات APK وتطابق شهادة التوقيع بينها.
          - ملف SHA256SUMS مرفق للتحقق من سلامة التنزيل.
          EOF

      - name: Publish GitHub Release and APK assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "حاضر ${{ env.HADIR_VERSION_NAME }} — Build ${{ env.HADIR_VERSION_CODE }}"
          body_path: release-notes.md
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
