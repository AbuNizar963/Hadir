name: _safe_patch_future_status
on:
  push:
    branches:
      - fix/daily-status-future-schedule
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch exact condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/attendance-engine.ts')
          s=p.read_text()
          old='else if(day===today&&schedule.start&&now.getTime()<schedule.start.getTime())status="NOT_STARTED";'
          new='else if(day>=today&&schedule.start&&now.getTime()<schedule.start.getTime())status="NOT_STARTED";'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git diff -- backend/src/attendance-engine.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          git commit -m "fix: mark future scheduled days as not started"
          git push
