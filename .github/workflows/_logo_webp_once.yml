name: Apply logo WebP patch once
on:
  push:
    branches: [Apps]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-logo-webp-upload.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/administration/pages/admin_mobile_settings_reference_page.dart
          git commit -m "fix(settings): upload company logo as WebP"
          git fetch origin Apps
          git rebase origin/Apps
          git push origin Apps
