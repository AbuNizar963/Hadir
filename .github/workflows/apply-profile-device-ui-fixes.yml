name: apply-profile-device-ui-fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hadir-feature-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Hadir feature integration
        run: python3 .github/scripts/apply_hadir_features.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src backend .github/scripts/apply_hadir_features.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: employee profile device recovery and live status UI [hadir-feature-patch]"
          git push
