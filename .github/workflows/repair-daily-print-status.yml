name: Repair daily print attendance status

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical daily print repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pages/ManagerReports.tsx")
          source = path.read_text(encoding="utf-8")

          old_import = '''  formatDurationMinutes,\n  formatTime,\n  minutesBetween,\n} from "@/lib/utils";'''
          new_import = '''  formatDurationMinutes,\n  formatTime,\n  minutesBetween,\n  todayKey,\n} from "@/lib/utils";'''
          if old_import not in source:
              raise SystemExit("ManagerReports import anchor not found")
          source = source.replace(old_import, new_import, 1)

          old_service = '''function serviceRows(\n  summaries: Summary[],\n  dates: Date[],\n  index: Map<string, { in?: Audit; out?: Audit }>,\n  settings: ReturnType<typeof getSettings>,\n  requests: RequestRow[],\n  dailyStatus?: Map<string, DailyStatusRow>,\n) {\n  return summaries.map((s) => {\n    const d = calculateDetails(\n      s.employee,\n      datesForEmployee(s.employee, dates),\n      index,\n      settings,\n      requests,\n      dailyStatus,\n    )[0];\n    return {\n      employee: s.employee,\n      specialty: specialtyOf(s.employee),\n      status: d.status,\n      checkIn: d.checkIn,\n      checkOut: d.checkOut,\n      note: d.detail,\n    };\n  });\n}\n'''
          new_service = '''function isShiftEndedForDailyReport(date: Date, end: Date | null) {\n  const reportDay = key(date);\n  const currentDay = todayKey();\n\n  if (reportDay < currentDay) return true;\n  if (reportDay > currentDay) return false;\n  return !!end && Date.now() >= end.getTime();\n}\n\nfunction serviceRows(\n  summaries: Summary[],\n  dates: Date[],\n  index: Map<string, { in?: Audit; out?: Audit }>,\n  settings: ReturnType<typeof getSettings>,\n  requests: RequestRow[],\n  dailyStatus?: Map<string, DailyStatusRow>,\n) {\n  return summaries.map((s) => {\n    const reportDates = datesForEmployee(s.employee, dates);\n    const d = calculateDetails(\n      s.employee,\n      reportDates,\n      index,\n      settings,\n      requests,\n      dailyStatus,\n    )[0];\n\n    if (!d) {\n      return {\n        employee: s.employee,\n        specialty: specialtyOf(s.employee),\n        status: "absent" as Status,\n        checkIn: "—",\n        checkOut: "—",\n        note: "",\n      };\n    }\n\n    if (d.status !== "open" || d.checkIn === "—") {\n      return {\n        employee: s.employee,\n        specialty: specialtyOf(s.employee),\n        status: d.status,\n        checkIn: d.checkIn,\n        checkOut: d.checkOut,\n        note: d.detail,\n      };\n    }\n\n    const reportDate = reportDates[0];\n    const workPeriod = reportDate\n      ? getEmployeeWorkPeriod(s.employee, reportDate)\n      : null;\n    const ended =\n      !!reportDate &&\n      isShiftEndedForDailyReport(reportDate, workPeriod?.end ?? null);\n    const status: Status = d.late > 0 ? "late" : "present";\n    const note = ended\n      ? [d.detail, "انصراف ناقص"].filter(Boolean).join(" · ")\n      : d.detail;\n\n    return {\n      employee: s.employee,\n      specialty: specialtyOf(s.employee),\n      status,\n      checkIn: d.checkIn,\n      checkOut: d.checkOut,\n      note,\n    };\n  });\n}\n'''
          if old_service not in source:
              raise SystemExit("ManagerReports serviceRows anchor not found")
          source = source.replace(old_service, new_service, 1)
          path.write_text(source, encoding="utf-8")

          css_path = Path("public/report-print.css")
          css = css_path.read_text(encoding="utf-8")
          old_css = '''  .daily-print-status {\n    display: inline-block !important;\n    font-weight: 800 !important;\n    white-space: nowrap !important;\n  }\n'''
          new_css = '''  .daily-print-status {\n    display: inline-flex !important;\n    align-items: center !important;\n    justify-content: center !important;\n    min-width: 22mm !important;\n    padding: 1mm 2.2mm !important;\n    border-radius: 999px !important;\n    font-weight: 900 !important;\n    line-height: 1.2 !important;\n    white-space: nowrap !important;\n    -webkit-print-color-adjust: exact !important;\n    print-color-adjust: exact !important;\n  }\n\n  .daily-print-status.present {\n    background: #d1fae5 !important;\n    color: #047857 !important;\n  }\n\n  .daily-print-status.late {\n    background: #fef3c7 !important;\n    color: #b45309 !important;\n  }\n\n  .daily-print-status.absent {\n    background: #fee2e2 !important;\n    color: #b91c1c !important;\n  }\n\n  .daily-print-status.early {\n    background: #ffedd5 !important;\n    color: #c2410c !important;\n  }\n\n  .daily-print-status.permission {\n    background: #e0f2fe !important;\n    color: #0369a1 !important;\n  }\n\n  .daily-print-status.leave {\n    background: #ede9fe !important;\n    color: #6d28d9 !important;\n  }\n\n  .daily-print-status.off,\n  .daily-print-status.not_started {\n    background: #e2e8f0 !important;\n    color: #475569 !important;\n  }\n\n  .daily-print-status.open {\n    background: #fef3c7 !important;\n    color: #a16207 !important;\n  }\n'''
          if old_css not in css:
              raise SystemExit("report-print.css status anchor not found")
          css_path.write_text(css.replace(old_css, new_css, 1), encoding="utf-8")

          if len(path.read_text(encoding="utf-8").splitlines()) < 1000:
              raise SystemExit("ManagerReports.tsx unexpectedly short after repair")
          if len(css_path.read_text(encoding="utf-8").splitlines()) < 100:
              raise SystemExit("report-print.css unexpectedly short after repair")
          print("Canonical daily print repair applied")
          PY

      - name: Verify source shape
        shell: bash
        run: |
          grep -q 'todayKey' src/pages/ManagerReports.tsx
          grep -q 'انصراف ناقص' src/pages/ManagerReports.tsx
          grep -q 'daily-print-status.present' public/report-print.css
          grep -q 'daily-print-status.absent' public/report-print.css
          test "$(wc -l < src/pages/ManagerReports.tsx)" -ge 1000
          test "$(wc -l < public/report-print.css)" -ge 100

      - name: Commit canonical repair and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-daily-print-status.yml
          git add src/pages/ManagerReports.tsx public/report-print.css .github/workflows/repair-daily-print-status.yml
          git commit -m "Fix daily print attendance status and styling"
          git push
