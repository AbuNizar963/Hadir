name: Fix SmartEmployeeImport syntax

on:
  push:
    branches:
      - fix/employee-export-import-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed parseNumber expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/employees/SmartEmployeeImport.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'function parseNumber(value: unknown, fallback: number) { const n = Number(String(value ?? "").replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d))); return Number.isFinite(n) ? n : fallback; }'
          new = '''function parseNumber(value: unknown, fallback: number) {
            const normalized = String(value ?? "").replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
            const n = Number(normalized);
            return Number.isFinite(n) ? n : fallback;
          }'''
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/employees/SmartEmployeeImport.tsx
          git diff --cached --quiet || git commit -m 'fix(employees): correct import number parser syntax'
          git push
