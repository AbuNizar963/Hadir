name: One-time employee location fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-location:
    if: github.actor == 'AbuNizar963'
    runs-on: ubuntu-latest
    steps:
      - name: Patch location source and UI
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';

            async function getFile(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(r.data)) throw new Error(`${path} is a directory`);
              return { sha: r.data.sha, text: Buffer.from(r.data.content, 'base64').toString('utf8') };
            }
            async function putFile(path, sha, text, message) {
              await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, branch, sha, message, content: Buffer.from(text, 'utf8').toString('base64') });
            }

            {
              const path = 'backend/src/index.ts';
              const f = await getFile(path);
              if (!f.text.includes('owner configured main site')) {
                const re = /        let location: any = null;\n        if \(employee\.location_id\) \{[\s\S]*?        return json\(\{ location \}, 200, origin\);/;
                const replacement = `        let location: any = null;\n        if (employee.location_id) {\n          location = await env.DB.prepare("SELECT id,name,lat,lng,radius_meters AS radiusMeters FROM locations WHERE id=? LIMIT 1").bind(employee.location_id).first<any>();\n        }\n        // owner configured main site is authoritative for employees without an explicit branch.\n        if (!location) {\n          const rows = await env.DB.prepare("SELECT key,value FROM settings WHERE key IN ('workSiteLat','workSiteLng','radiusMeters')").all<{key:string,value:string}>();\n          const main: Record<string, any> = {};\n          for (const row of rows.results) { try { main[row.key] = JSON.parse(row.value); } catch { main[row.key] = row.value; } }\n          const lat = Number(main.workSiteLat);\n          const lng = Number(main.workSiteLng);\n          const radiusMeters = Number(main.radiusMeters);\n          if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(radiusMeters) && radiusMeters >= 0) {\n            location = { id: 'main', name: 'المقر الرئيسي', lat, lng, radiusMeters };\n          }\n        }\n        if (!location) location = await env.DB.prepare("SELECT id,name,lat,lng,radius_meters AS radiusMeters FROM locations ORDER BY name LIMIT 1").first<any>();\n        if (!location) return json({ error: "لا يوجد موقع حضور مضبوط في قاعدة البيانات" }, 404, origin);\n        return json({ location }, 200, origin);`;
                if (!re.test(f.text)) throw new Error('Backend location block not found');
                await putFile(path, f.sha, f.text.replace(re, replacement), 'fix: make main D1 GPS settings authoritative for employees');
              }
            }

            {
              const path = 'src/pages/EmployeeScan.tsx';
              const f = await getFile(path);
              let next = f.text.replace('import { getBackendSettings } from "@/lib/backend";', 'import { getBackendEmployeeLocation } from "@/lib/backend";');
              const oldStart = '  // D1 main GPS settings are authoritative for employee attendance.\n  // Do not use stale local/assigned-location values here; those previously caused\n  // the employee screen to show an old 100m radius and wrong coordinates.\n  useEffect(() => {';
              const start = next.indexOf(oldStart);
              const endMarker = '  const targetLat = Number(settings.workSiteLat);';
              const end = next.indexOf(endMarker, start);
              if (start >= 0 && end >= 0 && !next.includes('Employee-safe D1 endpoint is authoritative')) {
                const newBlock = `  // Employee-safe D1 endpoint is authoritative. It returns the owner's main site settings for staff.\n  useEffect(() => {\n    let cancelled = false;\n    void getBackendEmployeeLocation().then(({ location }) => {\n      if (cancelled) return;\n      setSettings((prev) => ({ ...prev, workSiteLat: Number(location.lat), workSiteLng: Number(location.lng), radiusMeters: Number(location.radiusMeters) }));\n    }).catch((e) => {\n      if (!cancelled) console.warn("تعذر تحميل موقع الحضور من D1، سيتم استخدام النسخة المحلية مؤقتًا:", e);\n    });\n    return () => { cancelled = true; };\n  }, []);\n\n`;
                next = next.slice(0, start) + newBlock + next.slice(end);
              }
              if (next !== f.text) await putFile(path, f.sha, next, 'fix: load employee attendance GPS from D1');
            }
