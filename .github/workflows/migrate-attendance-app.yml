name: migrate-attendance-app
on:
  push:
    branches: [refactor/attendance-app-engine]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/attendance-app-engine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Migrate
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='backend/src/app.ts';
          let s=fs.readFileSync(p,'utf8');
          if(!s.includes('async function handleAttendance(')){console.log('already migrated');process.exit(0)}
          if(!s.includes('from "./employee-attendance-gateway"')) s='import { handleEmployeeAttendance } from "./employee-attendance-gateway";\n'+s;
          const a=s.indexOf('async function handleAttendance('), b=s.indexOf('\nexport default',a);
          if(a<0||b<0) throw new Error('unsafe handleAttendance boundary');
          const r='async function handleAttendance(req: Request, env: Env, actor: any, origin: string) {\n  const response = await handleEmployeeAttendance(req, env, actor, origin);\n  return response || json({error:"الموظف فقط يستطيع تسجيل الحضور"},403,origin);\n}\n';
          s=s.slice(0,a)+r+s.slice(b+1);
          if(s.includes('INSERT INTO attendance')||s.includes('INSERT INTO audit')) throw new Error('legacy attendance SQL remains');
          fs.writeFileSync(p,s);
          NODE
      - name: Verify
        working-directory: backend
        run: |
          npm install
          npm run check
      - name: Commit
        run: |
          git diff --check
          git diff --stat
          git add backend/src/app.ts
          git rm .github/workflows/migrate-attendance-app.yml
          git commit -m "refactor(attendance): remove legacy app attendance writer"
          git push origin refactor/attendance-app-engine
