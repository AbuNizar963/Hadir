name: Deploy Hadir API

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OWNER_RECOVERY_CODE: ${{ secrets.OWNER_RECOVERY_CODE }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#CLOUDFLARE_API_TOKEN}" -ge 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --package-lock=false

      - name: Validate Worker bundle
        working-directory: backend
        run: npm run check

      - name: Apply remote D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply Hadir --remote

      - name: Prepare Worker secrets
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JWT_SECRET"
          test -n "$OWNER_RECOVERY_CODE"
          test -n "$VAPID_PUBLIC_KEY"
          test -n "$VAPID_PRIVATE_KEY"
          test -n "$VAPID_SUBJECT"
          umask 077
          python - <<'PY'
          import json, os
          values = {
              "JWT_SECRET": os.environ["JWT_SECRET"],
              "OWNER_RECOVERY_CODE": os.environ["OWNER_RECOVERY_CODE"],
              "VAPID_PUBLIC_KEY": os.environ["VAPID_PUBLIC_KEY"],
              "VAPID_PRIVATE_KEY": os.environ["VAPID_PRIVATE_KEY"],
              "VAPID_SUBJECT": os.environ["VAPID_SUBJECT"],
          }
          with open('.secrets.json', 'w', encoding='utf-8') as f:
              json.dump(values, f)
          PY

      - name: Deploy hadir-api once
        working-directory: backend
        run: npx wrangler deploy --secrets-file .secrets.json

      - name: Verify Cloudflare Worker secrets
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list 2>/dev/null)"
          printf '%s\n' "$secrets"
          printf '%s\n' "$secrets" | grep -q 'GEMINI_API_KEY' || {
            echo 'GEMINI_API_KEY is not configured on the deployed Cloudflare Worker.'
            echo 'Add GEMINI_API_KEY in Cloudflare Workers & Pages > hadir-api > Settings > Variables and Secrets > Secrets, then redeploy.'
            exit 1
          }

      - name: Remove temporary secrets file
        if: always()
        working-directory: backend
        run: rm -f .secrets.json

      - name: Verify API health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://hadir-api.abunizar963.workers.dev/api/health -o /tmp/health.json
          cat /tmp/health.json
          python - /tmp/health.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          assert data.get('d1') is True, data
          PY

      - name: Verify production Pages CORS
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -sS --retry 5 --retry-delay 2 -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://hadir.pages.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            https://hadir-api.abunizar963.workers.dev/api/auth/login)"
          printf '%s\n' "$headers"
          normalized_headers="$(printf '%s\n' "$headers" | tr -d '\r')"
          printf '%s\n' "$normalized_headers" | grep -Fqi 'access-control-allow-origin: https://hadir.pages.dev'
          printf '%s\n' "$normalized_headers" | grep -Fqi 'access-control-allow-credentials: true'

      - name: Verify bootstrap compatibility
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' https://hadir-api.abunizar963.workers.dev/api/bootstrap)"
          cat /tmp/bootstrap.json
          case "$code" in
            200|401) exit 0 ;;
            *) echo "Unexpected /api/bootstrap status: $code"; exit 1;;
          esac
