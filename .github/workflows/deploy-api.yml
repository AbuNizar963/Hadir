name: Deploy Hadir API

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      OWNER_RECOVERY_CODE: ${{ secrets.OWNER_RECOVERY_CODE }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Cloudflare credentials
        working-directory: backend
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler whoami

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --package-lock=false

      - name: Validate Worker bundle
        working-directory: backend
        run: npm run check

      - name: Apply remote D1 migrations
        working-directory: backend
        run: npx wrangler d1 migrations apply Hadir --remote

      # Wrangler blocks `secret put` until the Worker has a deployed version.
      # Deploy once to establish the latest version, sync secrets, then deploy
      # again so the production version is created with the current secrets.
      - name: Bootstrap deploy hadir-api
        working-directory: backend
        run: npx wrangler deploy

      - name: Sync Worker secrets
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JWT_SECRET"
          test -n "$OWNER_RECOVERY_CODE"
          test -n "$VAPID_PUBLIC_KEY"
          test -n "$VAPID_PRIVATE_KEY"
          test -n "$VAPID_SUBJECT"
          printf '%s' "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          printf '%s' "$OWNER_RECOVERY_CODE" | npx wrangler secret put OWNER_RECOVERY_CODE
          printf '%s' "$VAPID_PUBLIC_KEY" | npx wrangler secret put VAPID_PUBLIC_KEY
          printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
          printf '%s' "$VAPID_SUBJECT" | npx wrangler secret put VAPID_SUBJECT

      - name: Deploy hadir-api
        working-directory: backend
        run: npx wrangler deploy

      - name: Verify D1 health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 https://hadir-api.abunizar963.workers.dev/api/health -o /tmp/health.json
          cat /tmp/health.json
          python - /tmp/health.json <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('ok') is True, data
          assert data.get('d1') is True, data
          PY

      - name: Verify bootstrap compatibility
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/bootstrap.json -w '%{http_code}' https://hadir-api.abunizar963.workers.dev/api/bootstrap)"
          cat /tmp/bootstrap.json
          case "$code" in
            200|401) exit 0 ;;
            *) echo "Unexpected /api/bootstrap status: $code"; exit 1 ;;
          esac
