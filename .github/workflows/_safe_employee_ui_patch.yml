name: Safe Employee UI Patch

on:
  push:
    branches: [Apps]
    paths:
      - '.github/workflows/_safe_employee_ui_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'ui(employee): refine work info card') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 1
      - name: Patch only the work-info UI region
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/employee/pages/hadir_workspace_page_implementation.dart')
          s = p.read_text(encoding='utf-8')
          marker = "import 'package:intl/intl.dart' as intl;\n"
          lucide = "import 'package:lucide_icons_flutter/lucide_icons.dart';\n"
          if lucide not in s:
              s = s.replace(marker, marker + lucide, 1)
          old = '''  Widget _workInfo(BuildContext context) {\n    final schedule = _schedule();\n    final today = _todayAttendance();\n    final approved = _todayApprovedRequests();\n    final status = _status(schedule, _openSession(today), today.any((r) => _type(r) == 'check-in'), _activeEscape(), approved.any((r) => _requestType(r) == 'leave'), approved.any((r) => _requestType(r) == 'permission'));\n    final type = '${_employee['scheduleType'] ?? 'ADMIN'}'.toUpperCase();\n    return _section(context, 'معلومات الدوام', 'حالتك الحالية', Column(children: [\n      _info(context, Icons.calendar_today_outlined, 'الفترة', _periodLabel(schedule)),\n      _info(context, Icons.schedule_rounded, type == 'ROTATION' ? 'وقت المناوبة' : 'الفترة', _scheduleLabel(schedule) == 'مناوبة تناوبية' ? _rotationDurationLabel() : _periodLabel(schedule)),\n      _info(context, Icons.verified_outlined, 'الحالة', status),\n      _info(context, Icons.location_on_outlined, 'الموقع', _locationName()),\n      _info(context, Icons.devices_other_rounded, 'الجهاز', _deviceLabel()),\n    ]));\n  }\n'''
          new = '''  Widget _workInfo(BuildContext context) {\n    final scheme = Theme.of(context).colorScheme;\n    final schedule = _schedule();\n    final today = _todayAttendance();\n    final approved = _todayApprovedRequests();\n    final checkedIn = today.any((r) => _type(r) == 'check-in');\n    final status = _status(\n      schedule,\n      _openSession(today),\n      checkedIn,\n      _activeEscape(),\n      approved.any((r) => _requestType(r) == 'leave'),\n      approved.any((r) => _requestType(r) == 'permission'),\n    );\n    final type = '${_employee['scheduleType'] ?? 'ADMIN'}'.toUpperCase();\n    final isRotation = type == 'ROTATION';\n    final statusColor = switch (status) {\n      'حاضر' => scheme.primary,\n      'متأخر' => Colors.orange.shade700,\n      'غائب' || 'هارب' => scheme.error,\n      'إجازة' || 'إذن' => scheme.secondary,\n      _ => scheme.onSurfaceVariant,\n    };\n    final statusIcon = switch (status) {\n      'حاضر' => LucideIcons.badgeCheck,\n      'متأخر' => LucideIcons.clock3,\n      'غائب' || 'هارب' => LucideIcons.circleAlert,\n      'إجازة' || 'إذن' => LucideIcons.calendarDays,\n      _ => LucideIcons.clock3,\n    };\n    final shiftTitle = isRotation ? 'وقت المناوبة' : 'الفترة';\n    final shiftValue = isRotation && _scheduleLabel(schedule) == 'مناوبة تناوبية'\n        ? _rotationDurationLabel()\n        : _periodLabel(schedule);\n\n    return _section(\n      context,\n      'معلومات الدوام',\n      'ملخص الدوام والحالة الحالية',\n      Column(\n        crossAxisAlignment: CrossAxisAlignment.stretch,\n        children: [\n          Container(\n            padding: const EdgeInsets.all(13),\n            decoration: BoxDecoration(\n              color: statusColor.withValues(alpha: .08),\n              borderRadius: BorderRadius.circular(15),\n              border: Border.all(color: statusColor.withValues(alpha: .22)),\n            ),\n            child: Row(\n              children: [\n                Container(\n                  width: 40,\n                  height: 40,\n                  decoration: BoxDecoration(\n                    color: statusColor.withValues(alpha: .12),\n                    borderRadius: BorderRadius.circular(12),\n                  ),\n                  child: Icon(statusIcon, color: statusColor, size: 19),\n                ),\n                const SizedBox(width: 10),\n                Expanded(\n                  child: Column(\n                    crossAxisAlignment: CrossAxisAlignment.start,\n                    children: [\n                      Text('الحالة الآن', style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 9)),\n                      const SizedBox(height: 2),\n                      Text(status, style: TextStyle(color: statusColor, fontSize: 14, fontWeight: FontWeight.w900)),\n                    ],\n                  ),\n                ),\n                if (schedule['isWorkDay'] == true)\n                  Text(\n                    _scheduleLabel(schedule),\n                    textAlign: TextAlign.end,\n                    style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 9, fontWeight: FontWeight.w700),\n                  ),\n              ],\n            ),\n          ),\n          const SizedBox(height: 10),\n          Row(\n            children: [\n              Expanded(child: _workInfoMetric(context, LucideIcons.calendarDays, 'الدوام', _scheduleLabel(schedule))),\n              const SizedBox(width: 8),\n              Expanded(child: _workInfoMetric(context, LucideIcons.clock3, shiftTitle, shiftValue)),\n            ],\n          ),\n          const SizedBox(height: 9),\n          Row(\n            children: [\n              Expanded(child: _workInfoChip(context, LucideIcons.mapPin, 'الموقع', _locationName())),\n              const SizedBox(width: 8),\n              Expanded(child: _workInfoChip(context, LucideIcons.smartphone, 'الجهاز', _deviceLabel())),\n            ],\n          ),\n          if (isRotation) ...[\n            const SizedBox(height: 9),\n            Container(\n              padding: const EdgeInsets.symmetric(horizontal: 11, vertical: 9),\n              decoration: BoxDecoration(\n                color: scheme.secondaryContainer.withValues(alpha: .38),\n                borderRadius: BorderRadius.circular(12),\n              ),\n              child: Row(\n                children: [\n                  Icon(LucideIcons.repeat2, size: 15, color: scheme.primary),\n                  const SizedBox(width: 7),\n                  Expanded(\n                    child: Text(\n                      'نظام المناوبة: ${_rotationDurationLabel()}',\n                      style: TextStyle(color: scheme.onSurface, fontSize: 9.5, fontWeight: FontWeight.w800),\n                    ),\n                  ),\n                ],\n              ),\n            ),\n          ],\n        ],\n      ),\n    );\n  }\n\n  Widget _workInfoMetric(BuildContext context, IconData icon, String title, String value) {\n    final scheme = Theme.of(context).colorScheme;\n    return Container(\n      constraints: const BoxConstraints(minHeight: 68),\n      padding: const EdgeInsets.all(10),\n      decoration: BoxDecoration(\n        color: scheme.surface,\n        borderRadius: BorderRadius.circular(13),\n        border: Border.all(color: scheme.outlineVariant.withValues(alpha: .72)),\n      ),\n      child: Row(\n        children: [\n          Icon(icon, size: 17, color: scheme.primary),\n          const SizedBox(width: 8),\n          Expanded(\n            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.start,\n              mainAxisAlignment: MainAxisAlignment.center,\n              children: [\n                Text(title, style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 8.5)),\n                const SizedBox(height: 3),\n                Text(value, maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(color: scheme.onSurface, fontSize: 9.5, fontWeight: FontWeight.w900)),\n              ],\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n\n  Widget _workInfoChip(BuildContext context, IconData icon, String title, String value) {\n    final scheme = Theme.of(context).colorScheme;\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 9),\n      decoration: BoxDecoration(\n        color: scheme.primary.withValues(alpha: .055),\n        borderRadius: BorderRadius.circular(12),\n        border: Border.all(color: scheme.primary.withValues(alpha: .14)),\n      ),\n      child: Row(\n        children: [\n          Icon(icon, size: 15, color: scheme.primary),\n          const SizedBox(width: 7),\n          Expanded(\n            child: Text(\n              '$title: $value',\n              maxLines: 2,\n              overflow: TextOverflow.ellipsis,\n              style: TextStyle(color: scheme.onSurface, fontSize: 8.8, fontWeight: FontWeight.w700),\n            ),\n          ),\n        ],\n      ),\n    );\n  }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'ABORT: expected exactly one work-info block, found {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- lib/features/employee/pages/hadir_workspace_page_implementation.dart
          test "$(grep -c "^  Widget _workInfo(BuildContext context)" lib/features/employee/pages/hadir_workspace_page_implementation.dart)" -eq 1
          test "$(grep -c "^  Widget _workInfoMetric" lib/features/employee/pages/hadir_workspace_page_implementation.dart)" -eq 1
          test "$(grep -c "^  Widget _workInfoChip" lib/features/employee/pages/hadir_workspace_page_implementation.dart)" -eq 1
      - name: Commit only the UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/employee/pages/hadir_workspace_page_implementation.dart
          git commit -m "ui(employee): refine work info card"
          git push origin HEAD:Apps
