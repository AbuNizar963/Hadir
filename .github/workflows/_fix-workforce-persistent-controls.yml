name: _fix-workforce-persistent-controls
on:
  push:
    branches: [fix/workforce-persistent-controls]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workforce live payload
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/workforce.ts')
          s=p.read_text()
          old='SELECT id,job_number AS jobNumber,name,status,role,work_start_time AS workStartTime,work_end_time AS workEndTime,schedule_type AS scheduleType,avatar FROM employees ORDER BY name'
          new='SELECT id,job_number AS jobNumber,name,status,role,work_start_time AS workStartTime,work_end_time AS workEndTime,schedule_type AS scheduleType,avatar,is_vip AS isVip,auto_check_in AS autoCheckIn,auto_check_out AS autoCheckOut FROM employees ORDER BY name'
          if old not in s:
              raise SystemExit('expected workforce employee SELECT was not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate patch
        run: |
          grep -F 'is_vip AS isVip,auto_check_in AS autoCheckIn,auto_check_out AS autoCheckOut' backend/src/workforce.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/_fix-workforce-persistent-controls.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/workforce.ts .github/workflows/_fix-workforce-persistent-controls.yml
          git commit -m 'fix(workforce): persist attendance controls in live payload'
          git push
