name: One-shot repair system reset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wire existing workforce reset route
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/entry.ts')
          s = p.read_text()
          s = s.replace('import { handleSystemReset } from "./system-reset";\n', '', 1)
          s = s.replace('    if(url.pathname==="/api/system/reset"&&request.method==="POST"){ const admin=await actorForAdministrativeAction(request,env); const response=await handleSystemReset(env,admin,origin); return addDeviceCookie(response,prepared.deviceId,prepared.setCookie,origin); }\n', '', 1)
          s = s.replace('url.pathname === "/api/device-rebind-requests"', 'url.pathname === "/api/device-rebind-requests" || url.pathname === "/api/workforce/reset" || url.pathname === "/api/workforce/reset-test-data"')
          if '/api/workforce/reset' not in s:
              raise SystemExit('reset route wiring failed')
          if 'handleSystemReset' in s or './system-reset' in s:
              raise SystemExit('obsolete system reset wiring remains')
          p.write_text(s)
          PY
          rm -f backend/src/system-reset.ts .repair-system-reset-trigger
          grep -q '/api/workforce/reset' backend/src/entry.ts
          ! grep -q 'handleSystemReset' backend/src/entry.ts
          ! test -e backend/src/system-reset.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/entry.ts backend/src/system-reset.ts .repair-system-reset-trigger
          git commit -m 'fix: wire existing workforce system reset route [skip ci]'
          git push origin HEAD:main
