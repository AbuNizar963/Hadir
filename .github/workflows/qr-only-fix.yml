name: QR-only isolated fix

on:
  push:
    branches: [qr-only-fix-20260901]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Apply QR-only patch
        run: node scripts/qr-only-fix.mjs

      - name: Verify scope and code
        run: |
          git diff --check
          test "$(git diff --name-only)" = $'src/pages/EmployeeScan.tsx\nsrc/pages/ManagerSettings.tsx'
          grep -q 'api.qrserver.com/v1/create-qr-code/?size=900x900&ecc=H&margin=3' src/pages/ManagerSettings.tsx
          ! grep -q 'cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js' src/pages/ManagerSettings.tsx
          grep -q 'width: { ideal: 1280 }' src/pages/EmployeeScan.tsx
          grep -q 'scanTimerRef.current = window.setTimeout(() => void scan(), 120);' src/pages/EmployeeScan.tsx

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        env:
          VITE_BASE_PATH: /
        run: bun run build

      - name: Commit and remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/qr-only-fix.yml scripts/qr-only-fix.mjs
          git add src/pages/EmployeeScan.tsx src/pages/ManagerSettings.tsx
          git commit -m 'fix: restore legacy QR design and speed up QR scanning'
          git push origin HEAD:qr-only-fix-20260901
