name: Employee card formatting patch

on:
  push:
    branches: [fix/employee-card-actions]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply focused UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text()
          old = 'import { generateId } from "@/lib/utils";\nimport { hash } from "@/lib/hash";'
          new = 'import { generateId } from "@/lib/utils";\nimport { hash } from "@/lib/hash";\nimport {\n  ArrowRightToLine,\n  ArrowLeftFromLine,\n  Footprints,\n  Pencil,\n  Trash2,\n  Smartphone,\n} from "lucide-react";'
          if old not in s:
              raise SystemExit('missing import anchor')
          s = s.replace(old, new, 1)
          old = '''      <div className="mt-2 flex items-center justify-between gap-2 text-[10px] text-muted-foreground">\n        <span>السماح: {e.gracePeriodMinutes ?? 0} دقيقة</span>\n        <span>{e.deviceId ? "الهاتف مرتبط" : "الهاتف غير مرتبط"}</span>\n      </div>'''
          new = '''      <div className="mt-2 flex items-center gap-2 text-[10px] text-muted-foreground">\n        <span>السماح: {e.gracePeriodMinutes ?? 0} دقيقة</span>\n        <span className="inline-flex items-center gap-1" title={e.deviceId ? "الهاتف مرتبط" : "الهاتف غير مرتبط"}>\n          <Smartphone className="h-3.5 w-3.5" aria-hidden="true" />\n          {e.deviceId ? "مرتبط" : "غير مرتبط"}\n        </span>\n      </div>'''
          if old not in s:
              raise SystemExit('missing device anchor')
          s = s.replace(old, new, 1)
          replacements = [
            ('className="btn-primary text-[11px]"', 'className="btn-primary inline-flex h-8 items-center gap-1.5 px-2.5 text-[11px]"'),
            ('className="btn-secondary text-[11px]"', 'className="btn-secondary inline-flex h-8 items-center gap-1.5 px-2.5 text-[11px]"'),
          ]
          for a,b in replacements:
              s=s.replace(a,b)
          s=s.replace('''            تحضير مباشر\n          </button>''','''            <ArrowRightToLine className="h-3.5 w-3.5" aria-hidden="true" />\n            <span>تحضير مباشر</span>\n          </button>''',1)
          s=s.replace('''            انصراف مباشر\n          </button>''','''            <ArrowLeftFromLine className="h-3.5 w-3.5" aria-hidden="true" />\n            <span>انصراف مباشر</span>\n          </button>''',1)
          s=s.replace('''className="rounded-lg border border-destructive/30 px-2.5 py-1.5 text-[11px] font-bold text-destructive hover:bg-destructive/10"''','''className="inline-flex h-8 items-center gap-1.5 rounded-lg border border-destructive/30 px-2.5 text-[11px] font-bold text-destructive hover:bg-destructive/10"''',1)
          s=s.replace('''              هروب\n            </button>''','''              <Footprints className="h-3.5 w-3.5" aria-hidden="true" />\n              <span>هروب</span>\n            </button>''',1)
          s=s.replace('''className="rounded-lg border border-primary/30 px-2.5 py-1.5 text-[11px] font-bold text-primary hover:bg-primary/10"''','''className="inline-flex h-8 items-center gap-1.5 rounded-lg border border-primary/30 px-2.5 text-[11px] font-bold text-primary hover:bg-primary/10"''',1)
          s=s.replace('''              إلغاء الهروب / عاد\n            </button>''','''              <Footprints className="h-3.5 w-3.5" aria-hidden="true" />\n              <span>عاد للعمل</span>\n            </button>''',1)
          s=s.replace('''              تعديل\n            </button>''','''              <Pencil className="h-3.5 w-3.5" aria-hidden="true" />\n              <span>تعديل</span>\n            </button>''',1)
          s=s.replace('''className="rounded-lg px-2 py-1.5 text-[11px] font-semibold text-destructive hover:bg-destructive/10"''','''className="inline-flex h-8 items-center gap-1.5 rounded-lg px-2.5 text-[11px] font-semibold text-destructive hover:bg-destructive/10"''',1)
          s=s.replace('''              حذف\n            </button>''','''              <Trash2 className="h-3.5 w-3.5" aria-hidden="true" />\n              <span>حذف</span>\n            </button>''',1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx
          git commit -m "fix(ui): unify employee card action icons"
          git push

# intentional retrigger after workflow creation
