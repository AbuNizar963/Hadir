name: Safe patch rotation history window
on:
  push:
    branches: [fix/rotation-history-window]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact attendance engine expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/src/attendance-engine.ts')
          s=p.read_text()
          old='const historicalFrom=localDateTimeUtc(addDays(day,-7),"00:00").toISOString();'
          new='const maxRotationOn=Math.max(1,...employees.map((e:any)=>String(e.scheduleType||"").trim().toUpperCase()==="ROTATION"?Math.max(1,Math.floor(Number(e.rotationDaysOn??4))):1));const historicalFrom=localDateTimeUtc(addDays(day,-Math.max(7,maxRotationOn-1)),"00:00").toISOString();'
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git diff -- backend/src/attendance-engine.ts
          test "$(git diff --numstat -- backend/src/attendance-engine.ts | awk '{print $1 "+" $2}')" = "1+1"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/attendance-engine.ts
          git commit -m "fix: derive rotation attendance history window"
          git push
