name: one-time report print patch

on:
  push:
    branches: [Apps]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(reports): match web report and native print') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch Flutter report and employee card printing
        shell: python
        run: |
          from pathlib import Path
          import re

          pub = Path('pubspec.yaml')
          s = pub.read_text(encoding='utf-8')
          if '  pdf:' not in s:
              s = s.replace('  dio: ^5.9.0\n', '  dio: ^5.9.0\n  pdf: ^3.11.3\n')
          if '  printing:' not in s:
              s = s.replace('  qr_flutter: ^4.1.0\n', '  qr_flutter: ^4.1.0\n  printing: ^5.14.3\n')
          pub.write_text(s, encoding='utf-8')

          report = Path('lib/features/administration/pages/admin_reports_implementation.dart')
          s = report.read_text(encoding='utf-8')
          if "package:pdf/widgets.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:pdf/pdf.dart';\nimport 'package:pdf/widgets.dart' as pw;\nimport 'package:printing/printing.dart';\n")

          marker = '  Future<void> _exportExcel() async {'
          if 'Future<void> _printReport() async' not in s:
              method = r'''  Future<void> _printReport() async {
    final rows = _filteredRows();
    if (rows.isEmpty) return;
    setState(() => _exporting = true);
    try {
      final regular = await PdfGoogleFonts.notoSansArabicRegular();
      final bold = await PdfGoogleFonts.notoSansArabicBold();
      final pdf = pw.Document();
      final summary = _report?['summary'] is Map
          ? Map<String, dynamic>.from(_report!['summary'] as Map)
          : <String, dynamic>{};
      final analytics = _report?['analytics'] is Map
          ? Map<String, dynamic>.from(_report!['analytics'] as Map)
          : <String, dynamic>{};
      final exceptions = analytics['exceptions'] is List
          ? (analytics['exceptions'] as List).length
          : 0;
      final tableRows = rows.map((row) => <String>[
            '${row['attendanceDay'] ?? '—'}',
            '${row['employeeName'] ?? '—'}',
            '${row['jobNumber'] ?? '—'}',
            _status('${row['status'] ?? ''}'),
            _clock(row['checkInAt']),
            _clock(row['checkOutAt']),
            _fmtMinutes(row['workedMinutes']),
            '${row['lateMinutes'] ?? 0}',
            '${row['earlyLeaveMinutes'] ?? 0}',
            '${row['overtimeMinutes'] ?? 0}',
          ]).toList();
      pdf.addPage(
        pw.MultiPage(
          pageFormat: PdfPageFormat.a4.landscape,
          margin: const pw.EdgeInsets.all(24),
          textDirection: pw.TextDirection.rtl,
          header: (context) => pw.Container(
            padding: const pw.EdgeInsets.only(bottom: 10),
            decoration: const pw.BoxDecoration(
              border: pw.Border(bottom: pw.BorderSide(color: PdfColors.grey700, width: 1.2)),
            ),
            child: pw.Row(
              mainAxisAlignment: pw.MainAxisAlignment.spaceBetween,
              children: [
                pw.Text('HADIR / حاضر', style: pw.TextStyle(font: bold, fontSize: 18, color: PdfColor.fromInt(0xFF0B6B5A))),
                pw.Text('تقرير الحضور', style: pw.TextStyle(font: bold, fontSize: 17)),
              ],
            ),
          ),
          footer: (context) => pw.Align(
            alignment: pw.Alignment.center,
            child: pw.Text('صفحة ${context.pageNumber} من ${context.pagesCount}', style: pw.TextStyle(font: regular, fontSize: 8, color: PdfColors.grey600)),
          ),
          build: (context) => [
            pw.SizedBox(height: 12),
            pw.Text('الفترة: ${_date(_from)} → ${_date(_to)}', style: pw.TextStyle(font: bold, fontSize: 11)),
            pw.SizedBox(height: 10),
            pw.Row(children: [
              _pdfMetric('الموظفون', '${_num(summary, 'employees')}'),
              _pdfMetric('الحضور', '${_num(summary, 'present') + _num(summary, 'late')}'),
              _pdfMetric('الساعات', _fmtMinutes(summary['workedMinutes'])),
              _pdfMetric('الاستثناءات', '$exceptions'),
            ]),
            pw.SizedBox(height: 14),
            pw.Text('السجل اليومي الرسمي', style: pw.TextStyle(font: bold, fontSize: 14)),
            pw.SizedBox(height: 6),
            pw.TableHelper.fromTextArray(
              data: tableRows,
              headers: const ['التاريخ', 'الموظف', 'الرقم الوظيفي', 'الحالة', 'الحضور', 'الانصراف', 'الساعات', 'التأخر', 'المغادرة المبكرة', 'الإضافي'],
              headerStyle: pw.TextStyle(font: bold, fontSize: 7.5, color: PdfColors.white),
              cellStyle: pw.TextStyle(font: regular, fontSize: 7),
              headerDecoration: const pw.BoxDecoration(color: PdfColor.fromInt(0xFF0B6B5A)),
              rowDecoration: const pw.BoxDecoration(border: pw.Border(bottom: pw.BorderSide(color: PdfColors.grey300, width: .4))),
              tableDirection: pw.TextDirection.rtl,
              headerDirection: pw.TextDirection.rtl,
              cellPadding: const pw.EdgeInsets.symmetric(horizontal: 4, vertical: 4),
              cellAlignments: {0: pw.Alignment.center, 1: pw.Alignment.centerRight, 2: pw.Alignment.center, 3: pw.Alignment.center, 4: pw.Alignment.center, 5: pw.Alignment.center, 6: pw.Alignment.center, 7: pw.Alignment.center, 8: pw.Alignment.center, 9: pw.Alignment.center},
            ),
          ],
        ),
      );
      await Printing.layoutPdf(
        name: 'hadir-report-${_date(_from)}-${_date(_to)}.pdf',
        onLayout: (_) async => pdf.save(),
      );
    } finally {
      if (mounted) setState(() => _exporting = false);
    }
  }

  pw.Widget _pdfMetric(String label, String value) => pw.Expanded(
        child: pw.Container(
          margin: const pw.EdgeInsets.only(left: 6),
          padding: const pw.EdgeInsets.all(8),
          decoration: pw.BoxDecoration(
            border: pw.Border.all(color: PdfColors.grey300),
            borderRadius: pw.BorderRadius.circular(8),
          ),
          child: pw.Column(crossAxisAlignment: pw.CrossAxisAlignment.start, children: [
            pw.Text(label, style: pw.TextStyle(font: regular, fontSize: 7, color: PdfColors.grey600)),
            pw.SizedBox(height: 2),
            pw.Text(value, style: pw.TextStyle(font: bold, fontSize: 13)),
          ]),
        ),
      );

'''
              if marker not in s:
                  raise SystemExit('report insertion anchor not found')
              s = s.replace(marker, method + marker, 1)

          old_actions = """          PopupMenuButton<String>(
            tooltip: 'تصدير التقرير',
            enabled: !_exporting && rows.isNotEmpty,
"""
          new_actions = """          IconButton(onPressed: !_exporting && rows.isNotEmpty ? _printReport : null, tooltip: 'طباعة التقرير', icon: const Icon(Icons.print_outlined)),
          PopupMenuButton<String>(
            tooltip: 'تصدير التقرير',
            enabled: !_exporting && rows.isNotEmpty,
"""
          if "tooltip: 'طباعة التقرير'" not in s:
              if old_actions not in s:
                  raise SystemExit('report appbar anchor not found')
              s = s.replace(old_actions, new_actions, 1)

          old_hero = '''            Container(
              padding: const EdgeInsets.all(19),
              decoration: BoxDecoration(
                gradient: const LinearGradient(begin: Alignment.topRight, end: Alignment.bottomLeft, colors: [HadirBrand.primary, HadirBrand.primaryDark]),
                borderRadius: BorderRadius.circular(HadirBrand.radiusXl),
              ),
              child: const Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                Text('لوحة الحضور التنفيذية', style: TextStyle(color: Colors.white, fontSize: 23, fontWeight: FontWeight.w900)),
                SizedBox(height: 6),
                Text('تقرير رسمي من طبقة بيانات حاضر مع فلاتر، تفصيل يومي وتصدير جاهز للمشاركة.', style: TextStyle(color: Colors.white70, height: 1.5, fontSize: 12)),
              ]),
            ),
'''
          new_hero = '''            Container(
              padding: const EdgeInsets.all(18),
              decoration: BoxDecoration(
                color: Colors.white,
                borderRadius: BorderRadius.circular(20),
                border: Border.all(color: HadirBrand.border),
                boxShadow: const [BoxShadow(color: Color(0x12000000), blurRadius: 14, offset: Offset(0, 5))],
              ),
              child: Row(children: [
                Container(width: 44, height: 44, decoration: BoxDecoration(color: HadirBrand.soft, borderRadius: BorderRadius.circular(13)), child: const Icon(Icons.bar_chart_rounded, color: HadirBrand.primary, size: 23)),
                const SizedBox(width: 12),
                const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text('التقارير', style: TextStyle(color: HadirBrand.muted, fontSize: 10)),
                  SizedBox(height: 2),
                  Text('تقرير الحضور', style: TextStyle(fontSize: 22, fontWeight: FontWeight.w900)),
                  SizedBox(height: 4),
                  Text('بيانات الحضور الرسمية مع الفلاتر والتفصيل والتصدير والطباعة.', style: TextStyle(color: HadirBrand.muted, height: 1.4, fontSize: 11)),
                ])),
              ]),
            ),
'''
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)
          report.write_text(s, encoding='utf-8')

          profile = Path('lib/features/employee/pages/profile_page_reference_implementation_v2.dart')
          s = profile.read_text(encoding='utf-8')
          if "dart:ui" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'dart:ui' as ui;\n\nimport 'package:flutter/material.dart';\n")
          if "package:pdf/pdf.dart" not in s:
              s = s.replace("import 'package:lucide_icons_flutter/lucide_icons.dart';\n", "import 'package:lucide_icons_flutter/lucide_icons.dart';\nimport 'package:pdf/pdf.dart';\nimport 'package:pdf/widgets.dart' as pw;\nimport 'package:printing/printing.dart';\n")
          if 'Future<void> _printDigitalCard() async' not in s:
              anchor = '  Widget _digitalCard() {'
              method = r'''  Future<void> _printDigitalCard() async {
    final name = _text('name', 'الموظف');
    final job = _text('jobNumber', _text('username'));
    final id = _text('id', job);
    final verifyUrl = id == '—' ? '' : '$_webOrigin/employee/verify/${Uri.encodeComponent(id)}';
    if (verifyUrl.isEmpty) {
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تعذر إنشاء رمز التحقق حالياً.')));
      return;
    }
    try {
      final qrData = await QrPainter(data: verifyUrl, version: QrVersions.auto, gapless: true).toImageData(480, format: ui.ImageByteFormat.png);
      if (qrData == null) throw Exception('QR generation failed');
      final regular = await PdfGoogleFonts.notoSansArabicRegular();
      final bold = await PdfGoogleFonts.notoSansArabicBold();
      final pdf = pw.Document();
      final qr = pw.MemoryImage(qrData.buffer.asUint8List());
      pdf.addPage(pw.Page(
        pageFormat: PdfPageFormat.a4,
        margin: const pw.EdgeInsets.all(40),
        build: (context) => pw.Directionality(
          textDirection: pw.TextDirection.rtl,
          child: pw.Center(child: pw.Container(
            width: 360,
            padding: const pw.EdgeInsets.all(24),
            decoration: pw.BoxDecoration(border: pw.Border.all(color: PdfColor.fromInt(0xFFDCE6E2)), borderRadius: pw.BorderRadius.circular(18)),
            child: pw.Column(children: [
              pw.Text('HADIR', style: pw.TextStyle(font: bold, fontSize: 14, color: PdfColor.fromInt(0xFF0B6B5A))),
              pw.SizedBox(height: 5),
              pw.Text('الهوية الرقمية', style: pw.TextStyle(font: bold, fontSize: 20)),
              pw.SizedBox(height: 16),
              pw.Text(name, style: pw.TextStyle(font: bold, fontSize: 22)),
              pw.SizedBox(height: 5),
              pw.Text('موظف · الرقم الوظيفي $job', style: pw.TextStyle(font: regular, fontSize: 10, color: PdfColors.grey700)),
              pw.SizedBox(height: 18),
              pw.Image(qr, width: 190, height: 190),
              pw.SizedBox(height: 8),
              pw.Text('امسح الرمز للتحقق من هوية الموظف', style: pw.TextStyle(font: regular, fontSize: 9, color: PdfColors.grey700)),
              pw.SizedBox(height: 16),
              pw.Row(mainAxisAlignment: pw.MainAxisAlignment.spaceBetween, children: [
                pw.Text('الحالة: نشط', style: pw.TextStyle(font: bold, fontSize: 9, color: PdfColor.fromInt(0xFF0B6B5A))),
                pw.Text('التحقق: QR آمن', style: pw.TextStyle(font: bold, fontSize: 9)),
              ]),
            ]),
          )),
        ),
      ));
      await Printing.layoutPdf(name: 'hadir-digital-card-$job.pdf', onLayout: (_) async => pdf.save());
    } catch (_) {
      if (mounted) ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تعذر تجهيز البطاقة للطباعة. حاول مرة أخرى.')));
    }
  }

'''
              if anchor not in s:
                  raise SystemExit('profile insertion anchor not found')
              s = s.replace(anchor, method + anchor, 1)
          old = "onPressed: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('طباعة البطاقة متاحة من نسخة الويب حالياً.'))),"
          if old in s:
              s = s.replace(old, 'onPressed: _printDigitalCard,', 1)
          profile.write_text(s, encoding='utf-8')

      - name: Verify modified files are non-empty
        run: |
          test -s pubspec.yaml
          test -s lib/features/administration/pages/admin_reports_implementation.dart
          test -s lib/features/employee/pages/profile_page_reference_implementation_v2.dart
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/features/administration/pages/admin_reports_implementation.dart lib/features/employee/pages/profile_page_reference_implementation_v2.dart
          git diff --cached --check
          git commit -m 'feat(reports): match web report and native print'
          git push origin Apps
