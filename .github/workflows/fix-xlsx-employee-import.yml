name: Fix XLSX employee import

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XLSX parser
        run: bun add xlsx

      - name: Patch employee importer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/ManagerEmployees.tsx')
          s = p.read_text(encoding='utf-8')

          if 'import * as XLSX from "xlsx";' not in s:
              marker = 'import { addNotification } from "@/lib/notifications";'
              s = s.replace(marker, marker + '\nimport * as XLSX from "xlsx";', 1)

          old = 'if (!/\\.csv$/i.test(file.name) && file.type && !file.type.includes("csv") && !file.type.includes("text")) {'
          new = 'if (!/\\.(csv|xlsx|xls)$/i.test(file.name) && file.type && !file.type.includes("csv") && !file.type.includes("text") && !file.type.includes("spreadsheet") && !file.type.includes("excel")) {'
          s = s.replace(old, new)
          s = s.replace('throw new Error("يرجى اختيار ملف CSV صالح.");', 'throw new Error("يرجى اختيار ملف CSV أو Excel صالح (.csv / .xlsx / .xls).");', 1)

          old = 'const rows = parseCsv(await file.text());'
          new = '''const rows: string[][] = /\\.(xlsx|xls)$/i.test(file.name)
        ? XLSX.utils.sheet_to_json(XLSX.read(await file.arrayBuffer(), { type: "array" }).Sheets[XLSX.read(await file.arrayBuffer(), { type: "array" }).SheetNames[0]], { header: 1, defval: "" }) as string[][]
        : parseCsv(await file.text());'''
          # Avoid reading the workbook twice: replace with a safer helper when possible.
          new = '''const rows: string[][] = (() => {
        if (!/\\.(xlsx|xls)$/i.test(file.name)) return parseCsv(await file.text());
        const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        if (!firstSheet) throw new Error("ملف Excel لا يحتوي على ورقة بيانات.");
        return XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" }) as string[][];
      })();'''
          # async IIFE is required because file.text/arrayBuffer are async.
          new = '''const rows: string[][] = await (async () => {
        if (!/\\.(xlsx|xls)$/i.test(file.name)) return parseCsv(await file.text());
        const workbook = XLSX.read(await file.arrayBuffer(), { type: "array" });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        if (!firstSheet) throw new Error("ملف Excel لا يحتوي على ورقة بيانات.");
        return XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" }) as string[][];
      })();'''
          if old not in s:
              raise SystemExit('Could not find employee CSV parser line')
          s = s.replace(old, new, 1)

          s = s.replace('accept=".csv,text/csv"', 'accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"', 1)

          # Accept both the original app export names and the user's Excel template.
          old = '''const index = (key: string) => headers.findIndex(h => h.toLowerCase() === key.toLowerCase());
      if (index("name") < 0 || index("jobNumber") < 0) {
        throw new Error("يجب أن يحتوي الملف على عمودي name و jobNumber.");
      }'''
          new = '''const index = (...keys: string[]) => headers.findIndex(h => keys.some(key => h.toLowerCase() === key.toLowerCase()));
      const nameIndex = index("name", "employee_name", "الاسم", "اسم الموظف");
      const jobIndex = index("jobNumber", "employee_number", "employeeNumber", "job_number", "الرقم الوظيفي", "رقم الموظف");
      if (nameIndex < 0 || jobIndex < 0) {
        throw new Error("يجب أن يحتوي الملف على عمود الاسم وعمود الرقم الوظيفي (name/jobNumber أو employee_number).");
      }'''
          if old not in s:
              raise SystemExit('Could not find header validation block')
          s = s.replace(old, new, 1)

          old = '''const get = (key: string) => {
          const i = index(key);
          return i >= 0 ? (row[i] || "").trim() : "";
        };
        const nameValue = get("name");
        const jobValue = get("jobNumber");'''
          new = '''const get = (...keys: string[]) => {
          const i = index(...keys);
          return i >= 0 ? (row[i] == null ? "" : String(row[i])).trim() : "";
        };
        const nameValue = nameIndex >= 0 ? String(row[nameIndex] ?? "").trim() : get("name", "employee_name", "الاسم", "اسم الموظف");
        const jobValue = jobIndex >= 0 ? String(row[jobIndex] ?? "").trim() : get("jobNumber", "employee_number", "employeeNumber", "job_number", "الرقم الوظيفي", "رقم الموظف");'''
          if old not in s:
              raise SystemExit('Could not find row mapping block')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Typecheck and build
        run: |
          bun install --frozen-lockfile || bun install
          bun run typecheck
          bun run build

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/pages/ManagerEmployees.tsx
          git commit -m "fix: import employees from xlsx and employee_number files"
          git push
