name: Core stability repair

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Repair known React stability defects
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/EmployeeHome.tsx')
          text = path.read_text(encoding='utf-8')

          old = '''  const assignedLocation = useMemo(() => {\n    if (emp?.locationId) return d1Locations.find((loc) => loc.id === emp.locationId) || null;\n    return null;\n  }, [emp, d1Locations]);\n\n  const scheduleStatus = useMemo(() => getEmployeeScheduleStatus(emp, now), [emp, now]);\n  const isWorkDay = scheduleStatus.isWorkDay;\n\n  const todays = useMemo(\n    () => getAttendance().filter((r) => r.employeeId === emp.id && r.timestamp.startsWith(todayKey())),\n    [emp.id, now]\n  );'''
          new = '''  const assignedLocation = emp?.locationId\n    ? d1Locations.find((loc) => loc.id === emp.locationId) || null\n    : null;\n\n  const scheduleStatus = emp ? getEmployeeScheduleStatus(emp, now) : { isWorkDay: false, label: "جاري التحميل" };\n  const isWorkDay = scheduleStatus.isWorkDay;\n\n  const todays = emp\n    ? getAttendance().filter((r) => r.employeeId === emp.id && r.timestamp.startsWith(todayKey()))\n    : [];'''
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace(
              'setCloudError(error instanceof Error ? error.message : "تعذر تحميل بيانات الموظف من D1"); setCloudError(error instanceof Error ? error.message : "تعذر تحميل بيانات الموظف من D1");',
              'setCloudError(error instanceof Error ? error.message : "تعذر تحميل بيانات الموظف من D1");',
              1,
          )

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build frontend
        run: npm run build

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git add src/pages/EmployeeHome.tsx
          git commit -m "fix: stabilize employee dashboard render path"
          git push