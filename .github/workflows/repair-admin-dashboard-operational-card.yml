name: Tune admin operational card parity
on:
  push:
    branches: [Apps]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Adjust existing card layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/features/administration/pages/admin_mobile_dashboard_page.dart')
          s = p.read_text(encoding='utf-8')
          old = '''        child: Row(\n          children: [\n            Container(\n              width: 46,\n              height: 46,\n              decoration: BoxDecoration(\n                color: _primary.withValues(alpha: .12),\n                borderRadius: BorderRadius.circular(14),\n              ),\n              child: Icon(Icons.monitor_heart_outlined, color: _primary),\n            ),\n            const SizedBox(width: 12),\n            Expanded(\n              child: Column(\n                crossAxisAlignment: CrossAxisAlignment.start,\n                children: [\n'''
          new = '''        child: Column(\n          crossAxisAlignment: CrossAxisAlignment.stretch,\n          children: [\n            Text(\n              'الحالة التشغيلية الحالية',\n              textAlign: TextAlign.right,\n              style: TextStyle(color: _ink, fontSize: 19, fontWeight: FontWeight.w900),\n            ),\n            const SizedBox(height: 8),\n            Row(\n              mainAxisAlignment: MainAxisAlignment.end,\n              children: [\n                Expanded(\n                  child: Text(\n'''
          if old not in s:
            raise SystemExit('operational card source fragment not found')
          s = s.replace(old, new, 1)
          old2 = '''                  Text(\n                    'الحالة التشغيلية الحالية',\n                    textAlign: TextAlign.right,\n                    style: TextStyle(color: _ink, fontSize: 19, fontWeight: FontWeight.w900),\n                  ),\n                  const SizedBox(height: 8),\n                  Text(\n                    _loading\n                        ? 'جاري مزامنة حالة الدوام من D1…'\n                        : 'هذه لوحة تشغيل مباشرة لليوم الحالي. الموظف يقيم وفق جدول دوامه الفعلي؛ يوم الراحة لا يُحتسب غيابًا، والوتيرة التناوبية المعتمدة تبقى فعالة طوال فترة العمل.',\n                    textAlign: TextAlign.right,\n                    style: TextStyle(color: _muted, fontSize: 12, height: 1.65),\n                  ),\n                ],\n              ),\n            ),\n          ],\n'''
          new2 = '''                    _loading\n                        ? 'جاري مزامنة حالة الدوام من D1…'\n                        : 'هذه لوحة تشغيل مباشرة لليوم الحالي. الموظف يقيم وفق جدول دوامه الفعلي؛ يوم الراحة لا يُحتسب غيابًا، والوتيرة التناوبية المعتمدة تبقى فعالة طوال فترة العمل.',\n                    textAlign: TextAlign.right,\n                    style: TextStyle(color: _muted, fontSize: 12, height: 1.65),\n                  ),\n                ),\n                const SizedBox(width: 14),\n                Container(\n                  width: 52,\n                  height: 52,\n                  decoration: BoxDecoration(\n                    color: _primary.withValues(alpha: .12),\n                    borderRadius: BorderRadius.circular(16),\n                  ),\n                  child: Icon(Icons.monitor_heart_outlined, color: _primary, size: 28),\n                ),\n              ],\n            ),\n          ],\n'''
          if old2 not in s:
            raise SystemExit('operational card closing fragment not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/administration/pages/admin_mobile_dashboard_page.dart
          git commit -m 'fix: match operational dashboard card layout'
          git push origin Apps
