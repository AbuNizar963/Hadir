name: Repair worker entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts

      - name: Repair authentication precedence
        env:
          TARGET: backend/src/worker-entry.ts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.TARGET;
          let source = fs.readFileSync(path, 'utf8');
          const before = 'const token=(readCookie(request,SESSION_COOKIE)||request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||"").trim();';
          const after = 'const token=(request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||readCookie(request,SESSION_COOKIE)||"").trim();';
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected exactly one cookie-first token expression, found ${count}`);
          source = source.split(before).join(after);
          if (!source.includes('revoked_at IS NULL')) throw new Error('Session revocation guard is missing');
          if (!source.includes('request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||readCookie(request,SESSION_COOKIE)')) {
            throw new Error('Bearer-first authentication precedence was not applied');
          }
          fs.writeFileSync(path, source.endsWith('\n') ? source : source + '\n');
          NODE

      - name: Format source professionally
        run: npx --yes prettier@3.6.2 --parser typescript --write backend/src/worker-entry.ts

      - name: Validate source and diff
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('backend/src/worker-entry.ts', 'utf8');
          if (source.trim().length < 1000) throw new Error('worker-entry.ts appears truncated');
          if (source.split('\n').length < 30) throw new Error('worker-entry.ts is still suspiciously compressed');
          if (!source.includes('revoked_at IS NULL')) throw new Error('Session revocation guard is missing');
          const normalized = source.replace(/\s+/g, '');
          const bearer = 'request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||readCookie(request,SESSION_COOKIE)';
          if (!normalized.includes(bearer)) throw new Error('Bearer-first precedence is missing');
          const cookieFirst = 'readCookie(request,SESSION_COOKIE)||request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")';
          if (normalized.includes(cookieFirst)) throw new Error('Cookie-first precedence remains');
          for (const marker of ['export default', 'archiveClosedMonth', 'deleteReportArchive', 'getReportArchive', 'listReportArchives']) {
            if (!source.includes(marker)) throw new Error(`Required feature marker missing: ${marker}`);
          }
          NODE
          git diff --check
          npm --prefix backend run check

      - name: Commit repaired source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-worker-entry.yml
          git add backend/src/worker-entry.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(auth): normalize worker entry authentication'
          git push
