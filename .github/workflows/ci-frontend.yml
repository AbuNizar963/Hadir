name: Hadir Frontend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - "scripts/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Production build (Cloudflare Pages root)
        env:
          VITE_BASE_PATH: /
        run: bun run build
      - name: Verify PWA artifacts
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q 'start_url' dist/manifest.webmanifest
          grep -q 'scope' dist/manifest.webmanifest
