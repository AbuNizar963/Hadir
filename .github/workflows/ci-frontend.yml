name: Hadir Frontend CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        # package.json and bun.lock are currently being reconciled by the recovery
        # deployment path. Use Bun's normal install so CI can complete that
        # reconciliation instead of failing before typecheck/build.
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Production build
        env:
          VITE_BASE_PATH: /
        run: bun run build
