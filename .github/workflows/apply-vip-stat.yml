name: Apply VIP stat card

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manager employees stats
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/pages/ManagerEmployees.tsx")
          text = path.read_text(encoding="utf-8")

          old_stats = '''    devices: employees.filter((e) => !!e.deviceId).length,\n    escaped: employees.filter((e) => escapeStatusFor(e.id) === "escaped").length,'''
          new_stats = '''    devices: employees.filter((e) => !!e.deviceId).length,\n    vip: employees.filter((e) => e.status === "active" && e.isVip).length,\n    escaped: employees.filter((e) => escapeStatusFor(e.id) === "escaped").length,'''
          if old_stats not in text:
              raise SystemExit("stats marker not found")
          text = text.replace(old_stats, new_stats, 1)

          old_grid = '<div className="grid grid-cols-2 gap-3 sm:grid-cols-5">'
          new_grid = '<div className="grid grid-cols-2 gap-3 sm:grid-cols-6">'
          if old_grid not in text:
              raise SystemExit("stats grid marker not found")
          text = text.replace(old_grid, new_grid, 1)

          old_vip = '<div className="rounded-2xl border border-border/60 bg-background/30 p-4"><div className="text-xs text-muted-foreground">أجهزة موثقة</div><div className="mono live-value mt-1 text-2xl font-black">{stats.devices}</div></div><div className="rounded-2xl border border-destructive/20 bg-destructive/5 p-4"><div className="text-xs text-muted-foreground">هارب الآن</div>'
          new_vip = '<div className="rounded-2xl border border-border/60 bg-background/30 p-4"><div className="text-xs text-muted-foreground">أجهزة موثقة</div><div className="mono live-value mt-1 text-2xl font-black">{stats.devices}</div></div><div className="rounded-2xl border border-amber-400/30 bg-amber-400/5 p-4"><div className="flex items-center gap-2 text-xs text-muted-foreground"><span className="live-status-dot bg-amber-400" data-status="vip" /> <span>VIP مفعل</span></div><div className="mono live-value mt-1 text-2xl font-black text-amber-500">{stats.vip}</div></div><div className="rounded-2xl border border-destructive/20 bg-destructive/5 p-4"><div className="flex items-center gap-2 text-xs text-muted-foreground"><span className="live-status-dot bg-destructive" data-status="danger" /> <span>هارب الآن</span></div>'
          if old_vip not in text:
              raise SystemExit("stats cards marker not found")
          text = text.replace(old_vip, new_vip, 1)

          path.write_text(text, encoding="utf-8")
      - name: Verify build
        run: |
          corepack enable
          bun install --frozen-lockfile
          bun run build
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerEmployees.tsx .github/workflows/apply-vip-stat.yml
          git commit -m "feat: show active VIP employee count" || exit 0
          git push