name: Apply workforce controls API root fix
on:
  push:
    branches: [fix/workforce-controls-api]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend and employee controls
        shell: python
        run: |
          from pathlib import Path
          import re

          backend = Path('backend/src/workforce.ts')
          text = backend.read_text()
          anchor = ' if(pathname==="/api/notifications"&&method==="GET")'
          if 'WORKFORCE_OWNER_CONTROLS_PATCH_V1' not in text:
              patch = r'''\n /* WORKFORCE_OWNER_CONTROLS_PATCH_V1 */\n if(pathname==="/api/workforce/live"&&method==="PATCH"&&actor?.role==="owner"){\n  const b=await req.json().catch(()=>({})) as any;\n  const employeeId=String(b.employeeId||"").trim();\n  if(!employeeId)return J({error:"رقم الموظف مطلوب"},400);\n  const employee=await env.DB.prepare("SELECT id,status FROM employees WHERE id=? LIMIT 1").bind(employeeId).first<any>();\n  if(!employee)return J({error:"الموظف غير موجود"},404);\n  const sets:string[]=[];const values:any[]=[];\n  for(const key of ["isVip","autoCheckIn","autoCheckOut"] as const){if(typeof b[key]==="boolean"){sets.push(key==="isVip"?"is_vip=?":key==="autoCheckIn"?"auto_check_in=?":"auto_check_out=?");values.push(b[key]?1:0);}}\n  if(!sets.length)return J({error:"لا توجد تغييرات"},400);\n  values.push(employeeId);\n  await env.DB.prepare(`UPDATE employees SET ${sets.join(",")} WHERE id=?`).bind(...values).run();\n  const updated=await env.DB.prepare("SELECT id,job_number AS jobNumber,name,status,is_vip AS isVip,auto_check_in AS autoCheckIn,auto_check_out AS autoCheckOut FROM employees WHERE id=? LIMIT 1").bind(employeeId).first<any>();\n  await env.DB.prepare("INSERT INTO audit(id,employee_id,job_number,actor_name,action,result,reason,timestamp,device_id,ip) VALUES(?,?,?,?,?,?,?,?,?,?)").bind(id(),employeeId,updated?.jobNumber||"",actor.name||"المالك","workforce-controls","success","تحديث إعدادات Workforce من بطاقة الموظف",now(),"OWNER_PANEL","unknown").run().catch(()=>undefined);\n  return J({ok:true,employee:updated});\n }\n if(pathname==="/api/workforce/live"&&method==="POST"&&actor?.role==="owner"){\n  const b=await req.json().catch(()=>({})) as any;\n  const employeeId=String(b.employeeId||"").trim();const type=String(b.type||"");\n  if(!employeeId||!["check-in","check-out"].includes(type))return J({error:"بيانات الإجراء غير صحيحة"},400);\n  const employee=await env.DB.prepare("SELECT id,job_number AS jobNumber,name,status,location_id AS locationId FROM employees WHERE id=? LIMIT 1").bind(employeeId).first<any>();\n  if(!employee||employee.status!=="active")return J({error:"الموظف غير موجود أو موقوف"},404);\n  const last=await env.DB.prepare("SELECT type FROM attendance WHERE employee_id=? ORDER BY timestamp DESC LIMIT 1").bind(employeeId).first<any>();\n  if(type==="check-in"&&last?.type==="check-in")return J({error:"الموظف مسجل حضور بالفعل"},409);\n  if(type==="check-out"&&last?.type!=="check-in")return J({error:"لا يوجد حضور مفتوح للموظف"},409);\n  const location=(await env.DB.prepare("SELECT id,lat,lng FROM locations WHERE id=? LIMIT 1").bind(employee.locationId||"main").first<any>()) || (await env.DB.prepare("SELECT id,lat,lng FROM locations ORDER BY name LIMIT 1").first<any>());\n  if(!location)return J({error:"لا يوجد موقع عمل محفوظ"},409);\n  const recordId=id();const timestamp=now();const deviceId=`admin-direct:${actor.id}`;\n  await env.DB.prepare("INSERT INTO attendance(id,employee_id,job_number,employee_name,type,timestamp,lat,lng,distance_meters,device_id,ip,qr_code,location_id) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)").bind(recordId,employee.id,employee.jobNumber,employee.name,type,timestamp,Number(location.lat),Number(location.lng),0,deviceId,"unknown","ADMIN_DIRECT",location.id).run();\n  await env.DB.prepare("INSERT INTO audit(id,employee_id,job_number,actor_name,action,result,reason,timestamp,device_id,ip,lat,lng,distance_meters) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?)").bind(id(),employee.id,employee.jobNumber,actor.name||"المالك",type,"success",type==="check-in"?"تحضير مباشر من بطاقة الموظف":"انصراف مباشر من بطاقة الموظف",timestamp,deviceId,"unknown",Number(location.lat),Number(location.lng),0).run().catch(()=>undefined);\n  return J({ok:true,record:{id:recordId,employeeId:employee.id,jobNumber:employee.jobNumber,employeeName:employee.name,type,timestamp,lat:Number(location.lat),lng:Number(location.lng),distanceMeters:0,deviceId,qrCode:"ADMIN_DIRECT",locationId:location.id}},201);\n }\n'''
              if anchor not in text:
                  raise SystemExit('missing workforce route anchor')
              text = text.replace(anchor, patch + anchor, 1)
              backend.write_text(text)

          page = Path('src/pages/ManagerEmployees.tsx')
          text = page.read_text()
          old = '`' + '${api}/api/manager/workforce-controls/${encodeURIComponent(e.id)}' + '`'
          if old not in text:
              raise SystemExit('missing employee workforce endpoint')
          text = text.replace(old, '`' + '${api}/api/workforce/live' + '`', 1)
          text = text.replace('body: JSON.stringify(patch),', 'body: JSON.stringify({ employeeId: e.id, ...patch }),', 1)
          old_checkout = '`' + '${api}/api/manager/attendance/checkout' + '`'
          if old_checkout not in text:
              raise SystemExit('missing employee checkout endpoint')
          text = text.replace(old_checkout, '`' + '${api}/api/workforce/live' + '`', 1)
          text = text.replace('body: JSON.stringify({ employeeId: e.id }),', 'body: JSON.stringify({ employeeId: e.id, type: "check-out" }),', 1)
          page.write_text(text)

          controls = Path('src/pages/ManagerWorkforceControls.tsx')
          text = controls.read_text()
          text = text.replace('`/api/manager/workforce-controls/${encodeURIComponent(id)}`', '"/api/workforce/live"', 1)
          text = text.replace('body:JSON.stringify(body)', 'body:JSON.stringify({employeeId:id,...body})', 1)
          text = text.replace('type==="check-in"?"/api/manager/attendance/check-in":"/api/manager/attendance/checkout"', '"/api/workforce/live"', 1)
          text = text.replace('body:JSON.stringify({employeeId:id})', 'body:JSON.stringify({employeeId:id,type})', 1)
          controls.write_text(text)

          import subprocess
          subprocess.run(['git','diff','--check'],check=True)
          if 'WORKFORCE_OWNER_CONTROLS_PATCH_V1' not in backend.read_text(): raise SystemExit('backend patch missing')
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add backend/src/workforce.ts src/pages/ManagerEmployees.tsx src/pages/ManagerWorkforceControls.tsx .github/workflows/fix-workforce-controls-once.yml
          git rm .github/workflows/fix-workforce-controls-once.yml
          git commit -m "fix(workforce): wire owner controls through live API"
          git push origin HEAD
