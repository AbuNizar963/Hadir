name: Repair reports build syntax

on:
  push:
    branches:
      - fix/reports-daily-attendance-export

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/reports-daily-attendance-export
          fetch-depth: 0
      - name: Repair malformed export declaration
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/pages/ManagerReports.tsx")
          s = p.read_text(encoding="utf-8")
          old = '],d:summaries.flatMap(s=>calculateDetails(s.employee,dates,index,settings).map(day=>[s.employee.name,s.employee.jobNumber,day.date,day.day,labels[day.status],day.checkIn,day.checkOut,formatDurationMinutes(day.worked),day.late,day.early,day.detail] as CsvCell[]));'
          new = '],d=summaries.flatMap(s=>calculateDetails(s.employee,dates,index,settings).map(day=>[s.employee.name,s.employee.jobNumber,day.date,day.day,labels[day.status],day.checkIn,day.checkOut,formatDurationMinutes(day.worked),day.late,day.early,day.detail] as CsvCell[]));'
          if old not in s:
              raise SystemExit("Expected malformed export declaration was not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Verify source
        run: |
          grep -n 'const exportCsv' src/pages/ManagerReports.tsx
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerReports.tsx
          git commit -m "fix(reports): correct export CSV declaration"
          git push origin HEAD:fix/reports-daily-attendance-export
      - name: Remove temporary workflow
        if: always()
        run: |
          git fetch origin fix/reports-daily-attendance-export
          git checkout -B cleanup origin/fix/reports-daily-attendance-export
          git rm -f .github/workflows/fix-reports-build.yml || true
          git commit -m "chore: remove temporary reports build repair workflow" || true
          git push origin cleanup:fix/reports-daily-attendance-export || true
