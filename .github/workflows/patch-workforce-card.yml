name: Patch workforce card
on:
  push:
    branches: [feat/workforce-card-integration]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply workforce card integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/ManagerEmployees.tsx')
          s=p.read_text()
          def once(old,new,label):
              global s
              if old not in s: raise SystemExit(f'missing patch anchor: {label}')
              s=s.replace(old,new,1)
          once('  onDirect,\n  onEscape,','  onDirect,\n  onCheckout,\n  onWorkforceUpdate,\n  isOwner,\n  onEscape,','card props')
          once('  onDirect: (e: Employee) => void;\n  onEscape:','  onDirect: (e: Employee) => void;\n  onCheckout: (e: Employee) => void;\n  onWorkforceUpdate: (e: Employee, patch: { isVip?: boolean; autoCheckIn?: boolean; autoCheckOut?: boolean }) => void;\n  isOwner: boolean;\n  onEscape:','card prop types')
          once('            {e.status === "active" ? "فعال" : "موقوف"}\n          </span>','            {e.status === "active" ? "فعال" : "موقوف"}\n          </span>\n\n          {e.isVip && (\n            <span className="rounded-full border border-amber-400/40 bg-amber-400/10 px-2 py-1 text-[10px] font-black text-amber-500">★ VIP</span>\n          )}','vip badge')
          once('      <div className="mt-2 flex items-center justify-between gap-2 text-[10px] text-muted-foreground">\n        <span>السماح: {e.gracePeriodMinutes ?? 0} دقيقة</span>\n\n        {e.deviceId ? (\n          <span className="text-primary">● جهاز موثق</span>\n        ) : (\n          <span>غير مرتبط</span>\n        )}\n      </div>','      <div className="mt-2 flex items-center justify-between gap-2 text-[10px] text-muted-foreground">\n        <span>السماح: {e.gracePeriodMinutes ?? 0} دقيقة</span>\n        <span>{e.deviceId ? "الهاتف مرتبط" : "الهاتف غير مرتبط"}</span>\n      </div>\n\n      <div className="mt-3 grid gap-1.5 rounded-xl border border-border/60 bg-background/20 p-2.5 text-[11px]">\n        <div className="flex items-center justify-between gap-2"><span className="font-bold">VIP</span><input type="checkbox" checked={!!e.isVip} disabled={!isOwner} onChange={(x) => onWorkforceUpdate(e, { isVip: x.target.checked })} /></div>\n        <div className="flex items-center justify-between gap-2"><span>التحضير التلقائي</span><input type="checkbox" checked={!!e.autoCheckIn} disabled={!isOwner} onChange={(x) => onWorkforceUpdate(e, { autoCheckIn: x.target.checked })} /></div>\n        <div className="flex items-center justify-between gap-2"><span>الانصراف التلقائي</span><input type="checkbox" checked={!!e.autoCheckOut} disabled={!isOwner} onChange={(x) => onWorkforceUpdate(e, { autoCheckOut: x.target.checked })} /></div>\n      </div>','workforce controls')
          once('            تحضير مباشر\n          </button>\n        )}','            تحضير مباشر\n          </button>\n        )}\n\n        {isOwner && e.status === "active" && (\n          <button type="button" className="btn-secondary text-[11px]" onClick={() => onCheckout(e)}>انصراف مباشر</button>\n        )}','checkout button')
          once('    a.e.deviceId === b.e.deviceId &&\n    a.e.gracePeriodMinutes','    a.e.deviceId === b.e.deviceId &&\n    a.e.isVip === b.e.isVip &&\n    a.e.autoCheckIn === b.e.autoCheckIn &&\n    a.e.autoCheckOut === b.e.autoCheckOut &&\n    a.e.gracePeriodMinutes','memo workforce fields')
          once('  const canManage = role === "owner" || role === "manager";\n  const canAdd','  const canManage = role === "owner" || role === "manager";\n  const isOwner = role === "owner";\n  const canAdd','owner flag')
          once('  const direct = async (e: Employee) => {','  const directCheckout = async (e: Employee) => {\n    if (e.status !== "active" || !isOwner) return;\n    if (!confirm(`تسجيل انصراف مباشر للموظف «${e.name}»؟`)) return;\n    try {\n      const token = localStorage.getItem("hadir.api.token.admin") || "";\n      const api = String(import.meta.env.VITE_API_URL || "https://hadir-api.abunizar963.workers.dev").replace(/\\/$/, "");\n      const res = await fetch(`${api}/api/manager/attendance/checkout`, { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${token}` }, body: JSON.stringify({ employeeId: e.id }), cache: "no-store" });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok) throw new Error(typeof data.error === "string" ? data.error : "تعذر تسجيل الانصراف المباشر.");\n      await load(false);\n    } catch (err) { setError(err instanceof Error ? err.message : "تعذر تسجيل الانصراف المباشر."); }\n  };\n\n  const updateWorkforce = async (e: Employee, patch: { isVip?: boolean; autoCheckIn?: boolean; autoCheckOut?: boolean }) => {\n    if (!isOwner) return;\n    try {\n      const token = localStorage.getItem("hadir.api.token.admin") || "";\n      const api = String(import.meta.env.VITE_API_URL || "https://hadir-api.abunizar963.workers.dev").replace(/\\/$/, "");\n      const res = await fetch(`${api}/api/manager/workforce-controls/${encodeURIComponent(e.id)}`, { method: "PATCH", headers: { "content-type": "application/json", authorization: `Bearer ${token}` }, body: JSON.stringify(patch), cache: "no-store" });\n      const data = await res.json().catch(() => ({}));\n      if (!res.ok) throw new Error(typeof data.error === "string" ? data.error : "تعذر حفظ إعدادات Workforce.");\n      setEmployees((prev) => prev.map((x) => x.id === e.id ? { ...x, ...patch } : x));\n    } catch (err) { setError(err instanceof Error ? err.message : "تعذر حفظ إعدادات Workforce."); await load(false); }\n  };\n\n  const direct = async (e: Employee) => {','handlers')
          once('                  canManage={canManage}\n                  escapeStatus=','                  canManage={canManage}\n                  isOwner={isOwner}\n                  onCheckout={directCheckout}\n                  onWorkforceUpdate={updateWorkforce}\n                  escapeStatus=','card props use')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/ManagerEmployees.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(workforce): integrate controls into employee cards"
          git push
