name: Hotfix employee profile route

on:
  push:
    branches: [main]
    paths:
      - 'backend/src/index.ts'
      - '.github/workflows/hotfix-employee-profile-route.yml'
  workflow_dispatch:

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ensure employee profile aliases exist
        shell: python
        run: |
          from pathlib import Path
          p = Path('backend/src/index.ts')
          s = p.read_text(encoding='utf-8')
          old = 'if(path==="/api/employee/profile"&&req.method==="GET"){'
          new = 'if((path==="/api/employee/profile"||path==="/api/employee/me")&&req.method==="GET"){'
          if new in s:
              print('Employee profile aliases already present.')
          elif old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Added /api/employee/me compatibility alias.')
          else:
              raise SystemExit('Employee profile route was not found; refusing an unsafe patch.')

      - name: Install Wrangler
        working-directory: backend
        run: npm install --no-save --no-package-lock wrangler@4.123.0

      - name: Validate Worker bundle
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run

      - name: Commit route fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/index.ts
          if git diff --cached --quiet; then
            echo 'No backend route change required.'
            exit 0
          fi
          git commit -m "fix: expose employee profile route aliases"
          git push

      - name: Confirm deploy workflow is triggered by backend change
        run: echo 'Backend changes are handled by Deploy Hadir API workflow.'
