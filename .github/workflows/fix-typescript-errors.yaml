name: TypeScript and Build Check

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without lockfile
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build
