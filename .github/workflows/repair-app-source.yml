name: Repair app source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts

      - name: Format app source professionally
        run: npx --yes prettier@3.6.2 --parser typescript --write backend/src/app.ts

      - name: Validate source, features, auth and diff
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('backend/src/app.ts', 'utf8');
          const normalized = source.replace(/\s+/g, '');
          const nonEmptyLines = source.split(/\r?\n/).filter((line) => line.trim().length > 0).length;

          if (source.length < 15000) throw new Error('app.ts appears unexpectedly shortened');
          if (nonEmptyLines < 150) throw new Error('app.ts is still suspiciously compressed');
          if (!normalized.includes('constSESSION_COOKIE="hadir_session"')) throw new Error('Session cookie definition missing');
          if (!normalized.includes('functionwithSessionCookie(')) throw new Error('Session cookie response handling missing');
          if (!normalized.includes('asyncfunctionactorFromOriginal(')) throw new Error('Original actor resolution missing');
          if (!normalized.includes('handleEmployeeAttendance(')) throw new Error('Attendance gateway feature missing');
          if (!normalized.includes('employee_checkout_policies')) throw new Error('Checkout policy feature missing');
          if (!normalized.includes('/api/audit')) throw new Error('Audit API feature missing');
          if (!normalized.includes('/api/settings')) throw new Error('Settings API feature missing');
          if (!normalized.includes('/api/locations')) throw new Error('Locations API feature missing');
          if (!normalized.includes('/api/notifications')) throw new Error('Notifications API feature missing');
          if (!normalized.includes('returnoriginal.fetch(req,env,ctx)')) throw new Error('Original app delegation missing');
          if (!normalized.includes('revoked_at')) throw new Error('Session revocation handling marker missing');
          NODE
          git diff --check
          npm --prefix backend run check
          git diff --check

      - name: Commit repaired source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-app-source.yml
          git add backend/src/app.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'style(backend): format app entry professionally'
          git push
