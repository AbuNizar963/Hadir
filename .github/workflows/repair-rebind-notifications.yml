name: Repair rebind notifications

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair backend notification recipients and message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("backend/src/workforce.ts")
          s = p.read_text(encoding="utf-8")
          replacements = {
              "role IN ('owner','manager')": "role IN ('owner','manager','supervisor')",
              "تم إرسال طلب إعادة ربط الهاتف إلى الإدارة": "تم إرسال طلب إعادة ربط الهاتف، راجع الإدارة أو تواصل مع الإداريين",
          }
          original = s
          for old, new in replacements.items():
              s = s.replace(old, new)
          if s == original:
              raise SystemExit("No expected legacy strings found; refusing to modify backend")
          p.write_text(s, encoding="utf-8")
          PY

          rm -f .github/workflows/repair-rebind-notifications.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/workforce.ts .github/workflows/repair-rebind-notifications.yml
          git commit -m "fix: deliver phone rebind notifications to all admins"
          git push
