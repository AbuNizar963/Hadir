name: Cleanup attendance compatibility wrapper
on:
  push:
    branches: [refactor/attendance-app-engine]
    paths:
      - '.github/workflows/cleanup-attendance-wrapper.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete wrapper only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/src/app.ts')
          text = p.read_text()
          old = 'async function handleAttendance(req: Request, env: Env, actor: any, origin: string) { const response = await handleEmployeeAttendance(req, env, actor, origin); return response || json({error:"الموظف فقط يستطيع تسجيل الحضور"},403,origin); }\n'
          assert text.count(old) == 1, 'obsolete wrapper not found exactly once'
          text = text.replace(old, '', 1)
          assert 'async function handleAttendance(' not in text, 'obsolete wrapper still present'
          assert 'if(path==="/api/attendance")return handleEmployeeAttendance(req,env,actor,origin);' in text, 'production route is not using engine gateway'
          assert 'function coordinate(value: unknown)' in text, 'location helper was lost'
          assert 'async function earlyCheckoutMinutes(db: D1Database' in text, 'checkout policy helper was lost'
          p.write_text(text)
          PY
      - name: Verify and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'async function handleAttendance(' backend/src/app.ts || true)" = "0"
          grep -q 'if(path==="/api/attendance")return handleEmployeeAttendance(req,env,actor,origin);' backend/src/app.ts
          grep -q 'function coordinate(value: unknown)' backend/src/app.ts
          grep -q 'async function earlyCheckoutMinutes(db: D1Database' backend/src/app.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-attendance-wrapper.yml
          git add backend/src/app.ts
          git commit -m 'chore(attendance): remove obsolete app wrapper'
          git push
