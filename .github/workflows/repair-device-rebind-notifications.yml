name: Repair device rebind notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows: ["Deploy Hadir API", "Install production Web Push"]
    types: [completed]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || !contains(github.event.workflow_run.head_commit.message, '[device-rebind-notification-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure device rebind requests reach workforce API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          entry = Path('backend/src/entry.ts')
          text = entry.read_text()

          old = 'if(url.pathname==="/api/notifications"||url.pathname==="/api/notifications/read"||url.pathname==="/api/violations"||url.pathname.startsWith("/api/violations/")||url.pathname==="/api/workforce/live")'
          new = 'if(url.pathname==="/api/notifications"||url.pathname==="/api/notifications/read"||url.pathname==="/api/violations"||url.pathname.startsWith("/api/violations/")||url.pathname==="/api/workforce/live"||url.pathname==="/api/device-rebind-requests")'

          if new not in text:
              if old not in text:
                  raise SystemExit('entry.ts workforce routing target not found')
              text = text.replace(old, new, 1)
              entry.write_text(text)
          else:
              print('device rebind routing already present')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/entry.ts .github/workflows/repair-device-rebind-notifications.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: route device rebind requests to workforce handler [device-rebind-notification-fix]"
          git push origin HEAD:main
