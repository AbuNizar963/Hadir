name: Apply mobile settings logo patch once

on:
  push:
    branches: [Apps]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/patch-mobile-settings-logo.mjs
      - name: Commit and push source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/administration/pages/admin_mobile_settings_reference_page.dart
          git commit -m "feat(settings): add company logo management to mobile settings"
          git fetch origin Apps
          git rebase origin/Apps
          git push origin Apps
