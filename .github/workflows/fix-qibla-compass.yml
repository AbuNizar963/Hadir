name: Fix Qibla Compass Orientation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch qibla needle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/PrayerPage.tsx')
          s = p.read_text()
          old = 'style={{ transform: `translateY(-50%) rotate(${qiblaRelative}deg)`, transition: "transform 160ms cubic-bezier(.22,.61,.36,1)" }}'
          new = 'style={{ transform: `translateY(-50%) rotate(${bearing == null ? 0 : bearing}deg)`, transition: "transform 160ms cubic-bezier(.22,.61,.36,1)" }}'
          if old not in s:
              raise SystemExit('needle pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PrayerPage.tsx
          git commit -m 'fix: point qibla needle at true bearing' || exit 0
          git push
