name: Fix Qibla Compass Orientation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate qibla compass implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('src/features/shared/pages/PrayerPage.tsx'),
              Path('src/pages/PrayerPage.tsx'),
          ]
          p = next((path for path in candidates if path.exists()), None)
          if p is None:
              raise SystemExit('Qibla implementation validation failed: PrayerPage.tsx not found')

          s = p.read_text(encoding='utf-8')
          required = [
              'const needleRotation = bearing == null ? 0 : shortestDelta(bearing, heading);',
              'getQiblaBearingFromProvider',
          ]
          missing = [item for item in required if item not in s]

          needle_index = s.find('const needleRotation')
          if needle_index < 0:
              missing.append('needleRotation declaration')
          else:
              # The implementation may express the visual rotation through a
              # React style transform rather than a literal CSS rotate() call.
              # Validate that the calculated relative bearing is actually
              # consumed by the compass markup after its declaration.
              usage = s[needle_index + len('const needleRotation'):]
              if 'needleRotation' not in usage:
                  missing.append('needleRotation usage')
              if 'transform' not in usage and 'rotate' not in usage:
                  missing.append('needleRotation visual transform')

          if missing:
              raise SystemExit('Qibla implementation validation failed: ' + ', '.join(missing))

          print(f'Qibla compass implementation is present at {p} and uses bearing relative to device heading.')
          PY
