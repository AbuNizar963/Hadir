name: Apply professional report export

on:
  push:
    branches: [feat/professional-report-export]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Integrate professional exporter
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/pages/ManagerReports.tsx")
          text = path.read_text(encoding="utf-8")

          import_line = 'import { downloadProfessionalAttendanceReport } from "@/lib/professionalReportExport";\n'
          if import_line not in text:
              marker = 'import type { Employee } from "@/types";\n'
              if marker not in text:
                  raise SystemExit("ManagerReports import marker not found")
              text = text.replace(marker, marker + import_line, 1)

          replacement = ''' const exportExcel=()=>{\n  const dailyRows=summaries.flatMap(s=>calculateDetails(s.employee,dates,index,settings).map(day=>({employee:s.employee.name,jobNumber:s.employee.jobNumber,date:day.date,day:day.day,status:labels[day.status],checkIn:day.checkIn,checkOut:day.checkOut,worked:formatDurationMinutes(day.worked),late:day.late,early:day.early,detail:day.detail})));\n  const absenceRows=dailyRows.filter(row=>row.status==="غياب");\n  downloadProfessionalAttendanceReport({mode,period,generatedAt:new Date().toLocaleString("ar-EG"),summaries,dailyRows,absenceRows,chartData});\n };\n'''
          pattern = r' const exportExcel=\=>\{.*?\n const title='
          if not re.search(pattern, text, flags=re.S):
              pattern = r' const exportExcel=\(\)=>\{.*?\n const title='
          text2, count = re.subn(pattern, replacement + ' const title=', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("exportExcel block not found")
          path.write_text(text2, encoding="utf-8")

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManagerReports.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(reports): use professional attendance workbook export"
          git push
