name: Repair Qibla Compass and Semantic Icons
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compass and semantic icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/PrayerPage.tsx')
          s=p.read_text()
          old='''if(ctor.requestPermission){const result=await ctor.requestPermission();if(result!=="granted")'''
          new='''if(ctor.requestPermission){const result=await ctor.requestPermission(true);if(result!=="granted")'''
          s=s.replace(old,new)
          old='''if(typeof e.webkitCompassHeading==="number"&&Number.isFinite(e.webkitCompassHeading)){next=e.webkitCompassHeading;}else{const isAbsolute=(event as DeviceOrientationEvent&{absolute?:boolean}).absolute===true;if(isAbsolute){absoluteSeenRef.current=true;absoluteSeenAtRef.current=Date.now();}else if(absoluteSeenRef.current&&Date.now()-absoluteSeenAtRef.current<1500){return;}if(typeof event.alpha==="number"&&Number.isFinite(event.alpha)){next=norm(360-event.alpha);}}'''
          new='''if(typeof e.webkitCompassHeading==="number"&&Number.isFinite(e.webkitCompassHeading)&&e.webkitCompassHeading>=0){next=e.webkitCompassHeading;}else{const absolute=(event as DeviceOrientationEvent&{absolute?:boolean}).absolute===true;if(absolute){absoluteSeenRef.current=true;absoluteSeenAtRef.current=Date.now();}else if(absoluteSeenRef.current&&Date.now()-absoluteSeenAtRef.current<2000){return;}if(typeof event.alpha==="number"&&Number.isFinite(event.alpha)){const screenAngle=typeof screen!=="undefined"&&screen.orientation?screen.orientation.angle:0;next=norm(360-event.alpha+screenAngle);}}'''
          s=s.replace(old,new)
          s=s.replace('''const maxStep=.75;const step=Math.max(-maxStep,Math.min(maxStep,d*.055));''','''const maxStep=1.25;const step=Math.max(-maxStep,Math.min(maxStep,d*.075));''')
          # Replace emoji-only prayer icon definitions with semantic Lucide icon names; the render is patched below.
          s=s.replace('import { ArrowRight, MapPin, RefreshCw, Share2 } from "lucide-react";','import { ArrowRight, MapPin, RefreshCw, Share2, Moon, Sunrise, Sun, CloudSun, Sunset, MoonStar } from "lucide-react";')
          s=s.replace('type PrayerKey="fajr"|"sunrise"|"dhuhr"|"asr"|"maghrib"|"isha";const PRAYERS:{key:PrayerKey;name:string;icon:string}[]=[{key:"fajr",name:"الفجر",icon:"🌙"},{key:"sunrise",name:"الشروق",icon:"🌅"},{key:"dhuhr",name:"الظهر",icon:"☀️"},{key:"asr",name:"العصر",icon:"🌤️"},{key:"maghrib",name:"المغرب",icon:"🌇"},{key:"isha",name:"العشاء",icon:"🌙"}];','type PrayerKey="fajr"|"sunrise"|"dhuhr"|"asr"|"maghrib"|"isha";const PRAYERS:{key:PrayerKey;name:string;icon:React.ComponentType<{className?:string}>}[]=[{key:"fajr",name:"الفجر",icon:MoonStar},{key:"sunrise",name:"الشروق",icon:Sunrise},{key:"dhuhr",name:"الظهر",icon:Sun},{key:"asr",name:"العصر",icon:CloudSun},{key:"maghrib",name:"المغرب",icon:Sunset},{key:"isha",name:"العشاء",icon:Moon}];')
          # Any direct p.icon interpolation becomes a real SVG icon with matching meaning.
          s=s.replace('{p.icon}', '<p.icon className="h-5 w-5" />')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PrayerPage.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: make qibla compass responsive and use semantic prayer icons"
          git push