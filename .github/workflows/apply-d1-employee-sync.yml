name: Apply direct D1 employee sync patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[d1-sync-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply safe employee D1 view patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/pages/EmployeeHome.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'value={emp?.scheduleType === "ROTATION" ? "24 ساعة" : (emp?.workStartTime || settings.workStart || "08:00")}': 'value={emp?.workStartTime || settings.workStart || "08:00"}',
            'value={emp?.scheduleType === "ROTATION" ? "24 ساعة" : (emp?.workEndTime || settings.workEnd || "16:00")}': 'value={emp?.workEndTime || settings.workEnd || "16:00"}',
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          git diff --check
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; else npm install --ignore-scripts; fi
          npx tsc --noEmit --pretty false
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/EmployeeHome.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve D1 employee rotation hours [d1-sync-bot]'
          git push
