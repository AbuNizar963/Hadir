name: one-time employee UI patch

on:
  push:
    branches: [Apps]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'AbuNizar963'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Apps
          fetch-depth: 0
      - name: Apply exact UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/employee/pages/hadir_workspace_page_implementation.dart')
          text = path.read_text(encoding='utf-8')
          import_line = "import 'package:lucide_icons_flutter/lucide_icons.dart';\n"
          if import_line not in text:
              anchor = "import 'package:intl/intl.dart' as intl;\n"
              if anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          old = '''  Widget _workInfo(BuildContext context) {
    final schedule = _schedule();
    final today = _todayAttendance();
    final approved = _todayApprovedRequests();
    final status = _status(schedule, _openSession(today), today.any((r) => _type(r) == 'check-in'), _activeEscape(), approved.any((r) => _requestType(r) == 'leave'), approved.any((r) => _requestType(r) == 'permission'));
    final type = '${_employee['scheduleType'] ?? 'ADMIN'}'.toUpperCase();
    return _section(context, 'معلومات الدوام', 'حالتك الحالية', Column(children: [
      _info(context, Icons.calendar_today_outlined, 'الفترة', _periodLabel(schedule)),
      _info(context, Icons.schedule_rounded, type == 'ROTATION' ? 'وقت المناوبة' : 'الفترة', _scheduleLabel(schedule) == 'مناوبة تناوبية' ? _rotationDurationLabel() : _periodLabel(schedule)),
      _info(context, Icons.verified_outlined, 'الحالة', status),
      _info(context, Icons.location_on_outlined, 'الموقع', _locationName()),
      _info(context, Icons.devices_other_rounded, 'الجهاز', _deviceLabel()),
    ]));
  }
'''
          new = '''  Widget _workInfo(BuildContext context) {
    final scheme = Theme.of(context).colorScheme;
    final schedule = _schedule();
    final today = _todayAttendance();
    final approved = _todayApprovedRequests();
    final status = _status(
      schedule,
      _openSession(today),
      today.any((r) => _type(r) == 'check-in'),
      _activeEscape(),
      approved.any((r) => _requestType(r) == 'leave'),
      approved.any((r) => _requestType(r) == 'permission'),
    );
    final type = '${_employee['scheduleType'] ?? 'ADMIN'}'.toUpperCase();
    final isRotation = type == 'ROTATION';
    final location = _locationName();
    final device = _deviceLabel();
    final period = _periodLabel(schedule);
    final scheduleLabel = _scheduleLabel(schedule);
    final statusColor = status == 'حاضر'
        ? scheme.primary
        : status == 'متأخر'
            ? scheme.secondary
            : status == 'هارب' || status == 'غائب'
                ? scheme.error
                : scheme.onSurfaceVariant;

    return _card(
      context,
      padding: const EdgeInsets.all(16),
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Row(
            children: [
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text('معلومات الدوام', style: TextStyle(color: scheme.onSurface, fontSize: 15, fontWeight: FontWeight.w900)),
                    const SizedBox(height: 3),
                    Text('الفترة الحالية والتجهيزات المرتبطة بها', style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 9.5)),
                  ],
                ),
              ),
              Container(
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                decoration: BoxDecoration(color: statusColor.withValues(alpha: .10), borderRadius: BorderRadius.circular(99), border: Border.all(color: statusColor.withValues(alpha: .22))),
                child: Row(mainAxisSize: MainAxisSize.min, children: [Icon(LucideIcons.badgeCheck, size: 14, color: statusColor), const SizedBox(width: 5), Text(status, style: TextStyle(color: statusColor, fontSize: 10, fontWeight: FontWeight.w900))),
              ),
            ],
          ),
          const SizedBox(height: 14),
          Row(children: [
            Expanded(child: _workInfoMetric(context, LucideIcons.calendarDays, isRotation ? 'المناوبة' : 'الدوام', scheduleLabel)),
            const SizedBox(width: 9),
            Expanded(child: _workInfoMetric(context, LucideIcons.clock3, isRotation ? 'مدة المناوبة' : 'الفترة', isRotation ? _rotationDurationLabel() : period)),
          ]),
          const SizedBox(height: 10),
          Row(children: [
            Expanded(child: _workInfoChip(context, LucideIcons.mapPin, 'الموقع', location)),
            const SizedBox(width: 9),
            Expanded(child: _workInfoChip(context, LucideIcons.smartphone, 'الجهاز', device)),
          ]),
        ],
      ),
    );
  }

  Widget _workInfoMetric(BuildContext context, IconData icon, String label, String value) {
    final scheme = Theme.of(context).colorScheme;
    return Container(
      constraints: const BoxConstraints(minHeight: 76),
      padding: const EdgeInsets.all(11),
      decoration: BoxDecoration(color: scheme.secondaryContainer.withValues(alpha: .34), borderRadius: BorderRadius.circular(14), border: Border.all(color: scheme.outlineVariant.withValues(alpha: .62))),
      child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
        Row(children: [Icon(icon, size: 15, color: scheme.primary), const SizedBox(width: 6), Expanded(child: Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 9, fontWeight: FontWeight.w700)))]),
        const SizedBox(height: 7),
        Text(value, maxLines: 2, overflow: TextOverflow.ellipsis, style: TextStyle(color: scheme.onSurface, fontSize: 11, fontWeight: FontWeight.w900, height: 1.25)),
      ]),
    );
  }

  Widget _workInfoChip(BuildContext context, IconData icon, String label, String value) {
    final scheme = Theme.of(context).colorScheme;
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 10),
      decoration: BoxDecoration(color: scheme.surface, borderRadius: BorderRadius.circular(13), border: Border.all(color: scheme.primary.withValues(alpha: .16))),
      child: Row(children: [
        Container(width: 30, height: 30, decoration: BoxDecoration(color: scheme.primary.withValues(alpha: .09), borderRadius: BorderRadius.circular(9)), child: Icon(icon, size: 15, color: scheme.primary)),
        const SizedBox(width: 8),
        Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text(label, style: TextStyle(color: scheme.onSurfaceVariant, fontSize: 8.5)), const SizedBox(height: 2), Text(value, maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: scheme.onSurface, fontSize: 9.5, fontWeight: FontWeight.w800))])),
      ]),
    );
  }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'exact work info block count was {count}, expected 1')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- lib/features/employee/pages/hadir_workspace_page_implementation.dart
      - name: Commit source patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/employee/pages/hadir_workspace_page_implementation.dart .github/workflows/employee_ui_patch_once.yml
          git commit -m "style(employee): refine work information card" || exit 1
          git push origin HEAD:Apps
