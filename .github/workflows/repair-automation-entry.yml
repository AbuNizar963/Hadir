name: Repair automation entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts

      - name: Repair automation entry
        env:
          TARGET: backend/src/automation-entry.ts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = process.env.TARGET;
          let source = fs.readFileSync(path, 'utf8');

          const before = 'const token=(readCookie(request,SESSION_COOKIE)||request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||"").trim();';
          const after = 'const token=(request.headers.get("authorization")?.replace(/^Bearer\\s+/i,"")||readCookie(request,SESSION_COOKIE)||"").trim();';
          const count = source.split(before).length - 1;

          if (count !== 2) {
            throw new Error(`Expected exactly 2 legacy token expressions, found ${count}`);
          }

          source = source.split(before).join(after);

          if (!source.includes('revoked_at IS NULL')) {
            throw new Error('Session revocation guard is missing from automation-entry.ts');
          }
          if (!source.includes(after)) {
            throw new Error('Bearer-first token precedence was not applied');
          }

          fs.writeFileSync(path, source.endsWith('\n') ? source : source + '\n');
          NODE

      - name: Format source professionally
        run: npx --yes prettier@3.6.2 --parser typescript --write backend/src/automation-entry.ts

      - name: Validate source and diff
        run: |
          set -euo pipefail
          test -s backend/src/automation-entry.ts
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('backend/src/automation-entry.ts', 'utf8');
          const normalized = source.replace(/\s+/g, ' ');
          const nonEmptyLines = source.split(/\r?\n/).filter((line) => line.trim().length > 0).length;
          const bearerFirst = 'request.headers.get("authorization")?.replace(/^Bearer\\s+/i, "") || readCookie(request, SESSION_COOKIE)';

          if (!source.includes('revoked_at IS NULL')) {
            throw new Error('Session revocation guard is missing');
          }
          if (!normalized.includes(bearerFirst)) {
            throw new Error('Bearer-first authentication expression is missing after formatting');
          }
          if (nonEmptyLines <= 20) {
            throw new Error(`automation-entry.ts appears truncated or compressed: ${nonEmptyLines} non-empty lines`);
          }
          if (normalized.includes('readCookie(request, SESSION_COOKIE) || request.headers.get("authorization")')) {
            throw new Error('Cookie-first authentication precedence remains');
          }
          NODE
          git diff --check
          npm --prefix backend run check
          git diff --check

      - name: Commit repaired source and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-automation-entry.yml
          git add backend/src/automation-entry.ts
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- backend/src/automation-entry.ts
          git commit -m 'fix(auth): normalize automation entry authentication'
          git push
