name: Temporary Admin Isolation Patch
on:
  push:
    branches:
      - fix/admin-attendance-day-isolation
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch admin attendance scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/attendance-engine.ts')
          text = path.read_text()
          old = '''else {checkIn=rows.find(r=>String(r.type)==="check-in")||null;checkOut=[...rows].reverse().find(r=>String(r.type)==="check-out")||null;}'''
          new = '''else {const scopedRows=schedule.work&&schedule.start&&schedule.end?rows.filter((r:any)=>{const ts=Date.parse(String(r.timestamp));return Number.isFinite(ts)&&ts>=schedule.start!.getTime()&&ts<schedule.end!.getTime();}):[];checkIn=scopedRows.find(r=>String(r.type)==="check-in")||null;checkOut=[...scopedRows].reverse().find(r=>String(r.type)==="check-out")||null;}'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif 'const scopedRows=schedule.work&&schedule.start&&schedule.end?' in text:
              print('Patch already applied; continuing without a commit.')
          else:
              raise SystemExit('Expected attendance-engine admin scope pattern was not found; refusing unsafe edit.')
          PY
      - name: Verify source structure
        run: |
          grep -F 'const scopedRows=schedule.work&&schedule.start&&schedule.end?' backend/src/attendance-engine.ts
          if grep -F 'else {checkIn=rows.find(r=>String(r.type)==="check-in")||null;checkOut=[...rows].reverse().find(r=>String(r.type)==="check-out")||null;}' backend/src/attendance-engine.ts; then exit 1; fi
          git diff --check
      - name: Validate Worker bundle
        working-directory: backend
        run: |
          npm install --package-lock=false
          npm run check
      - name: Commit patch
        run: |
          if git diff --quiet -- backend/src/attendance-engine.ts; then
            echo 'No source change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/attendance-engine.ts
          git commit -m 'fix: isolate admin attendance to scheduled shift'
          git push