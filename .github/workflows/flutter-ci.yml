name: Hadir Flutter CI

on:
  push:
    branches:
      - flutter-mobile-app
      - 'perf/flutter-*'
      - 'fix/flutter-*'
      - 'feat/flutter-*'
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - flutter-mobile-app
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and compile Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Verify Android debug build
        run: flutter build apk --debug --no-pub
