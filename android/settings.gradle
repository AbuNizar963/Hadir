pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

rootProject.name = "hadir"
include ":app"

// Flutter's engine artifacts are generated locally by the Flutter SDK and are
// not published to Maven Central/Google Maven. Keep this repository available
// to Gradle dependency resolution for Flutter embedding and native artifacts.
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("${flutterSdkPath}/bin/cache/artifacts/engine") }
    }
}
