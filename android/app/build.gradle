plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def releaseKeystore = System.getenv('HADIR_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('HADIR_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('HADIR_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('HADIR_RELEASE_KEY_PASSWORD')
def versionCodeOverride = project.findProperty('hadirVersionCode')?.toString() ?: System.getenv('HADIR_VERSION_CODE')
def versionNameOverride = project.findProperty('hadirVersionName')?.toString() ?: System.getenv('HADIR_VERSION_NAME')
def releaseSigningConfigured = [
    releaseKeystore,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def isAppBundleBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('bundle')
}

android {
    namespace 'com.hadir.attendance'
    compileSdk flutter.compileSdkVersion
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.hadir.attendance'
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode(
            versionCodeOverride
                ? versionCodeOverride.toInteger()
                : flutter.versionCode
        )
        versionName versionNameOverride ?: flutter.versionName
    }

    splits {
        abi {
            // ABI splits are useful for APK distribution. App Bundles already
            // generate optimized splits and must not combine with per-ABI APK
            // resource-shrinker outputs in the same bundle task.
            enable !isAppBundleBuild
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
        }
    }
}

flutter { source '../..' }
