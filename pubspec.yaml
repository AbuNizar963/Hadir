name: hadir
description: HADIR native Flutter mobile app for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  excel: ^4.0.6
  flutter_image_compress: ^2.5.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.1
  geolocator: ^14.0.2
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.19
  mobile_scanner: ^7.0.1
  pdf: ^3.11.3
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  share_plus: ^12.0.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # HADIR brand asset used by native manager and employee shells.
    - assets/branding/hadir_logo_transparent.png
