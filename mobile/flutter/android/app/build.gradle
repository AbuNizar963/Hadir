plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.hadir.attendance'
    compileSdk flutter.compileSdkVersion
    ndkVersion '28.2.13676358'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.hadir.attendance'
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName '1.0.0'
    }

    def releaseKeystore = System.getenv('HADIR_RELEASE_KEYSTORE')
    def releaseStorePassword = System.getenv('HADIR_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('HADIR_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('HADIR_RELEASE_KEY_PASSWORD')

    if (releaseKeystore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
        signingConfigs {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter { source '../..' }
